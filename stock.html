<html lang="ru"><head>
<script>/* Слой данных: Supabase вместо базы Claude. Тот же интерфейс window.claude.use('db'|'user'|'downloads'|'mcp'). */
(()=>{
const URL_='https://teysgklvfzzfdozdtqkd.supabase.co',PUB='sb_publishable_Urb9ajGZ_a-G-uCnXAPLqw_6xNe6_jC';
const SK='crm_sb_session';let sess=null,prof=null,loginP=null,refP=null;
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
async function auth(grant,body){
  const r=await fetch(URL_+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:PUB,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||j.error||'Ошибка входа');
  sess={at:j.access_token,rt:j.refresh_token,exp:Date.now()+(j.expires_in-60)*1000,uid:j.user.id};lsSet(SK,JSON.stringify(sess));return sess;
}
async function token(){
  if(!sess)throw {code:'unauthenticated'};
  if(Date.now()>sess.exp){if(!refP)refP=auth('refresh_token',{refresh_token:sess.rt}).finally(()=>{refP=null});try{await refP}catch(e){if(sess&&Date.now()<=sess.exp)return sess.at;if(e instanceof TypeError)throw {code:'unavailable',message:'нет связи'};sess=null;lsSet(SK,null);location.reload();throw {code:'unauthenticated'}}}
  return sess.at;
}
async function rest(path,opt={}){
  const t=await token();
  const r=await fetch(URL_+'/rest/v1/'+path,{method:opt.method||'GET',headers:{apikey:PUB,Authorization:'Bearer '+t,'Content-Type':'application/json',...(opt.headers||{})},body:opt.body?JSON.stringify(opt.body):undefined});
  if(!r.ok){const tx=await r.text();throw {code:r.status===401||r.status===403?'permission_denied':'bad_request',message:tx.slice(0,200)}}
  return r;
}
function loginUI(){
  return new Promise(res=>{
    const d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:#f4f6f4;display:flex;align-items:center;justify-content:center;font:15px -apple-system,BlinkMacSystemFont,sans-serif';
    d.innerHTML='<form style="background:#fff;padding:28px;border-radius:14px;box-shadow:0 4px 24px #0002;width:300px;display:grid;gap:12px"><b style="font-size:20px">CRM ФМРус</b><input id="lg_e" placeholder="Логин" autocomplete="username" style="padding:11px;font-size:16px;border:1px solid #bbb;border-radius:8px"><input id="lg_p" type="password" placeholder="Пароль" autocomplete="current-password" style="padding:11px;font-size:16px;border:1px solid #bbb;border-radius:8px"><button style="padding:12px;font-size:16px;border:0;border-radius:8px;background:#2f7d3b;color:#fff">Войти</button><div id="lg_m" style="color:#b00;min-height:18px"></div></form>';
    document.body.appendChild(d);
    d.querySelector('form').onsubmit=async ev=>{ev.preventDefault();const m=d.querySelector('#lg_m');m.textContent='';
      let e=d.querySelector('#lg_e').value.trim().toLowerCase();if(e&&!e.includes('@'))e+='@crm.fmrus.kz';
      try{await auth('password',{email:e,password:d.querySelector('#lg_p').value});d.remove();res()}catch(x){m.textContent=/invalid/i.test(x.message)?'Неверный логин или пароль':x.message}};
  });
}
async function ensureLogin(){
  if(loginP)return loginP;
  loginP=(async()=>{
    try{const s=JSON.parse(lsGet(SK)||'null');if(s){sess=s;await token()}}catch(e){sess=null}
    if(!sess){if(document.body)await loginUI();else await new Promise(r=>addEventListener('DOMContentLoaded',r)).then(loginUI)}
    const r=await rest('profiles?user_id=eq.'+sess.uid+'&select=old_uid,name,is_admin');const a=await r.json();
    if(!a.length)throw new Error('Нет профиля');prof=a[0];
  })();
  return loginP;
}
const rnd=()=>'n'+Math.random().toString(36).slice(2,10);
const enc=encodeURIComponent;
async function fetchColl(path,flt){
  const out=[];let from=0;
  for(;;){
    const r=await rest('docs?coll=eq.'+enc(path)+(flt||'')+'&select=id,data&order=id',{headers:{Range:from+'-'+(from+999)}});
    const a=await r.json();out.push(...a);if(a.length<1000)break;from+=1000;
  }
  return out;
}
const listeners=[];
function mkSnap(path,rows){
  const docs=rows.map(x=>({id:x.id,exists:true,data:()=>x.data,ref:docRef(path,x.id)}));
  return {docs,size:docs.length,empty:!docs.length,forEach:f=>docs.forEach(f)};
}
function docRef(path,id){
  id=id||rnd();
  return {id,path:path+'/'+id,
    async set(d){await ensureLogin();await rest('docs?on_conflict=coll,id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:{coll:path,id,data:JSON.parse(JSON.stringify(d)),updated_at:new Date().toISOString()}});bump(path)},
    async delete(){await ensureLogin();await rest('docs?coll=eq.'+enc(path)+'&id=eq.'+enc(id),{method:'DELETE',headers:{Prefer:'return=minimal'}});bump(path)},
    async get(){await ensureLogin();const r=await rest('docs?coll=eq.'+enc(path)+'&id=eq.'+enc(id)+'&select=data');const a=await r.json();return {id,exists:!!a.length,data:()=>a.length?a[0].data:undefined}},
    onSnapshot(cb,eb){
      let stop=false,last='';
      const run=async()=>{try{const r=await this.get();const s=JSON.stringify(r.data());if(s!==last){last=s;if(!stop)cb(r)}}catch(e){if(eb&&!stop)eb(e)}};
      const l={path,id,run};listeners.push(l);ensureLogin().then(run);return ()=>{stop=true;const i=listeners.indexOf(l);if(i>=0)listeners.splice(i,1)};
    }};
}
function collRef(path){return {
  doc:id=>docRef(path,id),
  async get(){await ensureLogin();return mkSnap(path,await fetchColl(path))},
  where(f,op,v){const o={'>=':'gte','==':'eq','>':'gt','<':'lt','<=':'lte'}[op]||'eq';
    return {async get(){await ensureLogin();return mkSnap(path,await fetchColl(path,'&data->>'+f+'='+o+'.'+enc(v)))}}},
  onSnapshot(cb,eb){
    let stop=false,sig=null;
    const run=async(force)=>{
      try{
        const r=await rest('docs?coll=eq.'+enc(path)+'&select=updated_at&order=updated_at.desc&limit=1',{headers:{Prefer:'count=exact'}});
        const a=await r.json();const s=(r.headers.get('content-range')||'')+'|'+(a[0]?a[0].updated_at:'');
        if(!force&&s===sig)return;sig=s;
        const rows=await fetchColl(path);if(!stop)cb(mkSnap(path,rows));
      }catch(e){if(eb&&!stop)eb(e)}
    };
    const l={path,run:()=>run(false),force:()=>run(true)};listeners.push(l);ensureLogin().then(()=>run(true));
    return ()=>{stop=true;const i=listeners.indexOf(l);if(i>=0)listeners.splice(i,1)};
  }
}}
function bump(path){setTimeout(()=>listeners.filter(l=>l.path===path).forEach(l=>(l.force||l.run)()),50)}
setInterval(()=>{if(document.hidden||!sess)return;listeners.forEach(l=>l.run())},20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&sess)listeners.forEach(l=>l.run())});
const db={collection:p=>collRef(p),doc:p=>{const i=p.lastIndexOf('/');return docRef(p.slice(0,i),p.slice(i+1))}};
const user={async me(){await ensureLogin();return {uid:prof.old_uid,name:prof.name,admin:!!prof.is_admin}},
  async access(){await ensureLogin();
    const g=await (await rest('grants?old_uid=eq.'+enc(prof.old_uid)+'&select=prefix')).json();
    const f=await (await rest('stk_flags?k=eq.public&select=v')).json();
    return {editor:g.some(x=>x.prefix==='stk/'||x.prefix==='dz/'),pub:!!(f[0]&&f[0].v)}},
  async id(){await ensureLogin();return prof.old_uid},async isOwner(){await ensureLogin();return !!prof.is_admin},
  async profiles(ids){await ensureLogin();const r=await rest('profiles?select=old_uid,name');const a=await r.json();const m={};a.forEach(x=>m[x.old_uid]=x.name);return Object.fromEntries(ids.map(i=>[i,{id:i,name:m[i]||''}]))}};
const downloads={async save({filename,data}){if(!(data instanceof Blob)){const x=(filename.split('.').pop()||'').toLowerCase();data=new Blob([data],{type:x==='html'?'text/html;charset=utf-8':x==='xlsx'?'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':x==='pdf'?'application/pdf':x==='csv'?'text/csv;charset=utf-8':'application/octet-stream'})}const a=document.createElement('a');a.href=URL.createObjectURL(data);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}};
window.claude={use:async n=>{if(n==='db'){await ensureLogin();return db}if(n==='user'){await ensureLogin();return user}if(n==='downloads')return downloads;return null}};
window.__sbLogout=()=>{lsSet(SK,null);location.reload()};
})();
</script>

.neg em{font-style:normal;font-size:11px;font-weight:500;margin-left:5px;background:var(--bad-soft);padding:1px 6px;border-radius:6px}

.chev{display:inline-block;width:14px;color:var(--muted)}
.tw tr.sub td{background:var(--surface2);padding:6px 12px 10px 38px}
.mini{width:auto;min-width:520px}.tw .mini th,.tw .mini td{padding:4px 14px 4px 0;border:0;background:none;text-transform:none;letter-spacing:0}
.chip{margin-left:6px;font-weight:500}
.tag{font-size:11.5px;color:var(--muted);background:var(--surface2);border-radius:6px;padding:1px 7px;margin-left:6px;white-space:nowrap}
.note{color:var(--muted);font-size:12.5px;margin:10px 2px 0;max-width:900px}
.pct{white-space:nowrap}.pct b{display:inline-block;width:48px;text-align:right;font-weight:600}
.flash{background:var(--good-soft);color:var(--good);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-weight:600}
.noacc{max-width:460px;margin:80px auto;text-align:center}
#drawer.open{position:fixed;inset:0;z-index:50}
#drawer .ov{position:absolute;inset:0;background:rgba(20,15,16,.45)}
#drawer .dp{position:absolute;right:0;top:0;bottom:0;width:min(560px,100%);background:var(--surface);padding:20px 22px 24px;overflow-y:auto;box-shadow:-8px 0 30px rgba(0,0,0,.25)}
#drawer h2{margin:0 0 14px;font-size:18px;color:var(--accent)}
#drawer h3{margin:14px 0 4px}
#drawer label{display:block;font-size:12px;color:var(--muted);margin-bottom:12px}
#drawer input:not([type=checkbox]),#drawer select{display:block;width:100%;margin-top:4px;padding:8px 10px;font-size:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
table.ed{width:100%}table.ed input{margin:0!important;padding:6px 8px!important;text-align:right;min-width:70px}
table.ed td,table.ed th{padding:6px;border:0;text-align:right;background:none;position:static}
table.ed th:first-child,table.ed td:first-child{text-align:left}
.calc{background:var(--accent-soft);border-radius:8px;padding:10px 12px;margin:2px 0 14px;font-size:13px}
.actions{display:flex;gap:8px;margin-top:16px;align-items:center}.actions .sp{flex:1}
#err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}
.warnline{color:var(--warn);font-size:12.5px;margin:-6px 0 12px}
.drop{display:block;border:2px dashed var(--line);border-radius:10px;padding:30px 16px;text-align:center;color:var(--muted);cursor:pointer;background:var(--surface2)}
.drop:hover{border-color:var(--accent);color:var(--ink)}.drop input{display:none!important}
.sumrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.sumrow span{background:var(--surface2);border-radius:8px;padding:5px 10px;font-size:13px}
.sumrow span.a{background:var(--good-soft);color:var(--good)}.sumrow span.c{background:var(--warn-soft);color:var(--warn)}.sumrow span.m{background:var(--bad-soft);color:var(--bad)}
.dl{margin:0 0 14px;padding:0;list-style:none;font-size:13px}.dl li{padding:5px 0;border-bottom:1px solid var(--line)}.dl li small{display:inline;margin-left:6px}
.chk2{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink);margin:6px 0 0}
.chk2 input{display:inline-block!important;width:auto!important;margin:2px 0 0!important;flex:none}
@media(max-width:700px){.tools input[type=search]{width:100%}.g2{grid-template-columns:1fr}}
a.btn{color:var(--ink)}a.btn:visited{color:var(--ink)}

  <div><h1><b>CRM</b><i class="vbar"></i><span>ОСТАТКИ И ДЕБИТОРКА</span></h1><small>ВАШ АРХИТЕКТОР УРОЖАЯ</small></div></div>
 <div class="row">
  <a class="btn" href="./" style="text-decoration:none">← CRM</a>
  <span class="muted" id="who"></span>
  <button class="btn" id="out">Выйти</button>
 </div>
</div>
<nav class="tabs" id="tabs" role="tablist"></nav>
<div id="app"><main id="view"></main></div>
</div>
<div id="drawer"></div>
<script>(async()=>{
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=1)=>Number(n).toLocaleString('ru-RU',{maximumFractionDigits:d});
const mln=n=>(n/1e6).toLocaleString('ru-RU',{minimumFractionDigits:1,maximumFractionDigits:1});
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/[\s ]/g,'').replace(',','.'));return isFinite(n)?n:0;};
const sgn=n=>n<0?'−'+fmt(-n):fmt(n);
const fdate=s=>s?s.slice(8,10)+'.'+s.slice(5,7)+'.'+s.slice(0,4):'—';
const dayDiff=(a,b)=>Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/864e5);
const todayISO=()=>{const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')};
const rnd=()=>Math.random().toString(36).slice(2,9);
const WH=['Кокшетау','Петропавловск','Костанай','Алматы'];

const db=await window.claude.use('db'),user=await window.claude.use('user');
const ME=await user.me(),ACC=await user.access();
if(!(ME.admin||ACC.editor||ACC.pub)){
  $('#app').innerHTML='<div class="noacc"><h2 style="color:var(--accent)">Нет доступа</h2><p>Раздел «Остатки и дебиторка» пока открыт только для руководства и бухгалтерии.</p><p><a class="btn" href="./" style="text-decoration:none">← В CRM</a></p></div>';
  return;
}
const EDIT=!!ACC.editor,SEESALL=ME.admin||ACC.editor;
$('#who').textContent=ME.name;

const D={stock:[],contractors:[],managers:[],meta:{}};
const S={page:location.hash==='#dz'?'dz':'stock',wh:'all',q:'',onlyStock:false,onlyDef:false,sort:{k:'name',d:1},open:new Set(),
 dzView:'mgr',dzBranch:'all',dzMgr:'all',dzOver:false,dzQ:'',dzOpen:new Set(),drawer:null,flash:'',dirty:false};
const loaded=new Set();
const REPORT=()=>D.meta.dzDate||todayISO();

/* ---------- запись ---------- */
const strip=o=>{const c={...o};delete c.id;return c};
const put=(coll,id,data)=>db.doc(coll+'/'+id).set(data);
const del=(coll,id)=>db.doc(coll+'/'+id).delete();
const mgrByName=n=>D.managers.find(m=>m.name===n);
function viewersFor(name){const m=mgrByName(name);if(!m)return[];
  const u=[m.uid,...(m.leaders||[]).map(n=>(mgrByName(n)||{}).uid)];return[...new Set(u.filter(Boolean))];}
const stamp=x=>{const n=new Date();return 'сегодня '+String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')+', '+ME.name+(x||'')};
async function saveMeta(patch){D.meta={...D.meta,...patch};await put('stk/meta','upd',D.meta)}

/* ---------- расчёты ---------- */
function calc(p,wi){let c=0,s=0,sold=0,free=0;
  p.w.forEach((w,i)=>{if(wi<0||wi===i){c+=w.c;s+=w.s;sold+=w.p;free+=w.s-(w.c-w.p);}});
  return{c,s,sold,free};}
const whIdx=()=>S.wh==='all'?-1:WH.indexOf(S.wh);
const dzEnd=c=>c.start-c.paid;
function mgrStat(m){const cs=D.contractors.filter(c=>c.manager===m.name);
  const dz=sum(cs,dzEnd),over=sum(cs,c=>c.overdue);
  return{m,dz,over,realized:m.realized,paid:m.realized-dz,pct:m.realized>0?(m.realized-dz)/m.realized*100:null,n:cs.filter(c=>dzEnd(c)>0).length};}
const tone=p=>p==null?'':p>=75?'g':p>=50?'a':'r';
const pctCell=p=>p==null?'<span class="muted">—</span>':`<span class="pct"><b>${fmt(p,0)}%</b> <span class="bar ${tone(p)}"><i style="width:${Math.max(0,Math.min(100,p))}%"></i></span></span>`;
const accessPill=()=>EDIT?'<span class="pill ok">Доступ: просмотр и редактирование</span>':'<span class="pill">Доступ: только просмотр</span>';
const flash=()=>{const f=S.flash;S.flash='';return f?`<div class="flash">${esc(f)}</div>`:''};
const fdt=d=>d?fdate(d):'—';

/* ---------- каркас ---------- */
function refresh(){if(S.drawer){S.dirty=true;return}render()}
function render(){
  $('#tabs').innerHTML=[['stock','Остатки СЗР'],['dz','Дебиторка']].map(([k,n])=>`<button class="tab" role="tab" aria-selected="${S.page===k}" data-act="tab" data-t="${k}">${n}</button>`).join('');
  const m=$('#view');
  if(loaded.size<4){m.innerHTML='<div class="empty">Загрузка…</div>';return}
  if(S.page==='stock'){m.innerHTML=stockPage();stockTable()}else{m.innerHTML=dzPage();dzTable()}
  renderDrawer();
}

/* ---------- ОСТАТКИ ---------- */
function stockPage(){
  const wi=whIdx(),all=D.stock.map(p=>calc(p,wi));
  const c=sum(all,x=>x.c),sold=sum(all,x=>x.sold),s=sum(all,x=>x.s),free=sum(all,x=>x.free),def=all.filter(x=>x.free<0).length;
  return `<div class="head"><div><h2>Остатки СЗР</h2><div class="sub">Состояние на ${D.meta.stockDate?fdate(D.meta.stockDate):'—'} · обновлено: ${esc(D.meta.stock||'—')} · единицы: литры / кг</div></div><div class="sp"></div>${accessPill()}${EDIT?'<button class="btn" data-act="import">Загрузить из 1С</button><button class="btn pri" data-act="add-stock">+ Добавить препарат</button>':''}</div>${flash()}
  <div class="kpis">
    <div class="kpi"><div class="l">Законтрактовано</div><div class="v">${fmt(c)}</div></div>
    <div class="kpi"><div class="l">Продано</div><div class="v">${fmt(sold)}</div><div class="s">${c?fmt(sold/c*100,0):0}% от контрактов</div></div>
    <div class="kpi"><div class="l">Остаток на складах</div><div class="v">${fmt(s)}</div></div>
    <div class="kpi"><div class="l">Свободно к продаже</div><div class="v">${sgn(free)}</div><div class="s">остаток − (контракты − продано)</div></div>
    <div class="kpi ${def?'bad':''}"><div class="l">Не хватает под контракты</div><div class="v">${def}<small>${def===1?'препарат':'препаратов'}</small></div><div class="s">свободно меньше нуля</div></div>
  </div>
  <div class="tools">
    <input type="search" id="q" placeholder="Найти препарат…" value="${esc(S.q)}" aria-label="Поиск препарата">
    <span class="seg" role="group" aria-label="Склад">${['all',...WH].map(w=>`<button data-act="wh" data-w="${w}" class="${S.wh===w?'on':''}">${w==='all'?'Все склады':w}</button>`).join('')}</span>
    <label class="chk"><input type="checkbox" data-act="onlyStock" ${S.onlyStock?'checked':''}> Только в наличии</label>
    <label class="chk"><input type="checkbox" data-act="onlyDef" ${S.onlyDef?'checked':''}> Только «не хватает»</label>
  </div>
  <div id="tbl"></div>
  <p class="note">«Свободно к продаже» = остаток на складе − (законтрактовано − уже продано). Минус значит: под контракты нужно больше, чем лежит на складе. ${S.wh!=='all'?'Препараты без движения на этом складе скрыты. ':'Нажмите на строку — увидите разбивку по складам. '}</p>`;
}
function stockTable(){
  const wi=whIdx(),all=S.wh==='all';
  let rows=D.stock.map(p=>({p,...calc(p,wi)}));
  const q=S.q.trim().toLowerCase();
  if(q)rows=rows.filter(r=>r.p.name.toLowerCase().includes(q));
  if(!all)rows=rows.filter(r=>r.c||r.s||r.sold);
  if(S.onlyStock)rows=rows.filter(r=>r.s>0);
  if(S.onlyDef)rows=rows.filter(r=>r.free<0);
  const k=S.sort.k,d=S.sort.d;
  const val=r=>k==='name'?r.p.name.toLowerCase():k==='plan'?r.p.plan:r[k];
  rows.sort((a,b)=>{const x=val(a),y=val(b);return(typeof x==='string'?x.localeCompare(y,'ru'):x-y)*d;});
  const th=(key,label,cls='n')=>`<th class="s ${cls}" tabindex="0" data-act="sort" data-k="${key}">${label}${S.sort.k===key?(S.sort.d>0?' ▲':' ▼'):''}</th>`;
  const cols=(all?7:6)+(EDIT?1:0);
  const body=rows.map(r=>{
    const open=all&&S.open.has(r.p.id),pc=r.c>0?r.sold/r.c*100:null;
    let h=`<tr class="${all?'r':''}" ${all?`data-act="toggle" data-id="${esc(r.p.id)}"`:''}>
     <td>${all?`<span class="chev">${open?'▾':'▸'}</span>`:''}<b>${esc(r.p.name)}</b></td>
     ${all?`<td class="n">${r.p.plan?fmt(r.p.plan):'<span class="muted">—</span>'}</td>`:''}
     <td class="n">${fmt(r.c)}</td>
     <td class="n"><div class="sold"><span>${fmt(r.sold)}</span><span class="bar"><i style="width:${pc==null?0:Math.min(100,pc)}%"></i></span><small>${pc==null?'—':fmt(pc,0)+'%'}</small></div></td>
     <td class="n">${fmt(r.s)}</td>
     <td class="n">${r.free<0?`<span class="neg">${sgn(r.free)}<em>не хватает</em></span>`:r.free===0?'<span class="muted">0</span>':fmt(r.free)}</td>
     ${EDIT?`<td class="n"><button class="ib" title="Изменить" aria-label="Изменить ${esc(r.p.name)}" data-act="edit-stock" data-id="${esc(r.p.id)}">✎</button></td>`:''}</tr>`;
    if(open)h+=`<tr class="sub"><td colspan="${cols}"><table class="mini"><thead><tr><th>Склад</th><th class="n">Контракты</th><th class="n">Продано</th><th class="n">Остаток</th><th class="n">Свободно</th></tr></thead><tbody>${
      r.p.w.map((w,i)=>{const f=w.s-(w.c-w.p);return`<tr><td>${WH[i]}</td><td class="n">${fmt(w.c)}</td><td class="n">${fmt(w.p)}</td><td class="n">${fmt(w.s)}</td><td class="n ${f<0?'neg':''}">${sgn(f)}</td></tr>`;}).join('')}</tbody></table></td></tr>`;
    return h;}).join('');
  const t={c:sum(rows,r=>r.c),sold:sum(rows,r=>r.sold),s:sum(rows,r=>r.s),free:sum(rows,r=>r.free),plan:sum(rows,r=>r.p.plan)};
  $('#tbl').innerHTML=`<div class="tw"><table><thead><tr>${th('name','Препарат','')}${all?th('plan','План сезона'):''}${th('c','Законтрактовано')}${th('sold','Продано')}${th('s','Остаток на складе')}${th('free','Свободно к продаже')}${EDIT?'<th></th>':''}</tr></thead>
   <tbody>${body||`<tr><td colspan="${cols}" class="muted" style="padding:26px;text-align:center">${D.stock.length?'Ничего не найдено':'Список пуст'+(EDIT?'. Загрузите выгрузку из 1С или добавьте препарат.':'')}</td></tr>`}</tbody>
   <tfoot><tr><td>Итого · ${rows.length} поз.</td>${all?`<td class="n">${fmt(t.plan)}</td>`:''}<td class="n">${fmt(t.c)}</td><td class="n">${fmt(t.sold)}</td><td class="n">${fmt(t.s)}</td><td class="n">${sgn(t.free)}</td>${EDIT?'<td></td>':''}</tr></tfoot></table></div>`;
}

    <div class="kpi"><div class="l">Оплачено</div><div class="v">${mln(paid)}<small>млн</small></div></div>
    <div class="kpi"><div class="l">% сбора</div><div class="v">${pc==null?'—':fmt(pc,1)+'%'}</div><span class="bar lg ${tone(pc)}"><i style="width:${Math.max(0,Math.min(100,pc||0))}%"></i></span></div>

  <div class="tools">

    ${S.dzView==='ctr'?`<input type="search" id="dq" placeholder="Найти контрагента…" value="${esc(S.dzQ)}" aria-label="Поиск контрагента">
    <select id="dbr" aria-label="Филиал"><option value="all">Все филиалы</option>${brs.map(b=>`<option${S.dzBranch===b?' selected':''}>${esc(b)}</option>`).join('')}</select>
    ${mg.length>1?`<select id="dmg" aria-label="Менеджер"><option value="all">Все менеджеры</option>${mg.map(b=>`<option${S.dzMgr===b?' selected':''}>${esc(b)}</option>`).join('')}</select>`:''}

function dueHTML(c){
  const d=fdate(c.deadline);if(!c.deadline||dzEnd(c)<=0)return d;

  if(left<0)return`${d}<span class="chip pill" style="background:var(--bad-soft);color:var(--bad)">просрочен ${-left} дн.</span>`;
  if(left<=10)return`${d}<span class="chip pill" style="background:var(--warn-soft);color:var(--warn)">через ${left} дн.</span>`;
  return d;}

function openDrawer(kind,id,m){
  let draft;
  if(kind==='stock'){const p=id?D.stock.find(x=>x.id===id):{name:'',plan:0,w:WH.map(()=>({c:0,s:0,p:0}))};
    draft={name:p.name,plan:p.plan||'',w:p.w.map(w=>({c:w.c||'',s:w.s||'',p:w.p||''}))};}
  else if(kind==='ctr'){const c=id?D.contractors.find(x=>x.id===id):{name:'',branch:'Кокшетау',manager:(D.managers[0]||{}).name||'',start:0,paid:0,overdue:0,deadline:'',prepayDate:'',prepaySum:0};
    draft={name:c.name,branch:c.branch,manager:c.manager,start:c.start||'',paid:c.paid||'',overdue:c.overdue||'',deadline:c.deadline||'',prepayDate:c.prepayDate||'',prepaySum:c.prepaySum||''};}
  else{const mm=D.managers.find(x=>x.name===m);draft={realized:mm.realized};}
  S.drawer={kind,id,m,draft,sure:false};renderDrawer();
  const f=document.querySelector('#drawer input,#drawer select');if(f)f.focus();
}
function closeDrawer(){S.drawer=null;renderDrawer();if(S.dirty){S.dirty=false;render()}}
function renderDrawer(){
  const el=$('#drawer'),d=S.drawer;
  if(!d){el.className='';el.innerHTML='';return;}

  if(d.kind==='stock'){const p=d.draft;

    <div class="g2"><label>Название<input data-f="name" value="${esc(p.name)}" autocomplete="off"></label>

    <table class="ed"><thead><tr><th>Склад</th><th>Контракты</th><th>Продали</th><th>Остаток</th><th>Свободно</th></tr></thead><tbody>
    ${WH.map((w,i)=>`<tr><td>${w}</td>${['c','p','s'].map(f=>`<td><input data-f="w${i}${f}" inputmode="decimal" value="${esc(p.w[i][f])}" aria-label="${w}: ${f==='c'?'контракты':f==='p'?'продали':'остаток'}"></td>`).join('')}<td class="n" id="fr${i}"></td></tr>`).join('')}
    </tbody><tfoot><tr><td><b>Всего</b></td><td class="n" id="tc"></td><td class="n" id="tp"></td><td class="n" id="ts"></td><td class="n" id="tf"></td></tr></tfoot></table>
    <p class="note">Свободно считается само: остаток − (контракты − продали).</p>`;}
  else if(d.kind==='ctr'){const c=d.draft;
    body=`<h2>${d.id?'Изменить контрагента':'Новый контрагент'}</h2>
    <label>Контрагент<input data-f="name" value="${esc(c.name)}" autocomplete="off"></label>
    <div class="g2"><label>Филиал<select data-f="branch">${WH.map(b=>`<option${c.branch===b?' selected':''}>${b}</option>`).join('')}</select></label>
    <label>Менеджер<select data-f="manager">${D.managers.map(m=>`<option${c.manager===m.name?' selected':''}>${esc(m.name)}</option>`).join('')}</select></label>
    <label>ДЗ на начало, ₸<input data-f="start" inputmode="decimal" value="${esc(c.start)}"></label>
    <label>Оплачено, ₸<input data-f="paid" inputmode="decimal" value="${esc(c.paid)}"></label>
    <label>Просрочено, ₸<input data-f="overdue" inputmode="decimal" value="${esc(c.overdue)}"></label>
    <label>Окончательный срок погашения<input type="date" data-f="deadline" value="${esc(c.deadline)}"></label>
    <label>Сумма предоплаты, ₸<input data-f="prepaySum" inputmode="decimal" value="${esc(c.prepaySum)}"></label>
    <label>Дата предоплаты<input type="date" data-f="prepayDate" value="${esc(c.prepayDate)}"></label></div>
    <div class="calc">Остаток ДЗ на конец: <b id="cend"></b> ₸ · % погашено: <b id="cpct"></b></div><div class="warnline" id="cwarn"></div>`;}
  else{body=`<h2>Реализация по менеджеру</h2><p style="margin:-6px 0 14px"><b>${esc(d.m)}</b></p>
    <label>Реализовано за сезон, ₸<input data-f="realized" inputmode="decimal" value="${esc(d.draft.realized)}"></label>
    <div class="calc">Остаток ДЗ (по контрагентам): <b id="mdz"></b> ₸<br>Оплачено: <b id="mpaid"></b> ₸ · % сбора: <b id="mpct"></b></div><div class="warnline" id="mwarn"></div>`;}
  el.className='open';
  el.innerHTML=`<div class="ov" data-act="close"></div><aside class="dp" role="dialog" aria-modal="true">${body}<div id="err" role="alert">${esc(d.err||'')}</div>
   <div class="actions"><button class="btn pri" data-act="save" ${d.busy?'disabled':''}>${d.busy?'Сохраняю…':'Сохранить'}</button><button class="btn" data-act="close">Отмена</button><span class="sp"></span>${d.id&&d.kind!=='mgr'?`<button class="btn del ${d.sure?'sure':''}" data-act="del">${d.sure?'Точно удалить?':'Удалить'}</button>`:''}</div></aside>`;
  calcDrawer();
}
function calcDrawer(){
  const d=S.drawer;if(!d||d.kind==='import')return;const x=d.draft,set=(i,t,c)=>{const e=document.getElementById(i);if(e){e.textContent=t;if(c!==undefined)e.className='n '+c;}};
  if(d.kind==='stock'){let tc=0,tp=0,ts=0,tf=0;
    x.w.forEach((w,i)=>{const c=num(w.c),p=num(w.p),s=num(w.s),f=s-(c-p);tc+=c;tp+=p;ts+=s;tf+=f;set('fr'+i,sgn(f),f<0?'neg':'');});
    set('tc',fmt(tc));set('tp',fmt(tp));set('ts',fmt(ts));set('tf',sgn(tf),tf<0?'neg':'');}
  else if(d.kind==='ctr'){const s=num(x.start),p=num(x.paid),e=s-p;
    set('cend',fmt(e,0));set('cpct',s>0?fmt(p/s*100,0)+'%':'—');
    const w=document.getElementById('cwarn');if(w)w.textContent=p>s?'Оплачено больше, чем ДЗ на начало — проверьте цифры.':num(x.overdue)>e?'Просрочено больше, чем остаток ДЗ — проверьте цифры.':'';}
  else{const dz=sum(D.contractors.filter(c=>c.manager===d.m),dzEnd),r=num(x.realized),p=r-dz;
    set('mdz',fmt(dz,0));set('mpaid',fmt(p,0));set('mpct',r>0?fmt(p/r*100,1)+'%':'—');
    const w=document.getElementById('mwarn');if(w)w.textContent=r<dz?'Реализация меньше, чем долг контрагентов — проверьте цифры.':'';}
}
async function save(){
  const d=S.drawer,x=d.draft,err=m=>{d.err=m;$('#err').textContent=m;return false;};
  if(d.busy)return;
  try{
    if(d.kind==='stock'){
      const name=x.name.trim();if(!name)return err('Укажите название препарата.');
      if(D.stock.some(p=>p.id!==d.id&&p.name.toLowerCase()===name.toLowerCase()))return err('Препарат с таким названием уже есть.');
      if(x.w.some(w=>num(w.c)<0||num(w.p)<0||num(w.s)<0))return err('Количества не могут быть отрицательными.');
      const rec={name,plan:num(x.plan),w:x.w.map(w=>({c:num(w.c),s:num(w.s),p:num(w.p)}))};
      d.busy=true;renderDrawer();
      const id=d.id||'i'+rnd();await put('stk/items',id,rec);
      const i=D.stock.findIndex(p=>p.id===id);if(i>=0)D.stock[i]={...rec,id};else{D.stock.push({...rec,id});S.wh='all';S.q=''}
      await saveMeta({stock:stamp()});}
    else if(d.kind==='ctr'){
      const name=x.name.trim();if(!name)return err('Укажите контрагента.');
      const rec={name,branch:x.branch,manager:x.manager,start:num(x.start),paid:num(x.paid),overdue:num(x.overdue),deadline:x.deadline||null,prepayDate:x.prepayDate||null,prepaySum:num(x.prepaySum),viewers:viewersFor(x.manager)};
      if(rec.paid>rec.start)return err('Оплачено больше, чем ДЗ на начало.');
      if(rec.overdue>rec.start-rec.paid)return err('Просрочено больше, чем остаток ДЗ.');
      d.busy=true;renderDrawer();
      const id=d.id||'c'+rnd();await put('dz/contractors',id,rec);
      const i=D.contractors.findIndex(c=>c.id===id);if(i>=0)D.contractors[i]={...rec,id};else D.contractors.push({...rec,id});
      await saveMeta({dz:stamp()});}
    else{const r=num(x.realized);if(r<0)return err('Сумма не может быть отрицательной.');
      d.busy=true;renderDrawer();
      const m=D.managers.find(z=>z.name===d.m),rec={...strip(m),realized:r};await put('dz/managers',m.id,rec);m.realized=r;
      await saveMeta({dz:stamp()});}
  }catch(e){d.busy=false;d.err='Не удалось сохранить: '+((e&&e.message)||'нет связи')+' Попробуйте ещё раз.';renderDrawer();return;}
  S.drawer=null;S.dirty=false;render();
}
async function remove(){const d=S.drawer;
  if(!d.sure){d.sure=true;renderDrawer();return;}
  try{
    if(d.kind==='stock'){await del('stk/items',d.id);D.stock=D.stock.filter(p=>p.id!==d.id);await saveMeta({stock:stamp()});}
    else{await del('dz/contractors',d.id);D.contractors=D.contractors.filter(c=>c.id!==d.id);await saveMeta({dz:stamp()});}
  }catch(e){d.err='Не удалось удалить: '+((e&&e.message)||'нет связи');renderDrawer();return;}
  S.drawer=null;S.dirty=false;render();}

/* ---------- Загрузка выгрузки из 1С (.xlsx читается прямо в браузере) ---------- */
const key=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
const nn=v=>typeof v==='number'?v:num(v);
const str=v=>v==null?'':String(v).trim();
const colIdx=r=>{let n=0;for(const ch of r.replace(/\d/g,''))n=n*26+ch.charCodeAt(0)-64;return n-1;};
function pd(v){if(v==null||v==='')return null;
  if(typeof v==='number')return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);
  const m=/(\d{1,2})\.(\d{1,2})\.(\d{4})/.exec(String(v));return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:null;}
async function unzip(buf){
  const u=new Uint8Array(buf),dv=new DataView(buf);let e=u.length-22;
  while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw new Error('Это не файл Excel (.xlsx).');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const files={};
  for(let i=0;i<n;i++){const nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true);
    files[new TextDecoder().decode(u.subarray(p+46,p+46+nl))]={m:dv.getUint16(p+10,true),z:dv.getUint32(p+20,true),o:dv.getUint32(p+42,true)};p+=46+nl+el+cl;}
  return async name=>{const f=files[name];if(!f)return null;
    const start=f.o+30+dv.getUint16(f.o+26,true)+dv.getUint16(f.o+28,true),data=u.subarray(start,start+f.z);
    if(f.m===0)return new TextDecoder().decode(data);
    return await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();};
}
async function readSheet(file,pick){
  const get=await unzip(await file.arrayBuffer()),X=s=>new DOMParser().parseFromString(s,'application/xml');
  const wb=X(await get('xl/workbook.xml')),rels=X(await get('xl/_rels/workbook.xml.rels'));
  const RNS='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const sheets=[...wb.getElementsByTagName('sheet')].map(s=>({name:s.getAttribute('name'),rid:s.getAttributeNS(RNS,'id')||s.getAttribute('r:id')}));
  const sh=pick(sheets.map(s=>s.name));const meta=sheets.find(s=>s.name===sh)||sheets[0];
  const rel=[...rels.getElementsByTagName('Relationship')].find(r=>r.getAttribute('Id')===meta.rid);
  let tg=rel.getAttribute('Target');tg=tg.startsWith('/')?tg.slice(1):'xl/'+tg;
  const ssx=await get('xl/sharedStrings.xml'),ss=ssx?[...X(ssx).getElementsByTagName('si')].map(si=>[...si.getElementsByTagName('t')].map(t=>t.textContent).join('')):[];
  const rows=[];
  for(const c of X(await get(tg)).getElementsByTagName('c')){
    const ref=c.getAttribute('r'),r=+ref.replace(/\D/g,''),ci=colIdx(ref),t=c.getAttribute('t'),v=c.getElementsByTagName('v')[0];
    let val=null;
    if(t==='inlineStr')val=[...c.getElementsByTagName('t')].map(x=>x.textContent).join('');
    else if(v){const raw=v.textContent;val=t==='s'?ss[+raw]:t==='str'||t==='e'?raw:t==='b'?raw==='1':parseFloat(raw);}
    if(val==null||(typeof val==='string'&&val.startsWith('#')))continue;
    (rows[r]=rows[r]||[])[ci]=val;}
  return rows;
}
const MONTHS={января:1,февраля:2,марта:3,апреля:4,мая:5,июня:6,июля:7,августа:8,сентября:9,октября:10,ноября:11,декабря:12};
function titleDate(s,re){const m=re.exec(String(s||'').toLowerCase());if(!m)return null;
  if(m.length===4&&MONTHS[m[2]])return `${m[3]}-${String(MONTHS[m[2]]).padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  if(m.length===4)return `${m[3]}-${m[2]}-${m[1]}`;return null;}
function parseStock(rows){
  const h=rows[3]||[];if(!h.some(v=>key(v)==='кокшетау'))throw new Error('Не похоже на файл остатков: не нашёл строку со складами (Кокшетау, Петропавловск…). Нужен лист «Остатки».');
  const out=[];
  for(let r=5;r<rows.length;r++){const x=rows[r];if(!x)continue;const name=str(x[0]);if(!name)continue;if(/^итого/i.test(name))break;
    out.push({name,plan:nn(x[17]),w:[1,5,9,13].map(b=>({c:nn(x[b]),s:nn(x[b+1]),p:nn(x[b+2])}))});}
  if(!out.length)throw new Error('В файле не найдено ни одного препарата.');
  return{items:out,date:titleDate((rows[1]||[])[0],/на\s+(\d{1,2})\s+([а-я]+)\s+(\d{4})/)};
}
function parseDz(rows){
  const h=rows[4]||[];if(key(h[1])!=='контрагент')throw new Error('Не похоже на файл дебиторки: не нашёл колонки «Контрагент».');
  let branch=null;const cs=[],ms=[];
  for(let r=5;r<rows.length;r++){const x=rows[r];if(!x)continue;const B=str(x[1]),L=str(x[11]),N=str(x[13]);
    if(B&&WH.includes(B)&&!L){branch=B;continue;}
    if(N&&N.includes('.')&&branch&&!WH.includes(N))ms.push({name:N,branch,realized:nn(x[14])});
    if(B&&L)cs.push({name:B,branch,manager:L,start:nn(x[2]),paid:nn(x[5]),deadline:pd(x[7]),prepayDate:pd(x[8]),prepaySum:nn(x[9]),overdue:nn(x[10])});}
  if(!cs.length)throw new Error('В файле не найдено ни одного контрагента.');
  return{cs,ms,date:titleDate((rows[2]||[])[1],/по\s+(\d{2})\.(\d{2})\.(\d{4})/)};
}
const LB={c:'контракты',p:'продано',s:'остаток'};
function diffStock(inc){
  const cur=new Map(D.stock.map(p=>[key(p.name),p])),seen=new Set(),add=[],chg=[];
  for(const n of inc.items){const k=key(n.name);seen.add(k);const c=cur.get(k);if(!c){add.push(n);continue;}
    const d=[];if(c.plan!==n.plan)d.push(`план ${fmt(c.plan)} → ${fmt(n.plan)}`);
    n.w.forEach((w,i)=>['c','p','s'].forEach(f=>{if(c.w[i][f]!==w[f])d.push(`${WH[i]}, ${LB[f]}: ${fmt(c.w[i][f])} → ${fmt(w[f])}`);}));
    if(d.length)chg.push({c,n,d,name:c.name});}
  return{add,chg,miss:D.stock.filter(p=>!seen.has(key(p.name))),total:inc.items.length};
}
function diffDz(inc){
  const cur=new Map(D.contractors.map(c=>[key(c.name),c])),seen=new Set(),add=[],chg=[];
  for(const n of inc.cs){const k=key(n.name);seen.add(k);const c=cur.get(k);if(!c){add.push(n);continue;}
    const d=[];
    if(c.manager!==n.manager)d.push(`менеджер: ${c.manager} → ${n.manager}`);
    if(c.branch!==n.branch)d.push(`филиал: ${c.branch} → ${n.branch}`);
    [['start','ДЗ на начало'],['paid','оплачено'],['overdue','просрочено'],['prepaySum','предоплата']].forEach(([f,l])=>{if(c[f]!==n[f])d.push(`${l}: ${fmt(c[f],0)} → ${fmt(n[f],0)}`);});
    if((c.deadline||null)!==n.deadline)d.push(`срок: ${fdate(c.deadline)} → ${fdate(n.deadline)}`);
    if((c.prepayDate||null)!==n.prepayDate)d.push(`дата предоплаты: ${fdate(c.prepayDate)} → ${fdate(n.prepayDate)}`);
    if(d.length)chg.push({c,n,d,name:c.name});}
  const mchg=inc.ms.filter(m=>{const c=D.managers.find(x=>x.name===m.name);return !c||c.realized!==m.realized;});
  return{add,chg,miss:D.contractors.filter(c=>!seen.has(key(c.name))),mchg,total:inc.cs.length};
}
async function handleFile(f){
  const d=S.drawer;if(!d||d.kind!=='import')return;
  try{
    if(!/\.xlsx$/i.test(f.name))throw new Error('Нужен файл Excel формата .xlsx.');
    const rows=await readSheet(f,names=>d.target==='stock'?(names.find(n=>key(n)==='остатки')||names[0]):names[0]);
    d.inc=d.target==='stock'?parseStock(rows):parseDz(rows);
    d.diff=d.target==='stock'?diffStock(d.inc):diffDz(d.inc);
    d.fname=f.name;d.phase='preview';d.err='';d.rm=false;
  }catch(err){d.err=err.message||'Не удалось прочитать файл.';d.phase='pick';}
  renderDrawer();
}
function importHTML(d){
  const stock=d.target==='stock',what=stock?'остатки':'дебиторку';
  if(d.phase==='pick')return`<h2>Загрузить ${what} из 1С</h2>
   <p class="note" style="margin-top:-6px">Возьмите выгрузку в том же виде, как сейчас: ${stock?'файл с листом «Остатки»':'отчёт «ДЗ за период» (лист TDSheet)'}. Файл читается прямо в браузере. Перед записью вы увидите, что изменится.</p>
   <label class="drop"><input type="file" id="imp" accept=".xlsx"><b>Выберите файл .xlsx</b><br><small>или перетащите его сюда</small></label>
   <div id="err" role="alert">${esc(d.err)}</div><div class="actions"><button class="btn" data-act="close">Отмена</button></div>`;
  const df=d.diff,nA=df.add.length,nC=df.chg.length,nM=df.miss.length,nMg=stock?0:df.mchg.length;
  const removing=d.rm?nM:0,none=!nA&&!nC&&!removing&&!nMg&&!(d.inc.date&&d.inc.date!==(stock?D.meta.stockDate:D.meta.dzDate));
  const li=(a,fn)=>a.slice(0,12).map(fn).join('')+(a.length>12?`<li class="muted">…и ещё ${a.length-12}</li>`:'');
  const nm=x=>esc(x.name);
  const newMg=stock?[]:[...new Set(df.add.map(x=>x.manager).concat(df.chg.map(x=>x.n.manager)).concat(d.inc.ms.map(m=>m.name)))].filter(n=>!D.managers.some(m=>m.name===n));
  return`<h2>Что изменится</h2><p class="note" style="margin-top:-6px">Файл: <b>${esc(d.fname)}</b> · строк в файле: ${df.total}${d.inc.date?` · данные на ${fdate(d.inc.date)}`:''}</p>
  <div class="sumrow"><span class="a">Новых: ${nA}</span><span class="c">Изменится: ${nC}${nMg?` + итоги менеджеров: ${nMg}`:''}</span><span class="m">Нет в файле: ${nM}</span></div>
  ${none?'<div class="calc">Файл совпадает с тем, что уже в CRM, — записывать нечего.</div>':''}
  ${newMg.length?`<div class="warnline" style="margin:0 0 12px">Новые менеджеры без учётной записи в CRM (${newMg.map(esc).join(', ')}): их долги видят только руководство и бухгалтерия.</div>`:''}
  ${nA?`<h3>Новые ${stock?'препараты':'контрагенты'}</h3><ul class="dl">${li(df.add,x=>`<li>${nm(x)}${stock?'':`<small>${esc(x.manager)} · ${fmt(x.start-x.paid,0)} ₸</small>`}</li>`)}</ul>`:''}
  ${nC?`<h3>Изменятся</h3><ul class="dl">${li(df.chg,x=>`<li><b>${nm(x)}</b><br><small>${esc(x.d.slice(0,3).join(' · '))}${x.d.length>3?` · и ещё ${x.d.length-3}`:''}</small></li>`)}</ul>`:''}
  ${nMg?`<h3>Реализация по менеджерам</h3><ul class="dl">${df.mchg.map(m=>{const c=D.managers.find(x=>x.name===m.name);return`<li>${esc(m.name)}<small>${c?fmt(c.realized,0)+' → ':'новый · '}${fmt(m.realized,0)}</small></li>`;}).join('')}</ul>`:''}
  ${nM?`<h3>Есть в CRM, но нет в файле</h3><ul class="dl">${li(df.miss,x=>`<li>${nm(x)}</li>`)}</ul>
   <label class="chk2"><input type="checkbox" data-act="rm" ${d.rm?'checked':''}> <span>Удалить из CRM то, чего нет в файле. По умолчанию они остаются как есть.</span></label>`:''}
  <div id="err" role="alert">${esc(d.err||'')}</div>
  <div class="actions"><button class="btn pri" data-act="apply" ${none||d.busy?'disabled':''}>${d.busy?'Записываю…':'Применить'}</button><button class="btn" data-act="imp-again" ${d.busy?'disabled':''}>Другой файл</button><button class="btn" data-act="close" ${d.busy?'disabled':''}>Отмена</button></div>`;
}
async function many(fns){for(let i=0;i<fns.length;i+=8)await Promise.all(fns.slice(i,i+8).map(f=>f()))}
async function applyImport(){
  const d=S.drawer,df=d.diff;if(!df||d.busy)return;d.busy=true;d.err='';renderDrawer();let msg;
  try{
    if(d.target==='stock'){
      const ops=[];
      df.chg.forEach(x=>ops.push(()=>put('stk/items',x.c.id,{name:x.c.name,plan:x.n.plan,w:x.n.w})));
      const added=df.add.map(n=>({id:'i'+rnd(),...n}));
      added.forEach(n=>ops.push(()=>put('stk/items',n.id,{name:n.name,plan:n.plan,w:n.w})));
      if(d.rm)df.miss.forEach(p=>ops.push(()=>del('stk/items',p.id)));
      await many(ops);
      df.chg.forEach(x=>{x.c.plan=x.n.plan;x.c.w=x.n.w});D.stock.push(...added);
      if(d.rm)D.stock=D.stock.filter(p=>!df.miss.includes(p));
      await saveMeta({stock:stamp(', загрузка из 1С'),...(d.inc.date?{stockDate:d.inc.date}:{})});S.wh='all';
      msg=`Остатки обновлены: новых ${df.add.length}, изменено ${df.chg.length}${d.rm?`, удалено ${df.miss.length}`:''}.`;}
    else{
      const mops=[];
      for(const m of d.inc.ms){const c=D.managers.find(x=>x.name===m.name);
        if(c){if(c.realized!==m.realized){c.realized=m.realized;mops.push(()=>put('dz/managers',c.id,strip(c)));}}
        else{const nm={id:'m'+rnd(),name:m.name,branch:m.branch,realized:m.realized,uid:'',leaders:[],viewers:[]};D.managers.push(nm);mops.push(()=>put('dz/managers',nm.id,strip(nm)));}}
      for(const n of [...df.add,...df.chg.map(x=>x.n)])if(!D.managers.some(m=>m.name===n.manager)){
        const nm={id:'m'+rnd(),name:n.manager,branch:n.branch,realized:0,uid:'',leaders:[],viewers:[]};D.managers.push(nm);mops.push(()=>put('dz/managers',nm.id,strip(nm)));}
      await many(mops);
      const ops=[];
      df.chg.forEach(x=>{const rec={...strip(x.c),...x.n,viewers:viewersFor(x.n.manager)};Object.assign(x.c,rec);ops.push(()=>put('dz/contractors',x.c.id,rec));});
      const added=df.add.map(n=>({id:'c'+rnd(),...n,viewers:viewersFor(n.manager)}));
      added.forEach(n=>ops.push(()=>put('dz/contractors',n.id,strip(n))));
      if(d.rm)df.miss.forEach(c=>ops.push(()=>del('dz/contractors',c.id)));
      await many(ops);
      D.contractors.push(...added);if(d.rm)D.contractors=D.contractors.filter(c=>!df.miss.includes(c));
      await saveMeta({dz:stamp(', загрузка из 1С'),...(d.inc.date?{dzDate:d.inc.date}:{})});
      msg=`Дебиторка обновлена: новых ${df.add.length}, изменено ${df.chg.length}${d.rm?`, удалено ${df.miss.length}`:''}.`;}
  }catch(e){d.busy=false;d.err='Не удалось записать: '+((e&&e.message)||'нет связи')+'. Часть данных могла записаться — загрузите файл ещё раз, повторная загрузка безопасна.';renderDrawer();return;}
  S.flash=msg;S.drawer=null;S.dirty=false;render();
}

/* ---------- события ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t||t.tagName==='INPUT')return;const a=t.dataset.act;
  if(a==='tab'){S.page=t.dataset.t;location.hash=S.page==='dz'?'dz':'stock';render();}
  else if(a==='wh'){S.wh=t.dataset.w;render();}
  else if(a==='sort'){const k=t.dataset.k;S.sort=S.sort.k===k?{k,d:-S.sort.d}:{k,d:k==='name'?1:-1};stockTable();}
  else if(a==='toggle'){const id=t.dataset.id;S.open.has(id)?S.open.delete(id):S.open.add(id);stockTable();}
  else if(a==='dzview'){S.dzView=t.dataset.v;render();}
  else if(a==='dzopen'){const m=t.dataset.m;S.dzOpen.has(m)?S.dzOpen.delete(m):S.dzOpen.add(m);dzTable();}
  else if(!EDIT)return;
  else if(a==='add-stock')openDrawer('stock',null);
  else if(a==='edit-stock')openDrawer('stock',t.dataset.id);
  else if(a==='add-ctr')openDrawer('ctr',null);
  else if(a==='edit-ctr')openDrawer('ctr',t.dataset.id);
  else if(a==='edit-mgr')openDrawer('mgr',null,t.dataset.m);
  else if(a==='import'){S.drawer={kind:'import',target:S.page==='stock'?'stock':'dz',phase:'pick',rm:false,err:''};renderDrawer();}
  else if(a==='imp-again'){S.drawer.phase='pick';S.drawer.err='';renderDrawer();}
  else if(a==='apply')applyImport();
  else if(a==='save')save();
  else if(a==='del')remove();
});
document.addEventListener('click',e=>{const t=e.target.closest('[data-act="close"]');if(t&&S.drawer&&!S.drawer.busy)closeDrawer();});
document.addEventListener('change',e=>{
  const t=e.target,a=t.dataset&&t.dataset.act;
  if(t.id==='imp'){if(t.files[0])handleFile(t.files[0]);return;}
  if(a==='rm'){S.drawer.rm=t.checked;renderDrawer();return;}
  if(a==='onlyStock'){S.onlyStock=t.checked;stockTable();}
  else if(a==='onlyDef'){S.onlyDef=t.checked;stockTable();}
  else if(a==='dzover'){S.dzOver=t.checked;dzTable();}
  else if(t.id==='dbr'){S.dzBranch=t.value;dzTable();}
  else if(t.id==='dmg'){S.dzMgr=t.value;dzTable();}
  else if(t.dataset&&t.dataset.f&&S.drawer&&t.tagName==='SELECT'){S.drawer.draft[t.dataset.f]=t.value;}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){S.q=t.value;stockTable();return;}
  if(t.id==='dq'){S.dzQ=t.value;dzTable();return;}
  const f=t.dataset&&t.dataset.f;if(!f||!S.drawer)return;const x=S.drawer.draft;
  const m=/^w(\d)([cps])$/.exec(f);
  if(m)x.w[+m[1]][m[2]]=t.value;else x[f]=t.value;
  calcDrawer();
});
document.addEventListener('dragover',e=>{if(S.drawer&&S.drawer.kind==='import')e.preventDefault();});
document.addEventListener('drop',e=>{if(S.drawer&&S.drawer.kind==='import'){e.preventDefault();const f=e.dataTransfer.files[0];if(f)handleFile(f);}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.drawer&&!S.drawer.busy)closeDrawer();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('th.s')){e.preventDefault();e.target.click();}
  if(e.key==='Enter'&&S.drawer&&S.drawer.kind!=='import'&&e.target.tagName==='INPUT')save();
});
window.addEventListener('hashchange',()=>{const p=location.hash==='#dz'?'dz':'stock';if(p!==S.page){S.page=p;render()}});
$('#out').onclick=()=>window.__sbLogout();

/* ---------- подписки на данные ---------- */
const sub=(path,fn)=>db.collection(path).onSnapshot(s=>{const a=[];s.forEach(d=>a.push({...d.data(),id:d.id}));fn(a);loaded.add(path);refresh()},e=>{console.error(path,e);loaded.add(path);refresh()});
sub('stk/items',a=>D.stock=a);
sub('dz/contractors',a=>D.contractors=a);
sub('dz/managers',a=>D.managers=a);
sub('stk/meta',a=>{const u=a.find(x=>x.id==='upd');D.meta=u?strip(u):{}});
render();
})();
</script>
