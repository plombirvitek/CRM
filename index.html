oup":"Гербициды","status":"Новая регистрация 2027","source":"Список препаратов 2026–2028","regs":[{"crop":"Кукуруза","dose":"0,8–1,0 л/га","target":"Однолетние и многолетние двудольные и злаковые сорные растения","cropTags":["Кукуруза"],"objClass":"Сорняки","objTags":[],"technology":"Не применяется","method":"Опрыскивание посевов в фазе 3–6 листьев культуры и ранние фазы роста сорных растений. Расход рабочей жидкости - 200–300 л/га. Срок ожидания / кратность обработок: 85(1).","regYear":2027},{"crop":"Сахарная свекла (гибриды, устойчивые к гербициду Конвизо 1)","dose":"0,5 л/га","target":"Однолетние и многолетние двудольные и злаковые сорные растения","cropTags":["Свекла сахарная"],"objClass":"Сорняки","objTags":[],"technology":"Конвизо 1","method":"Последовательное опрыскивание посевов в фазе от семядолей до 2 листьев сорных растений (по первой, второй и третьей волне). Срок ожидания / кратность обработок: 85(3).","regYear":2027},{"crop":"Сахарная свекла (гибриды, устойчивые к гербициду Конвизо 1)","dose":"0,75 л/га","target":"Однолетние и многолетние двудольные и злаковые сорные растения","cropTags":["Свекла сахарная"],"objClass":"Сорняки","objTags":[],"technology":"Конвизо 1","method":"Последовательное опрыскивание посевов в фазе от 2-х до 4-х листьев сорных растений (по первой и второй волне). Срок ожидания / кратность обработок: 85(2).","regYear":2027},{"crop":"Сахарная свекла (гибриды, устойчивые к гербициду Конвизо 1)","dose":"1,5 л/га","target":"Однолетние и многолетние двудольные и злаковые сорные растения","cropTags":["Свекла сахарная"],"objClass":"Сорняки","objTags":[],"technology":"Конвизо 1","method":"Опрыскивание посевов в фазе 6 настоящих листьев культуры и ранние фазы роста сорных растений. В случае пересева в год применения можно высевать кукурузу, свеклу сахарную (гибриды, устойчивые к гербициду Конвизо 1). Осенью в год применения высевать только пшеницу озимую. Весной следующего года сев чувствительных культур: свекла (сахарная, столовая и кормовая), рапс, подсолнечник, гречиха, бобовые и овощные культуры разрешен при условии достаточного увлажнения почвы. При посеве чувствительных культур обязательна глубокая вспашка. Нельзя высевать чувствительные культуры, если сумма осадков за период от применения гербицида до посева менее 350 мм. На почвах с pH 7,5 и выше ограничение срока высева указанных чувствительных культур увеличивается до двух лет после применения препарата. При севе ячменя ярового в условиях недостатка влаги (если сумма осадков за период от применения до посева менее 300 мм) возможно незначительное отставание в росте. Расход рабочей жидкости 200–300 л/га. Срок ожидания / кратность обработок: 85(1).","regYear":2027}],"active":"клопиралид, 50 г/л + форамсульфурон, 50 г/л + тиенкарбазон-метил, 25 г/л + антидот ципросульфамид, 25 г/л","catalogInfo":{"meta":{"package":"Пластиковая канистра емкостью 5 л.","storage":"2 года","temperature":"от 0°C до +25 °C"},"sections":{"Механизм действия":"Кросс-спектральный системный гербицид с ярко выраженным почвенным действием. Форамсульфурон и тиенкарбазон-метил блокируют фермент ацетолактатсинтазу (ALS), останавливая синтез незаменимых аминокислот. Клопиралид выступает в роли синтетического ауксина, нарушая процессы дыхания и деления клеток. Входящий в состав антидот ципросульфамид катализирует быстрый метаболизм действующих веществ в тканях кукурузы, обеспечивая высокую безопасность для культуры без снижения гербицидной активности против сорняков.","Спектр действия":"Гербицид широкого спектра действия для борьбы с однолетними и многолетними двудольными и злаковыми сорными растениями в посевах сахарной свеклы (устойчивых к гербициду Конвизо 1, МД) и кукурузы.","Скорость действия":"Рост чувствительных сорняков прекращается в течение нескольких часов после обработки. Первые видимые признаки (пожелтение, антоциановый окрас, скручивание листьев) проявляются через 3–5 дней. Полная гибель наступает через 2–3 недели в зависимости от погодных условий.","Период защитного действия":"Благодаря наличию тиенкарбазон-метила обладает длительным почвенным эффектом (от 4 до 6 недель), сдерживая последующие «волны» всходов сорных растений и обеспечивая чистоту посевов вплоть до смыкания рядков культуры.","Совместимость":"Препарат самодостаточен и не требует добавления ПАВ (за счет смесевой препаративной формы МД). Может совмещаться в баковых смесях с фунгицидами и инсектицидами. Не рекомендуется смешивать с фосфорорганическими инсектицидами, а также с жидкими азотными удобрениями и микроэлементами.","Возможность возникновения резистентности":"Риск возникновения устойчивости минимален благодаря сочетанию действующих веществ с разным механизмом действия (ALS-ингибиторы + синтетические ауксины). Для предотвращения резистентности рекомендуется соблюдать севооборот и чередовать применение с гербицидами других химических классов.","Рекомендации по применению":"Кукуруза - Опрыскивание посевов в фазе 3–6 листьев культуры и ранние фазы роста сорных растений. Сахарная свекла (гибриды, устойчивые к гербициду Конвизо 1): норма расхода 0,5 л/га - Последовательное опрыскивание посевов в фазе от семядолей до 2 листьев сорных растений (по первой, второй и третьей волне); норма расхода 0,75 л/га - Последовательное опрыскивание посевов в фазе от 2-х до 4-х листьев сорных растений (по первой и второй волне); норма расхода 1,5 л/га - Опрыскивание посевов в фазе 6 настоящих листьев культуры и ранние фазы роста сорных растений.\nПри посеве чувствительных культур обязательна глубокая вспашка. Нельзя высевать чувствительные культуры, если сумма осадков за период от применения гербицида до посева менее 350 мм. На почвах с pH 7,5 и выше ограничение срока высева указанных чувствительных культур увеличивается до двух лет после применения препарата. При севе ячменя ярового в условиях недостатка влаги (если сумма осадков за период от применения до посева менее 300 мм) возможно незначительное отставание в росте.","Расход рабочей жидкости":"200–300 л/га"},"advantages":["Максимальный синергизм: Три взаимодополняющих действующих вещества обеспечивают тотальный контроль как злакового, так и двудольного засорения, включая злостные многолетники (пырей, осоты).","Мощный почвенный экран: Надежная защита от последующих всходов сорняков за счет выраженного грунтового действия, что снижает необходимость в повторных обработках.","Абсолютная селективность: Наличие встроенного высокоэффективного антидота ципросульфамида гарантирует отсутствие фитотоксичности и мягкое действие на культуру даже в поздние фазы применения.","Совершенная масляная формуляция (МД): Отличное удерживание рабочего раствора на поверхности листьев, быстрое проникновение через восковой налет и высокая устойчивость к смыву осадками."]}},{"name":"Кумпарсита","group":"Гербициды","status":"Регистрация 2026","source":"Список препаратов 2026–2028","regs":[{"crop":"Соя","dose":"0,6–1,2 л/га","target":"Однолетние и многолетние злаковые сорняки","method":"Опрыскивание посевов в фазе 2–4 листьев у однолетних злаковых сорняков при высоте многолетних сорняков 10–15 см.","cropTags":["Соя"],"objTags":["Злаковые сорняки"],"objClass":"Сорняки","technology":"Не применяется"},{"crop":"Гречиха","dose":"0,6–1,2 л/га","target":"Однолетние и многолетние злаковые сорняки","method":"Опрыскивание посевов в фазе 2–4 листьев у однолетних злаковых сорняков при высоте многолетних сорняков 10–15 см. Расход рабочей жидкости 50–300 л/га.","cropTags":["Гречиха"],"objTags":["Злаковые сорняки"],"objClass":"Сорняки","technology":"Не применяется"},{"crop":"Картофель","dose":"0,6–1,2 л/га","target":"Однолетние и многолетние злаковые сорняки","method":"Опрыскивание посевов в фазе 2–4 листьев у однолетних злаковых сорняков при высоте многолетних сорняков 10–15 см.","cropTags":["Картофель"],"objTags":["Злаковые сорняки"],"objClass":"Сорняки","technology":"Не применяется","regYear":2026},{"crop":"Рапс","dose":"0,6–1,2 л/га","target":"Однолетние и многолетние злаковые сорняки","method":"Опрыскивание посевов в фазе 2–4 листьев у однолетних злаковых сорняков при высоте многолетних сорняков 10–15 см. Расход рабочей жидкости 100–300 л/га.","cropTags":["Рапс"],"objTags":["Злаковые сорняки"],"objClass":"Сорняки","technology":"Классическая","regYear":2026}],"active":"хизалофоп-п-этил, 125 г/л","catalogInfo":{"meta":{"purpose":"Послевсходовый системный граминицид для борьбы практически со всеми злаковыми сорняками на посевах технических, овощных, зернобобовых и других культур","package":"Канистра 5 л","storage":"4 года","temperature":"от –20 до +35 °C"},"sections":{"Механизм действия":"Обладает системной активностью. Кумпарсита очень быстро поглощается листьями и другими надземными частями сорняков и переносится к точкам роста побегов и корневищ. Препарат нарушает синтез липидов, что приводит к гибели растения. Гербицид влияет только на сорняки, встречающиеся в посевах в момент обработки. Он не проникает через почву и не оказывает воздействия на сорные растения, появившиеся после опрыскивания.","Спектр действия":"Однолетние злаковые сорняки – лисохвост, метлица, овсюг обыкновенный, просо куриное, канареечник, щетинник сизый, щетинник зеленый, росичка кровяная, плевел, костер, мятлик однолетний, самосевы зерновых. Многолетние злаковые – пырей ползучий, свинорой пальчатый, гумай, полевица белая, мятлик обыкновенный, ветвянка, тростник обыкновенный.","Период защитного действия":"При соблюдении технологии выращивания сельскохозяйственных культур обеспечивает защиту посевов от однолетних злаковых сорняков с момента обработки до конца вегетационного периода. Эффективность препарата может снижаться при выпадении осадков в течение двух часов после обработки.","Скорость действия":"Первые симптомы угнетения сорняков появляются через 7–10 суток после опрыскивания в виде остановки роста и пожелтения верхушек побегов. Позже появляется антоциановая окраска листьев. Полная гибель сорных растений наступает через 1–3 недели после обработки (в зависимости от вида сорняков и погодных условий).","Возможность возникновения резистентности":"Случаев возникновения резистентности к гербициду не отмечалось. Во избежание ее возникновения рекомендуется чередовать применение препарата с гербицидами других химических классов.","Рекомендации по применению":"Наилучшие результаты дает опрыскивание активно растущих сорняков. Важно, чтобы на них было достаточно листьев для быстрого поглощения действующего вещества. Однолетние злаковые сорняки опрыскивают в фазе от 2–4 листьев до начала кущения, многолетние – с момента появления на них 4–6 листьев при достижении высоты 10–15 см. Не рекомендуется обрабатывать гербицидом культуры в состоянии стресса из-за мороза, повреждения насекомыми, недостаточного питания и др.","Приготовление рабочей жидкости":"Предварительно препарат перемешивают в заводской таре. Бак опрыскивателя заполняют примерно наполовину водой, включают мешалку, добавляют рассчитанное и отмеренное на одну заправку опрыскивателя количество препарата, продолжают заполнение бака опрыскивателя водой с одновременным перемешиванием. Перемешивание продолжают и во время обработки для обеспечения однородности рабочего раствора. При использовании Кумпарситы в баковых смесях с другими пестицидами рекомендуется сначала приготовить в отдельных емкостях маточные растворы препаратов, а затем по очереди смешать в баке опрыскивателя. Смешивать препараты в баке опрыскивателя нужно в следующем порядке: СП (водорастворимые пакеты) → СП → ВДГ (СТС) → СК (ВСК) → СЭ → Кумпарсита, КЭ → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → ВРК (ВР) → ПАВ."},"advantages":["Эффективное уничтожение практически всех видов злаковых сорняков","Применение без ограничений по стадиям развития культуры","Совместимость в баковых смесях с противодвудольными гербицидами"]}},{"name":"ЛАРТ","group":"Гербициды","status":"Регистрация 2026","source":"Список препаратов 2026–2028","regs":[{"crop":"Пшеница яровая и ячмень яровой","dose":"0,15–0,3 л/га","target":"Однолетние двудольные сорняки, в т.ч. устойчивые к 2,4-Д и МЦПА и некоторые многолетние двудольные, включая виды осота (бодяка и др.)","method":"Опрыскивание посевов в фазе кущения культуры, 2–4 листьев у однолетних сорняков и при высоте многолетников 15 см. Расход рабочей жидкости — 200–300 л/га.","cropTags":["Пшеница","Ячмень"],"objTags":["Двудольные сорняки","Осот"],"objClass":"Сорняки","technology":"Не применяется"},{"crop":"Кукуруза","dose":"0,4–0,8 л/га","target":"Однолетние двудольные сорняки, в т.ч. устойчивые к 2,4-Д и некоторые многолетние двудольные сорняки (включая виды осота, бодяка)","method":"Опрыскивание посевов в фазе 3–5 листьев культуры, 2–4 листьев у однолетних сорняков и при высоте многолетников 15 см. Применяется как самостоятельно, так и в качестве добавки к 2,4-Д. Расход рабочей жидкости — 150–400 л/га.","cropTags":["Кукуруза"],"objTags":["Двудольные сорняки","Осот"],"objClass":"Сорняки","technology":"Не применяется"}],"active":"дикамба, 480 г/л","catalogInfo":{"meta":{"purpose":"Гербицид широкого спектра действия для борьбы с однолетними и многолетними двудольными сорняками в посевах зерновых и кукурузы","package":"Канистра 5 л","storage":"2 года","temperature":"от 0 до +25 °C"},"sections":{"Механизм действия":"Дикамба проникает в растения сорняков через надземные органы и частично через корни, быстро распространяясь по всему растению и аккумулируясь в точках роста. Ларт вызывает нарушения гормонального баланса в растении, в результате чего возрастает скорость деления клеток, более интенсивно происходит процесс дыхания, корни утрачивают способность поглощать элементы питания. Всё это приводит к гибели сорняков.","Скорость действия":"Гербицидное действие проявляется на 2–5 день в виде хлорозов, угнетения и деформации растений. Полное отмирание сорных растений наступает через 15–30 суток.","Спектр действия":"Амброзия полыннолистная, бодяк полевой, василёк синий, вероника (виды), вика посевная, гречишка вьюнковая, горец почечуйный, горец птичий, горчица полевая, дескурайния Софьи, дымянка лекарственная, звездчатка средняя, канатник Теофраста, крестовник весенний, лебеда раскидистая, лютик (виды), мак самосейка, незабудка полевая, осот огородный, осот полевой, одуванчик лекарственный, паслён чёрный, пастушья сумка, пикульник (виды), подмаренник цепкий, портулак огородный, пролесник однолетний, просвирник (виды), пупавка полевая, редька дикая, торица полевая, фиалка полевая, чистец полевой, щирица (виды), ярутка полевая, яснотка стеблеобъемлющая, яснотка пурпурная, дурнишник (виды).","Рекомендации по применению":"Максимальная эффективность достигается при обработке в фазу 2–6 листьев у однолетних двудольных сорняков (высота 5–10 см), многолетних корнеотпрысковых — в фазу розетки — до начала стеблевания. Максимальную норму расхода следует использовать при высокой засорённости, по переросшим сорнякам и при наличии многолетних корнеотпрысковых сорняков. Оптимальная температура для применения препарата: от +12 до +25 °C. Для расширения спектра подавляемых сорняков на зерновых колосовых рекомендуется применять баковые смеси с препаратами на основе 2,4-Д (Эндимион), карфентразон-этила (Буцефал), на кукурузе — с римсульфуроном (Гримс).","Совместимость":"Совместим с другими пестицидами, кроме препаратов с сильнощелочной или кислой реакцией. Однако в каждом конкретном случае необходима проверка на совместимость.","Период защитного действия":"Действует только на сорняки, находившиеся в посевах в момент проведения обработки. На сорняки, взошедшие после проведения опрыскивания, препарат действует слабо.","Возможность возникновения резистентности":"Для предотвращения возникновения устойчивости к препарату необходимо чередовать его с гербицидами из других химических групп."},"advantages":["Высокая биологическая эффективность против широкого спектра двудольных сорняков","Подавляет сорняки, устойчивые к 2,4-Д и МЦПА","Обладает ярко выраженным синергическим эффектом в баковых смесях с препаратами на основе 2,4-Д, МЦПА, сульфонилмочевин, карфентразон-этила и глифосата","Избирателен по отношению к культуре"]}},{"name":"МЕТРИБУТ","group":"Гербициды","status":"Регистрация 2026","source":"Список препаратов 2026–2028","regs":[{"crop":"Картофель","dose":"0,6–1,2 + 0,35 л/га","target":"Однолетние двудольные и злаковые сорняки","method":"Опрыскивание почвы до всходов культуры с последующей обработкой при высоте ботвы 5 см. Расход рабочей жидкости 200–300 л/га.","cropTags":["Картофель"],"objClass":"Сорняки","objTags":["Злаковые сорняки","Двудольные сорняки"],"technology":"Не применяется"},{"crop":"Соя","dose":"0,4–0,8 л/га","target":"Однолетние двудольные и злаковые сорняки","method":"Опрыскивание почвы до всходов культуры.","cropTags":["Соя"],"objClass":"Сорняки","objTags":["Злаковые сорняки","Двудольные сорняки"],"technology":"Не применяется"}],"active":"метрибузин, 600 г/л","catalogInfo":{"meta":{"purpose":"Системный гербицид избирательного действия для борьбы с однолетними двудольными и злаковыми сорняками","package":"Канистра 5 л","storage":"3 года","temperature":"от –20 до +30 °C"},"sections":{"Механизм действия":"Метрибузин легко абсорбируется корнями и проростками растений, но может проникать и через листовую поверхность. Перемещается акропетально. Механизм действия основан на ингибировании транспорта электронов, участвующих в процессе фотосинтеза.","Спектр действия":"Василёк синий, виды мари, амброзия полыннолистная, ярутка полевая, дескурайния Софии, желтушник левкойный, кохия веничная, виды горца, жерушник болотный, галинсога мелкоцветная, пикульник обыкновенный, гулявник Лёзеля, портулак огородный, лебеда раскидистая, мятлик однолетний, лисохвост полевой, горчица полевая, просо куриное, чистец однолетний, щетинник, виды, дурнишник, виды, канатник Теофраста.","Период защитного действия":"Метрибузин эффективно подавляет проростки сорняков в почве, его применение позволяет отодвинуть появление второй «волны» сорняков. Гербицид обеспечивает чистоту посевов от сорняков на срок 1–2 месяца и более в зависимости от погодных условий в течение вегетационного периода и типа почвы.","Скорость действия":"Гербицид уничтожает сорняки в момент их прорастания (при довсходовом внесении) или в течение 10–20 суток при послевсходовом применении.","Совместимость":"Для расширения спектра действия и снижения норм расхода допустимо применять препарат в баковых смесях с другими пестицидами. Перед применением необходимо проверить смесь на совместимость и фитотоксичность по отношению к обрабатываемой культуре.","Рекомендации по применению":"Важно обращать внимание на сортовую устойчивость к метрибузину сортов или гибридов сои. Применяется довсходовое, послевсходовое и дробное внесение препарата. На сое — опрыскивание почвы до всходов культуры. На картофеле — опрыскивание почвы до всходов культуры с последующей обработкой при высоте ботвы 5 см. Картофель устойчив к препарату в рекомендованных регламентах использования. Опрыскивание проводят в начале появления всходов и в ранние фазы роста однолетних двудольных и злаковых сорняков. Период полураспада в почве 14–60 дней.","Ограничения по севообороту":"Без ограничений."},"advantages":["Уничтожает многие виды однолетних двудольных и некоторых злаковых сорняков","Эффективен в широком временном диапазоне","Удобен в использовании до и после всходов"]}},{"name":"ПАНАМЕРА","group":"Гербициды","status":"Регистрация 2026","source":"Список препаратов 2026–2028","regs":[{"crop":"Лён","dose":"0,75–1,0 л/га","target":"Однолетние и многолетние злаковые сорняки, в т.ч. пырей ползучий","cropTags":["Лён"],"objClass":"Сорняки","objTags":["Многолетние злаковые сорняки","Пырей ползучий","Злаковые сорняки"],"technology":"Не применяется","method":"Опрыскивание посевов в фазе 2–4 листьев однолетних сорняков и при высоте пырея ползучего 10–15 см.","regYear":2026},{"crop":"Соя","dose":"0,75–1,0 л/га","target":"Однолетние и многолетние злаковые сорняки","cropTags":["Соя"],"objClass":"Сорняки","objTags":["Многолетние злаковые сорняки","Злаковые сорняки"],"technology":"Не применяется","method":"Опрыскивание посевов в фазе 2–3 листьев до стеблевания у сорняков.","regYear":2026}],"active":"хизалофоп-п-тефурил, 70 г/л","catalogInfo":{"meta":{"purpose":"Однокомпонентный послевсходовый системный гербицид для борьбы с однолетними и многолетними злаковыми сорняками в посевах овощных, кормовых и технических культур","package":"Канистра 5 л","storage":"3 года","temperature":"от -10 до +30 °С"},"sections":{"Механизм действия":"Данный гербицид обладает отличной проникающей способностью. Благодаря этому стремительно разносится по всему организму сорняка, блокируя обмен липидов тем самым останавливая рост растений.","Рекомендации по применению":"Препарат вносят независимо от фазы развития культурных растений. Максимальная эффективность действия препарата наблюдается при применении его во время активного роста и развития сорняков. Это период от формирования 3 листьев до начала фазы кущения для однолетних злаковых и при высоте 10–20 см для многолетних злаковых сорняков. Не опрыскивайте препаратом Панамера культуры, испытывающие стресс, в том числе культуры, рост которых приостановился из-за внесенных ранее гербицидов, недостаточности питания, поражения насекомыми, воздействия ветра или мороза. Для уничтожения падалицы зерновых культур норма расхода не менее 1,5 л/га.","Совместимость":"Препарат совместим с большинством пестицидов и агрохимикатов, кроме продуктов, которые образуют щелочную среду (рН>5,5), но в каждом конкретном случае необходимо проводить предварительный тест на физико-химическую совместимость. В случаях применения препарата Панамера с фунгицидами на основе беномила и манкоцеба, добавлять в бак опрыскивателя гербицид Панамера следует только после полного растворения указанных фунгицидов.","Скорость воздействия":"Уже через неделю после обработки можно наблюдать первые видимые признаки действия препарата. Они проявляются в виде пожелтения листвы. Спустя 14–21 день после опрыскивания наступает полное уничтожение вредоносных растений."},"advantages":["Эффективен для уничтожения падалицы злаковых культур"]}},{"name":"Рисовод","group":"Гербициды","status":"Регистрация 2026","source":"Список препаратов 2026–2028","regs":[{"crop":"Рис","dose":"1,5–3,0 л/га","target":"Однолетние злаковые (просовидные), осоковые (в т.ч. клубнекамыш) и болотные широколистные (в т.ч. монохория, частуха, стрелолист и др.) сорные растения","method":"Опрыскивание посевов в фазе 2–4 листьев — конец кущения культуры и ранние фазы роста сорных растений (2–4 листа у злаковых и 5–7 листьев у осоковых). Расход рабочей жидкости — 200–300 л/га.","cropTags":["Рис"],"objClass":"Сорняки","objTags":["Злаковые сорняки","Осоковые сорняки"],"technology":"Не применяется"}],"active":"цигалофоп-бутил, 125 г/л + пеноксулам, 50 г/л + бенсульфурон-метил, 35 г/л","catalogInfo":{"meta":{"purpose":"Послевсходовый селективный гербицид системного действия для уничтожения злаковых и двудольных сорняков, в том числе резистентных популяций куриного проса в посевах риса","package":"Канистра 5 л","storage":"2 года","temperature":"от –5 до +35 °C"},"sections":{"Механизм действия":"Сочетание действующих веществ из трех химических классов с разным механизмом действия обеспечивают препарату высокую эффективность против злаковых сорняков, в том числе проявляющих устойчивость к традиционно используемым препаратам, и уменьшает риск развития резистентности. Цигалофоп-бутил является ингибитором ацетил-КоА карбоксилазы (АКК), фермента определяющего скорость биосинтеза жирных кислот, а также участвующего в синтезе сукцината, каротиноидов, стероидов и др. Пеноксулам служит ингибитором ацетолактатсинтазы (АЛС), важного элемента синтеза аминокислот — валина, лейцина и изолейцина. Механизм действия бенсульфурон-метила заключается в ингибировании образования ацетолактатсинтазы (ингибитор ALS).","Спектр действия":"Аммания, клубнекамыш компактный, клубнекамыш приморский, просо крупноплодное (рисовидное), просо куриное, просо рисовое, виды и формы проса, устойчивые к АЛС-ингибиторам, горец перечный, элевсина индийская (гусиная трава), лептохлоа, щетинник, камыш острый, камыш раскидистый, паспалум, сыть круглая, сыть разнородная, частуха обыкновенная.","Скорость действия":"Первые признаки действия препарата, в зависимости от вида сорняков, заметны через 3–5 дней после опрыскивания. Окончательного уничтожения сорняков можно ожидать через 2–3 недели после внесения, в зависимости от видового состава и стадии развития сорняков во время опрыскивания, густоты стояния культуры, условий окружающей среды до, во время и после опрыскивания.","Совместимость":"Не рекомендуется применять с другими средствами защиты растений без предварительного исследования.","Возможность возникновения резистентности":"Появление резистентности маловероятно.","Рекомендации по применению":"Рекомендовано авиационное опрыскивание посевов с нормой расхода рабочего раствора 50–100 л/га. Перед обработкой гербицидом необходимо снизить уровень воды в чеках до уровня, позволяющего освободить не менее 70% листовой поверхности сорняков. Лучшего эффекта можно достичь при полном отводе воды. Повторное затопление после обработки можно начинать в день обработки, минимум через два часа после внесения и не позднее чем через 3 дня после опрыскивания.","Период защитного действия":"Препарат действует на сорняки, имеющиеся в посевах при опрыскивании. При благоприятных условиях действие гербицида сохраняется в течение всего вегетационного периода.","Севооборот":"Без ограничений."},"advantages":["Высокая эффективность против широкого спектра сорных растений на рисе","Обладает высокой селективностью для всех видов риса","Не обладает фитотоксичностью","Обладает пролонгированным действием"]}},{"name":"СЕРП","group":"Гербициды","status":"Регистрация 2026","source":"Список препаратов 2026–2028","regs":[{"crop":"Соя","dose":"0,5–1,0 л/га","target":"Однолетние, многолетние злаковые и двудольные сорняки, в т.ч. виды амброзии","cropTags":["Соя"],"objClass":"Сорняки","objTags":["Двудольные сорняки"],"technology":"Не применяется","method":"Опрыскивание почвы до посева (с заделкой) или опрыскивание посевов в фазе 2–3 настоящих листьев культуры. В год применения препарата рекомендуется высевать озимую пшеницу; на следующий год – кукурузу, яровые и озимые зерновые; через два года все культуры.","regYear":2026},{"crop":"Горох","dose":"0,5–0,75 л/га","target":"Однолетние, многолетние злаковые и двудольные сорняки, в т.ч. виды амброзии","cropTags":["Горох"],"objClass":"Сорняки","objTags":["Двудольные сорняки"],"technology":"Не применяется","method":"Опрыскивание почвы в течение 2–3 дней после посева или по всходам культуры в фазе 3–6 листьев культуры. В год применения препарата рекомендуется высевать озимую пшеницу; на следующий год – кукурузу, яровые и озимые зерновые; через два года все культуры.","regYear":2026}],"active":"имазетапир, 100 г/л","catalogInfo":{"meta":{"purpose":"Гербицид против широкого спектра сорняков, применяемый в посевах сои и гороха","package":"Канистра 5 л","storage":"3 года","temperature":"от – 5 до +30 °С"},"sections":{"Механизм действия":"В состав гербицида Серп входит одно действующее вещество из химического класса имидозолиноны. Имазетапир проникает в растения через листья и корни, передвигаясь по ксилеме и флоэме и накапливаясь в участках меристемы. У чувствительных растений происходит ингибирование фермента ацетолактатсинтазы, что уменьшает в растительных тканях уровень изолейцина, валина и лейцина, с последующим нарушением синтеза нуклеиновых кислот и белка. Рост чувствительных сорняков прекращается уже спустя несколько часов после опрыскивания. Первые визуальные признаки гербицидного действия на сорняки появляются через 5–7 дней после применения гербицида. У однолетних двудольных сорняков наблюдается потеря тургора, пожелтение и бурение листьев; у однолетних злаковых сорняков наблюдается побурение и появление антацианового окраса растений.","Спектр действия":"Серп подавляет на посевах сои широкий спектр сорняков, который включает в себя виды щетинников, щирицы, горчицы, горцев, амброзии, повилик, а также куриного проса, канатника Теофраста, овсюга, осота розового, мари белой, ярутки полевой, молочая, редьки дикой и других видов.","Период защитного действия":"Обеспечивает защиту культурных растений в течение всего периода вегетации.","Скорость действия":"При использовании препарата после всходов культурных растений рост сорняков останавливается через несколько часов после обработки.","Рекомендации по применению":"Гербицид можно вносить при предпосевной (с неглубокой заделкой в почву), предвсходовой (после посева до всходов) и послевсходовой (сорняки в фазе 1–4 листьев) обработках. Способ применения гербицида зависит от культуры, почвенно-климатических условий и др. Наиболее эффективный способ применения гербицида Серп – раннее послевсходовое применение на посевах сои. В этот период двудольные сорняки не должны иметь более 4, а злаковые – более 2–3 листьев. Сорняки, которые активно растут и находятся в чувствительных к гербициду фазах развития, наиболее подвержены действию препарата. В этом случае не только достигается максимальная эффективность гербицида, но и предоставляется возможность существенно (на 25–50%) снизить норму его внесения Не рекомендуется применять препарат чаще чем 1 раз в 3 года на одном поле. Не рекомендуется после внесения препарата в течении всего сезона на обработанной площади применять препараты из группы производные сульфанилмочевины и имидазолинов. Не применять препарат в баковых смесях с другими противозлаковыми гербицидами. Препарат может оказать негативную активность на некоторые последующие культуры севооборота на протяжении: 4 месяца – озимая пшеница; 11 месяцев – кукуруза, ячмень, яровая пшеница, овес, озимая рожь; 18 месяцев – подсолнечник, сорго, рис, просо; 26 месяцев – свекла, рапс и овощные.","Совместимость":"Препарат не применяется в баковых смесях с граминицидами. Для повышения эффективности против умеренно чувствительных видов и переросших сорняков (более 6 листьев) рекомендуется использовать его совместно с ПАВ или с минеральными маслами."},"advantages":["Уничтожает максимально широкий спектр однолетних и многолетних злаковых и двудольных сорняков, в том числе карантинных","Однократная обработка полностью решает проблему уничтожения сорняков в течение всего периода вегетации культуры","Высокоэффективен при использовании различными способами","При применении по всходам растений гербицид абсорбируется и передвигается в точки роста уже в течение часа, что имеет большое значение в дождливую погоду"]}},{"name":"СМИЛОДОН","group":"Гербициды","status":"Регистрация 2026","source":"Список препаратов 2026–2028","regs":[{"crop":"Пшеница яровая и озимая","dose":"0,5–1,0 л/га","target":"Однолетние злаковые сорные растения (виды щетинника, просо куриное, просо сорнополевое, овсюг, метлица полевая, лисохвост)","cropTags":["Пшеница"],"objClass":"Сорняки","objTags":["Щетинник","Просо","Овсюг обыкновенный","Метлица полевая","Лисохвост","Злаковые сорняки"],"technology":"Не применяется","method":"Опрыскивание посевов по вегетирующим однолетним злаковым сорным растениям (от 2–3 листьев до конца кущения) независимо от фазы развития культуры. Расход рабочей жидкости — 200–300 л/га.","regYear":2026},{"crop":"Ячмень яровой и озимый","dose":"0,5–1,0 л/га","target":"Однолетние злаковые сорные растения (виды щетинника, просо куриное, просо сорнополевое, овсюг, метлица полевая, лисохвост)","cropTags":["Ячмень"],"objClass":"Сорняки","objTags":["Щетинник","Просо","Овсюг обыкновенный","Метлица полевая","Лисохвост","Злаковые сорняки"],"technology":"Не применяется","method":"Опрыскивание посевов по вегетирующим однолетним злаковым сорным растениям (от 2–3 листьев до конца кущения) независимо от фазы развития культуры. Расход рабочей жидкости — 200–300 л/га.","regYear":2026}],"active":"пиноксаден, 60 г/л + клоквинтосет-мексил, 15 г/л","catalogInfo":{"meta":{"purpose":"Системный гербицид для быстрого уничтожения широкого спектра злаковых сорняков в посевах пшеницы и ячменя","package":"Канистра 5 л","storage":"3 года","temperature":"от –15 до +35 °C"},"sections":{"Механизм действия":"Пиноксаден, действующее вещество препарата Смилодон, КЭ, в растение проникает через листья, транспортируется акропетально и базипетально.","Период защитного действия":"После обработки Смилодоном в посевах отмирают сорняки. Действие сохраняется до конца вегетационного сезона. Препарат обладает повышенной устойчивостью к осадкам, не смывается через 30–60 минут после обработки.","Спектр действия":"Широкий спектр наиболее распространенных злаковых сорняков, включая метлицу, овсюг, виды мятлика и плевела, просовидные сорняки, овсюг, просо, щетинник, куриное просо, лисохвост, просо сорнополевое.","Скорость действия":"В зависимости от состояния культуры и погодных условий в период обработки препарат Смилодон, КЭ останавливает рост сорняков спустя 2 суток после опрыскивания. Растения становятся хлоротичными. В зависимости от погоды и фазы развития сорняков, полная гибель наступает в течение трех недель. Визуально действие препарата заметно спустя 7–15 суток.","Совместимость":"Препарат Смилодон, КЭ хорошо совместим в баковой смеси с противодвудольными гербицидами, фунгицидами, инсектицидами и росторегуляторами. Хорошая совместимость и селективность смеси пиноксадена с флорасуламом и флуметсуламом. Эту комбинацию можно применять в широком временном интервале, и в рабочий раствор можно добавлять инсектициды и фунгициды.","Возможность возникновения резистентности":"При систематическом использовании гербицидов на основе пиноксадена могут возникнуть устойчивые к воздействию препарата сорняки. Для предотвращения возникновения резистентности необходимо восстановление севооборота, введение бобовых культур.","Ограничения по севообороту":"Без ограничений.","Рекомендации по применению":"Рекомендовано опрыскивание посевов весной в период вегетации, начиная с фазы двух листьев, до конца кущения однолетних злаковых сорных растений, независимо от фазы развития культуры."},"advantages":["Препарат обладает высокой селективностью к культурным растениям","Подавляет широкий спектр злаковых сорняков, в том числе метлицу","Идеально совместим с любыми гербицидами и фунгицидами, что обеспечивает широкий временной диапазон использования"]}},{"name":"ТИФИ","group":"Гербициды","status":"Регистрация 2026","source":"Список препаратов 2026–2028","regs":[{"crop":"Пшеница яровая","dose":"0,01–0,025 кг/га","target":"Однолетние двудольные сорняки, в т. ч. устойчивые к МЦПА","cropTags":["Пшеница"],"objClass":"Сорняки","objTags":["Однолетние двудольные сорняки","Двудольные сорняки"],"technology":"Не применяется","method":"Опрыскивание посевов в фазе 2–3 листьев кущения культуры и ранние фазы роста сорняков. Расход рабочей жидкости 200–300 л/га.","regYear":2026},{"crop":"Лен","dose":"0,01–0,025 кг/га","target":"Однолетние двудольные сорняки, в т. ч. устойчивые к МЦПА","cropTags":["Лён"],"objClass":"Сорняки","objTags":["Однолетние двудольные сорняки","Двудольные сорняки"],"technology":"Не применяется","method":"Опрыскивание посевов весной в фазе \"ёлочки\" культуры. Расход рабочей жидкости 50–300 л/га.","regYear":2026},{"crop":"Соя","dose":"0,005–0,008 кг/га","target":"Однолетние двудольные сорняки","cropTags":["Соя"],"objClass":"Сорняки","objTags":["Однолетние двудольные сорняки","Двудольные сорняки"],"technology":"Не применяется","method":"Опрыскивание посевов в фазе 1–2 настоящих листьев культуры и ранние фазы роста сорняков. Расход рабочей жидкости 200–300 л/га.","regYear":2026}],"active":"тифенсульфурон-метил, 750 г/кг","catalogInfo":{"meta":{"purpose":"Послевсходовый гербицид для борьбы с широколиственными сорняками на посевах пшеницы, сои и льна масличного","package":"Банка 100 г","storage":"3 года","temperature":"от –5 до +35 °C"},"sections":{"Спектр действия":"Однолетние двудольные сорняки, в т. ч.: канатник Теофраста, щирица жминдовидная, щирица запрокинутая, марь белая, марь зелёная, вьюнок полевой, дурман обыкновенный, ромашка непахучая, горец земноводный, горец змеиный, горец вьюнковый, горец шероховатый, горец почечуйный, портулак огородный, редька дикая, горчица полевая, паслён чёрный, звездчатка злачная, звездчатка средняя, ярутка полевая, дурнишник обыкновенный.","Рекомендации по применению":"Тифи применяется совместно с ПАВ Альф, Ж. Максимальной эффективности гербицида можно добиться при применении по сорнякам в начальные фазы роста. Обработку зерновых культур можно проводить до 2–3 междоузлия. Кукурузу обрабатывают в фазе 3–5 листьев. На льне Тифи применяется без ПАВ во избежание фитотоксичности; обработку граминицидами рекомендуется проводить спустя 2–3 недели после обработки Тифи. Сою обрабатывают в фазе 1–2 тройчатого листа. При высокой засорённости и по переросшим сорнякам рекомендуется применение баковой смеси Тифи 0,007 кг/га + Бентасил 1,8 л/га + Алгоритм 0,3 л/га совместно с 200 мл/га ПАВ Альф, Ж.","Период защитного действия":"До появления второй «волны» сорняков.","Скорость действия":"Хлороз, отмирание точек роста и некроз проявляются через 2–3 дня после применения. Гибель чувствительных сорных растений может занять 10–20 дней. Находящиеся в период опрыскивания в более поздних фазах развития сорные растения могут остановить свой рост, что существенно ослабляет их конкуренцию с культурой.","Совместимость":"Тифенсульфурон-метил совместим с карбаматными инсектицидами, но несовместим с фосфорорганическими инсектицидами.","Возможность возникновения резистентности":"Для предотвращения возникновения устойчивости к препарату необходимо чередовать его с гербицидами из других химических групп.","Механизм действия":"Проникает через листья и корни. Передвигается к точкам роста, где блокирует фермент ацетолактатсинтазу, необходимую для синтеза незаменимых аминокислот (лицина, изолейцина и валина). Гибель растения наступает в результате остановки деления клеток."},"advantages":["Контролирует злостные двудольные сорняки","Высокая начальная гербицидная активность","Широкое окно применения на зерновых","Высокая селективность к обрабатываемой культуре"]}},{"name":"ТОМАГАВК","group":"Гербициды","status":"Регистрации 2026 / 2028","source":"Список препаратов 2026–2028","regs":[{"crop":"Поля, предназначенные под посев разных сельскохозяйственных культур","dose":"1,7–2,2 л/га","target":"Однолетние и многолетние двудольные и злаковые сорняки","cropTags":["Поля, предназначенные под посев разных сельскохозяйственных культур"],"objClass":"Сорняки","objTags":["Злаковые сорняки"],"technology":"Не применяется","method":"Опрыскивание вегетирующих сорняков весной.","regYear":2026},{"crop":"Пары","dose":"4,25 л/га","target":"Горчак розовый","cropTags":["Пары"],"objClass":"Сорняки","objTags":["Горчак розовый"],"technology":"Не применяется","method":"Опрыскивание в период вегетации.","regYear":2026},{"crop":"Пары","dose":"2,0–2,2 л/га","target":"Однолетние и многолетние двудольные и злаковые сорняки","cropTags":["Пары"],"objClass":"Сорняки","objTags":["Злаковые сорняки"],"technology":"Не применяется","method":"Опрыскивание в период вегетации.","regYear":2026},{"crop":"Земли не с/х использования","dose":"2,0–4,0 л/га","target":"Однолетние и многолетние двудольные и злаковые сорняки","cropTags":["Земли несельскохозяйственного использования"],"objClass":"Сорняки","objTags":["Злаковые сорняки"],"technology":"Не применяется","method":"Опрыскивание сорняков в период их активного роста.","regYear":2026},{"crop":"Пшеница яровая","dose":"1,5–2,0 л/га","target":"Десикация","cropTags":["Пшеница"],"objClass":"Десикация","objTags":["Десикация"],"technology":"Не применяется","method":"Десикацию проводят в фазе восковой спелости, за две недели до уборки урожая.","regYear":2028}],"active":"глифосат (калийная соль), 540 г/л","catalogInfo":{"meta":{"purpose":"Универсальный гербицид сплошного действия","package":"Канистра 20 л","storage":"2 года","temperature":"от -15 до +40 °С"},"sections":{"Спектр действия":"Все однолетние и многолетние злаковые и двудольные сорняки, включая злостные виды (пырей ползучий, бодяк полевой, вьюнок полевой, свинорой пальчатый и др.), а также нежелательная лиственная древесно-кустарниковая растительность (осина, береза, ольха, ива, акация, клен и др.). Устойчивыми к глифосату являются генно-инженерные сорта сои и других культур.","Период защитного действия":"Препарат препятствует отрастанию многолетних сорняков из корневищ или корневых отростков в течение всего вегетационного периода и более в зависимости от нормы расхода, но не подавляет прорастание растений из семян. Защитное действие против сорняков сохраняется до появления новой «волны» проростков.","Возможность возникновения резистентности":"Возможна у некоторых видов сорняков (Амарантовые, редька дикая, мелколепестник канадский, амброзия трехраздельная, амброзия полыннолистная, мятлик полевой, виды плевела, гумай, виды ежовника) при длительном применении препарата на одном и том же месте. Во избежание появления резистентности следует чередовать применение гербицидов с различным механизмом действия и возделывать сельскохозяйственные культуры в севообороте.","Рекомендации по применению":"Однолетние злаковые сорняки наиболее уязвимы при высоте более 5 см до выхода в трубку, многолетние злаковые – при наличии не менее 5–6 листьев и высоте 10–20 см, однолетние двудольные – начиная со стадии двух листьев и до цветения, многолетние двудольные – в фазе розетки до бутонизации и цветения (осоты – в фазе розетки диаметром 10–20 см, горчак – в фазе розетки - стеблевания, вьюнок – в фазе розетки 10–12 см). Лучше всего действует на сорняки, когда они свежие и быстро растут. При жаркой засушливой погоде обработку лучше проводить утром или вечером. При сильной засухе опрыскивание не рекомендуется. Обработки должны быть закончены не менее чем за 6 часов до дождя. Сильные осадки вскоре после применения могут смыть препарат с растений и для надлежащего контроля может потребоваться повторная обработка. Если листья сорняков покрыты слоем пыли, гербицид плохо поступает в растения, поэтому лучше провести обработку после того, как пройдет дождь и смоет пыль. Для высокоэффективной борьбы с многолетними сорняками культивацию почвы желательно проводить не ранее чем через две недели после опрыскивания. Культивация в более ранние сроки может существенно снизить его эффективность. Также необходимо учитывать фазу развития многолетних сорняков в момент обработки – их следует опрыскивать в период преимущественного оттока пластических веществ в корневую систему. Не следует увеличивать объем рабочего раствора по сравнению с рекомендованным, так как это снижает уровень поступления действующего вещества в сорняки. Нельзя допускать попадания Томагавк на культурные растения и лесополосы. Не рекомендуется проводить обработку при скорости ветра более 5 м/с.","Механизм действия":"Препарат проникает в растения через листья и другие зеленые части и переносится по всем органам сорняков, достигая их корневой системы. Блокирует синтез ароматических аминокислот, что приводит к поражению точек роста и полному отмиранию надземных и подземных органов. На семена не действует.","Скорость воздействия":"В зависимости от активности роста сорняков и погодных условий в период обработки видимые симптомы гербицидного воздействия на однолетние сорняки становятся заметны примерно через 5 дней, на многолетние – через 7–10 и более дней, на древесно-кустарниковую растительность и камыши – на 20–30-й день после опрыскивания. Полная гибель сорняков наступает примерно через 3–4 недели после обработки, а древесно-кустарниковой растительности – через 1–2 месяца. При неблагоприятных погодных условиях (холод, засуха, осадки) действие гербицида может замедляться. Симптомы воздействия проявляются в виде пожелтения, затем побурения растений, усыхания листьев. Позже происходит отмирание стеблей, подземных побегов, корней и корневищ."},"advantages":["Идеальное решение для предпосевной и довсходовой обработки","Более высокая скорость действия по надземной части сорняков в сравнении с гербицидами на основе изопропиламинной соли глифосата кислоты","Полное уничтожение практически всех видов однолетних и многолетних двудольных и злаковых сорняков и древесно-кустарниковой растительности"]}},{"name":"ТОМАГАВК ЭКСТРА","group":"Гербициды","status":"Регистрация 2026","source":"Список препаратов 2026–2028","regs":[{"crop":"Поля, предназначенные под посев разных сельскохозяйственных культур","dose":"1–1,8 кг/га","target":"Однолетние и многолетние двудольные и злаковые сорняки","cropTags":["Поля, предназначенные под посев разных сельскохозяйственных культур"],"objClass":"Сорняки","objTags":["Злаковые сорняки"],"technology":"Не применяется","method":"Опрыскивание вегетирующих сорняков весной.","regYear":2026},{"crop":"Пары","dose":"3 кг/га","target":"Горчак розовый","cropTags":["Пары"],"objClass":"Сорняки","objTags":["Горчак розовый"],"technology":"Не применяется","method":"Опрыскивание сорняков в период их активного роста.","regYear":2026},{"crop":"Пары","dose":"1–1,8 кг/га","target":"Однолетние и многолетние двудольные и злаковые сорняки","cropTags":["Пары"],"objClass":"Сорняки","objTags":["Злаковые сорняки"],"technology":"Не применяется","method":"Опрыскивание сорняков в период их активного роста.","regYear":2026}],"active":"глифосат (аммонийная соль), 747 г/кг","catalogInfo":{"meta":{"purpose":"Гербицид сплошного действия с повышенным содержанием д. в., уничтожающий практически все сорняки","package":"Пакеты 1 кг, 5 кг, 10 кг; мягкие контейнеры 500 кг, 1000 кг","storage":"3 года","temperature":"от –15 до +40 °C"},"sections":{"Механизм действия":"Проникает через листья и другие зелёные части растения, переносится к точкам роста, в т. ч. и корневым. Блокирует синтез ароматических аминокислот, что ведёт к отмиранию точек роста и гибели растения.","Спектр действия":"Гербицид общего истребительного действия, уничтожающий практически все сорняки — как однолетние, так и многолетние, как злаковые, так и двудольные.","Скорость действия":"Через 2–5 дней видны признаки поражения однолетних сорняков (побурение, пожелтение растений, усыхание листьев). Через 5–7 дней видны признаки поражения многолетних сорняков. Через 3–4 недели — полная гибель сорняков (в зависимости от вида и погодных условий).","Совместимость":"Совместим с гербицидами на основе 2,4-Д и дикамбы, применяемыми в те же сроки. Рекомендуется применять препарат совместно с ПАВ Альф, Ж.","Рекомендации по применению":"Максимальная эффективность достигается по активно вегетирующим сорнякам в условиях достаточного увлажнения и при температуре выше +10 °C.\nНаиболее уязвимые фазы сорняков:\n• многолетние злаковые — 4–5 листьев, 10–20 см высотой\n• многолетние двудольные — фаза цветения до начала старения\n• однолетние злаковые и двудольные — когда лист злаковых длиной 5 см, а двудольные — 2 настоящих листа.\nНорма расхода препарата зависит от видового состава сорняков и фазы их развития и колеблется от 1 до 4 кг/га. При смешанном типе засорённости однолетними и многолетними сорняками для усиления эффективности рекомендуются следующие баковые смеси:\n• Томагавк Экстра, ВДГ от 1,5 кг/га + Ларт 0,2 л/га\n• Томагавк Экстра, ВДГ от 1,5 кг/га + Эндимион, КЭ 0,4 л/га."},"advantages":["Новая современная препаративная форма","Увеличенное содержание действующего вещества","Низкие нормы расхода препарата","Удобен в транспортировке, хранении и использовании","Высокая биологическая и экономическая эффективность препарата"]}},{"name":"Триумф 48%","group":"Гербициды","status":"Регистрация 2026","source":"Список препаратов 2026–2028","regs":[{"crop":"Пары","dose":"2–3 л/га","target":"Однолетние и многолетние злаковые и двудольные сорняки","cropTags":["Пары"],"objClass":"Сорняки","objTags":["Злаковые сорняки","Двудольные сорняки"],"technology":"Не применяется","method":"Опрыскивание сорняков в период их активного роста.","regYear":2026},{"crop":"Пары","dose":"6 л/га","target":"Горчак розовый","cropTags":["Пары"],"objClass":"Сорняки","objTags":["Двудольные сорняки"],"technology":"Не применяется","method":"Опрыскивание сорняков в период их активного роста.","r енения препарата не рекомендуется высевать свеклу сахарную, столовую, кормовую. Расход рабочей жидкости — 200–300 л/га.","regYear":2027}],"active":"флумиоксазин, 250 г/л","catalogInfo":{"meta":{"purpose":"Системный гербицид избирательного действия для подавления однолетних двудольных, злаковых (фолиарно) и многолетних двудольных сорняков на сое","package":"Канистра 5 л","storage":"3 года","temperature":"от –5 до +30 °C"},"sections":{"Скорость действия":"Первые симптомы действия препарата на вегетирующие сорняки проявляются очень быстро: с момента применения в течение 3–7 дней, и в дальнейшем сохраняется почвенная активность. При соблюдении рекомендаций при подготовке почвы перед внесением, в зависимости от погодных условий и видов почв, сохраняет свое действие до 4–8 недель.","Совместимость":"Перед применением в каждом случае необходима предварительная проверка на совместимость смешиваемых компонентов.","Спектр действия":"Щирица запрокинутая, крестовник обыкновенный, яснотка, редька дикая, мак самосейка, портулак огородный, гибискус тройчатый, марь, очный цвет полевой, паслен черный, горец, просо куриное, подмаренник цепкий, щетинник виды, вьюнок полевой, пастушья сумка обыкновенная, мелколепестник канадский, звездчатка средняя (мокрица), горчица полевая, росичка кроваво-красная, бодяк полевой, канатник Теофраста, амброзия полыннолистная, дурнишник калифорнийский.","Ограничения по севообороту":"В течение 12 месяцев после применения препарата не рекомендуется высевать свеклу сахарную, столовую, кормовую.","Рекомендации по применению":"Рекомендовано наземное опрыскивание с нормой применения препарата от 0,16 до 0,25 л/га. Опрыскивание почвы необходимо проводить до всходов культуры, сразу после посева или в течение 2–3 дней после него. Расход рабочей жидкости — 200–300 л/га. Опрыскивание посевов в фазе 2–4 настоящих листьев культуры с расходом рабочей жидкости — 200–300 л/га. Повторную обработку рекомендовано проводить не ранее чем через 3 дня. Осадки более 10 мм после применения могут оказать токсическое действие на культуру в фазе семядоли. При переходе на другую культуру рекомендуется обязательно качественно промыть опрыскиватель!","Механизм действия":"Флумиоксазин относится к химическому классу Н-фенилфталимидов, ингибиторам протопорфириноген оксидазы. Под действием гербицида Флазер происходит накопление порфиринов в клетках листа сорных растений, что вызывает окисление липидов у мембран клеточных структур и самой клетки. Проникновение флумиоксазина в сорное растение может идти через лист при попадании капель раствора или через всасывание тканями проростка при его прохождении через почвенный экран.","Возможность возникновения резистентности":"При соблюдении регламентов применения резистентности не возникнет."},"advantages":["Надёжная защита от широкого спектра двудольных и злаковых сорняков","Экономичен, благодаря небольшой норме расхода на гектар","Обладает системным действием по вегетации","Высокоселективен по отношению к сое","Почвенное действие до посева и в период всходов"]}},{"name":"ФМР ГА 100","group":"Гербициды","status":"Новая регистрация 2027","source":"Список препаратов 2026–2028","regs":[{"crop":"Рапс","dose":"0,025 л/га","target":"Однолетние двудольные сорные растения","cropTags":["Рапс"],"objClass":"Сорняки","objTags":["Однолетние двудольные сорняки"],"technology":"Не применяется","method":"Опрыскивание в фазу 2 листа-бутонизация Срок ожидания / кратность обработок: 60(1).","regYear":2027},{"crop":"Подсолнечник","dose":"0,031 л/га","target":"Однолетние двудольные сорные растения","cropTags":["Подсолнечник"],"objClass":"Сорняки","objTags":["Однолетние двудольные сорняки"],"technology":"Не применяется","method":"Опрыскивание в фазу 2–8 листьев Срок ожидания / кратность обработок: 60(1).","regYear":2027},{"crop":"Соя","dose":"0,031 л/га","target":"Однолетние двудольные сорные растения","cropTags":["Соя"],"objClass":"Сорняки","objTags":["Однолетние двудольные сорняки"],"technology":"Не применяется","method":"Опрыскивание в фазу 1–3 тройчатых листа Срок ожидания / кратность обработок: 60(1).","regYear":2027}],"active":"галауксифен-метил, 100 г/л","catalogInfo":{"meta":{"package":"Пластиковая канистра емкостью 1 л или 5 л.","storage":"2 года","temperature":"от -5°C до +30 °C."},"sections":{"Механизм действия":"Инновационный системный послевсходовый гербицид из нового химического класса арилпиколинатов. Галауксифен-метил (действующее вещество Arylex™ active) связывается со специфическими рецепторами сорняков и имитирует действие природного гормона роста — ауксина. Попадая в растение через листья и корни, препарат вызывает сверхактивацию генов роста, нарушает нормальное деление и дифференциацию клеток. Это приводит к быстрому гормональному дисбалансу, деформации проводящих тканей и полной потере жизнеспособности сорняка.","Спектр действия":"Специализированный контроль проблемных двудольных сорняков в посевах широкого ряда культур. Исключительно эффективен против таких злостных видов, как марь белая, амброзия полыннолистная, канатник Теофраста, дурнишник обыкновенный, подмаренник цепкий (включая переросшие фазы), виды щирицы, горцев, ромашки, конопли сорной, зизифоры, а также падалицы подсолнечника и рапса.","Скорость действия":"Развитие сорняков прекращается уже через несколько часов после нанесения. Первые визуальные симптомы (эпинастия — скручивание листьев, изгибы стеблей, увядание верхушек) проявляются через 24–48 часов. Окончательное отмирание и полная гибель сорных растений наступают через 2–3 недели в зависимости от погодных условий и стадии развития сорняков.","Период защитного действия":"Защищает культурные растения от сорняков, взошедших на момент проведения обработки. Благодаря высокой эффективности гербицид очищает поле до конца вегетационного периода, позволяя культуре сформировать мощный полог и самостоятельно подавлять поздние всходы.","Совместимость":"Отлично совмещается в баковых смесях с большинством базовых гербицидов, граминицидов, инсектицидов и фунгицидов. Препарат является идеальным партнером для усиления действия других противодвудольных гербицидов против мари и амброзии. Рекомендуется использовать совместно с адъювантами (ПАВ) для максимального проникновения через восковой налет сорняков.","Возможность возникновения резистентности":"Риск возникновения устойчивости сорняков близок к нулю. Галауксифен-метил воздействует на альтернативные участки связывания ауксиновых рецепторов (класс фторфенилоксиацетатов), что принципиально отличает его от классических гормональных гербицидов группы 2,4-Д и дикамбы. Препарат успешно уничтожает биотипы сорняков, выработавшие резистентность к ALS-ингибиторам (сульфонилмочевинам) и триазинам.","Рекомендации по применению":"Норма расхода 0,025 л/га – рапс опрыскивание в фазу 2 листа-бутонизация. Норма расхода 0,031 л/га – подсолнечник опрыскивание в фазу 2–8 листьев. Норма расхода 0,031 л/га - соя опрыскивание в фазу 1–3 тройчатых листа.","Расход рабочей жидкости":"200–300 л/га при стандартном наземном мелкокапельном опрыскивании."},"advantages":["Новый стандарт контроля мари и амброзии: Показывает беспрецедентную эффективность против переросшей мари белой и амброзии, с которыми не справляются стандартные схемы.","Температурный суверенитет: Стабильно работает уже от +5 °C, что позволяет проводить сверхранние весенние обработки на зерновых или рапсе без потери качества.","Уникальный инструмент антирезистентной программы: Эффективно искореняет популяции сорняков, устойчивые к популярным сульфонилмочевинам.","Исключительная мягкость к культуре: Не оказывает фитотоксического действия на защищаемые культуры благодаря высокой скорости метаболизма внутри культурных растений.","Свобода севооборота: Галауксифен-метил быстро разрушается в почве, что гарантирует полное отсутствие каких-либо ограничений для последующих культур осенью или на следующий год."]}},{"name":"Фомесофт КНР","group":"Гербициды","status":"Регистрация 2026","source":"Список препаратов 2026–2028","regs":[{"crop":"Соя","dose":"1,5–2 л/га","target":"Однолетние и многолетние двудольные сорняки","cropTags":["Соя"],"objClass":"Сорняки","objTags":["Многолетние двудольные сорняки","Двудольные сорняки"],"technology":"Не применяется","method":"Опрыскивание посевов, начиная с фазы первого листа культуры в ранние фазы роста сорняков (2–5 листьев). Расход рабочей жидкости 200–300 л/га.","regYear":2026},{"crop":"Хлопчатник, картофель","dose":"1,5–2 л/га","target":"Однолетние и многолетние двудольные сорняки","cropTags":["Картофель","Хлопчатник"],"objClass":"Сорняки","objTags":["Многолетние двудольные сорняки","Двудольные сорняки"],"technology":"Не применяется","method":"Опрыскивание посевов при 2–6 листьев сорных растений независимо от фазы развития культуры.","regYear":2026}],"active":"фомесафен, 250 г/л","catalogInfo":{"meta":{"purpose":"Контактный селективный гербицид для борьбы с однолетними двудольными сорными растениями в посевах сои","package":"Канистра 5 л, 10 л","storage":"3 года","temperature":"от 0 до +35 °C"},"sections":{"Механизм действия":"Фомесофт — контактный селективный гербицид, слабо перемещающийся по растению. Проникает в растения главным образом через листья. Высокая влажность воздуха, повышенная температура (+20…+25 °C) и хорошая освещённость способствуют более быстрому поглощению препарата растениями. Механизм действия фомесафена основан на необратимом блокировании транспорта электронов, участвующих в процессе фотосинтеза. Вследствие этой реакции прерывается ассимиляция CO₂, останавливается рост, и растение погибает.","Спектр действия":"Однолетние и некоторые многолетние двудольные сорняки, в т. ч.: горчица полевая, виды мари, виды ромашки, дурнишник, гречишка вьюнковая, горцы (виды), щирица (виды), паслён чёрный, портулак (виды), амброзия (виды), подсолнечник сорно-полевой, конопля, подмаренник цепкий, гулявник струйчатый, молочай (виды), частуха обыкновенная, виды ясноток, пикульник обыкновенный, фиалка полевая.","Совместимость":"Фомесофт совместим в баковых смесях с препаратами, имеющими нейтральную и щелочную реакцию. Не совместим с препаратами, имеющими кислую реакцию среды. Использование баковых смесей гербицида Фомесофт перспективно, так как расширяет спектр его действия на сорняки.","Скорость действия":"Видимые признаки угнетения сорняков в зависимости от погодных условий проявляются через 3–7 дней после обработки гербицидом. Полная гибель сорняков наступает примерно через 2 недели.","Возможность возникновения резистентности":"За длительный период использования фомесафена случаев возникновения резистентности не выявлено.","Рекомендации по применению":"Наиболее эффективна обработка в ранние фазы роста сорных растений (2–5 листьев). Сою целесообразно обрабатывать с фазы 1-го настоящего листа. От переросшей мари и падалицы подсолнечника рекомендуется применение баковой смеси Фомесофт, ВР 1,5 л/га + Бентасил, ВР 1,5 л/га + ПАВ Альф, Ж 0,2 л/га. Высев подсолнечника, сахарной свёклы, сорго, кукурузы, люцерны возможен через 18 месяцев после применения препарата."},"advantages":["Широкий спектр контролируемых однолетних двудольных сорняков","Отличный партнер в баковых смесях с бентазоном","Обладает почвенной активностью","Гербицидная активность усиливается в солнечную погоду"]}},{"name":"Формуляр","group":"Гербициды","status":"Регистрация 2026","source":"Список препаратов 2026–2028","regs":[{"crop":"Пшеница яровая","dose":"0,4–0,9 л/га","target":"Однолетние злаковые сорные растения (виды щетинника, просо куриное, просо сорнополевое, овсюг, метлица полевая, лисохвост)","cropTags":["Пшеница"],"objClass":"Сорняки","objTags":["Щетинник","Просо"],"technology":"Не применяется","method":"Опрыскивание посевов в ранние фазы развития (2–3 листа) сорных растений, независимо от фазы развития культуры. Расход рабочей жидкости 150–200 л/га.","regYear":2026},{"crop":"Ячмень яровой","dose":"0,5–0,7 л/га","target":"Однолетние злаковые сорные растения (виды щетинника, просо куриное, просо сорнополевое, овсюг, метлица полевая, лисохвост)","cropTags":["Ячмень"],"objClass":"Сорняки","objTags":["Щетинник","Просо"],"technology":"Не применяется","method":"Опрыскивание посевов по вегетирующим сорным растениям, начиная с фазы 2 листьев до конца кущения (в фазе кущения культуры). Расход рабочей жидкости 150–200 л/га.","regYear":2026}],"active":"феноксапроп-П-этил, 100 г/л + клоквинтосет-мексил (антидот), 50 г/л","catalogInfo":{"meta":{"purpose":"Универсальный граминицид для защиты пшеницы и ярового ячменя","package":"Канистра 10 л","storage":"2 года","temperature":"от -15 до +30 °C"},"sections":{"Механизм действия":"Граминицид активно поглощается надземными частями растений и перемещается к точкам роста. Механизм действия основан на ингибировании синтеза жирных кислот, что останавливает производство клеточных мембран в меристемных тканях.","Совместимость":"Необходимо избегать применения Формуляра в баковых смесях с препаратами на основе 2,4-Д и дикамбы. В случае применения граминицида совместно с препаратами на основе МЦПА норма расхода последнего не должна превышать 400 г д. в./га. Формуляр совместим с большинством гербицидов из класса сульфонилмочевин, а также инсектицидами, применяемыми в те же сроки.","Спектр действия":"Однолетние злаковые сорняки: овсюг обыкновенный, костер обыкновенный, лисохвост мышехвостниковидный, метлица обыкновенная, метлица просовидная, мятлик обыкновенный, плевел (виды), росичка кроваво-красная, щетинник зеленый, просо (виды).","Скорость действия":"Остановка роста и развития сорняков происходит в первые сутки после проведения обработки. Видимые симптомы гербицидного действия проявляются на 10–14 день. Гибель сорняков происходит через 2–3 недели.","Рекомендации по применению":"Благодаря повышенному содержанию клоквинтосет-мексила (антидот), Формуляр может применяться как на озимой и яровой пшенице, так и на яровом ячмене. При обработке Формуляром следует ориентироваться на фазу развития сорняков. Оптимальными являются фазы 2–3 листьев однолетних злаков. Фаза развития культуры при этом не имеет значения. Оптимально применение препарата в период массовых всходов сорняков отдельно от противодвудольных гербицидов. Опрыскивание Формуляром рекомендуется проводить в утренние или вечерние часы при температуре воздуха от +8 до +23 °C (ночная температура не должна быть ниже +5 °C) и скорости ветра не более 3 м/с. В пасмурную погоду обработку можно проводить в течение всего дня.","Возможность возникновения резистентности":"Во избежание возникновения резистентности следует чередовать гербициды из разных химических классов."},"advantages":["Может применяться на пшенице и на ячмене","Высокая активность против широкого спектра однолетних злаковых сорняков","Селективность к обрабатываемой культуре","Широкий диапазон сроков применения","Останавливает рост и развитие сорняков в первые сутки после применения"]}},{"name":"Формуляр Классик","group":"Гербициды","status":"Регистрация 2026","source":"Каталог 2026","active":"феноксапроп-П-этил, 69 г/л + мефенпир-диэтил (антидот), 75 г/л","regs":[{"crop":"Ячмень яровой","dose":"0,6–0,9 л/га","target":"Однолетние злаковые (щетинник зеленый, просо куриное, овсюг обыкновенный) сорняки","cropTags":["Ячмень"],"objClass":"Сорняки","objTags":["Щетинник зеленый","Просо","Овсюг обыкновенный"],"technology":"Не применяется","method":"Опрыскивание посевов по вегетирующим сорнякам, начиная с фазы 2 листьев до конца кущения (в фазе кущения культуры). Обработка проводится с учётом устойчивости сортов. Расход рабочей жидкости 150–200 л/га (25–50 л/га при авиаобработках).","regYear":2026}],"catalogInfo":{"meta":{"purpose":"Высокоселективный гербицид для послевсходовой обработки ячменя и пшеницы против широкого спектра однолетних злаковых сорняков.","package":"Канистра 10 л","storage":"3 года","temperature":"от -15 до +30 °C"},"sections":{"Рекомендации по применению":"При высокой численности злаковых сорняков в посевах рекомендуется применять гербицид в чистом виде в максимальной дозировке. Баковую смесь Формуляр Классик с гербицидами для контроля широколистных сорных растений рекомендуется применять не позднее фазы середины кущения однолетних злаковых сорняков. Также в дождливый период, даже при отсутствии риска смыва препарата, обработку посевов против однолетних злаковых сорняков, находящихся в фазе кущения, рекомендуется проводить с нормой расхода 1 л/га.","Совместимость":"Баковая смесь Формуляр Классик с препаратами на основании 2,4-Д, Дикамба, Флорасулам, Флуроксипир и Бромоксинил может давать антагонизм по действию на злаковые сорняки, поэтому в таких смесях рекомендуется использовать максимальные дозировки Формуляр Классик. В баковых смесях с МЦПА-содержащими препаратами при дозировке МЦПА не более 400 г/га по действующему веществу подобный антагонизм не проявляется. При приготовлении баковых смесей необходима предварительная проверка на химическую совместимость смешиваемых компонентов.","Механизм действия":"Гербицид системного действия. Препарат поглощается наземными органами растения в течение 1–3 часов после применения. Феноксапроп-П-этил на биохимическом уровне ингибирует биосинтез жирных кислот в меристемных тканях злаковых сорняков, препятствуя образованию клеточных мембран, что ведёт к прекращению роста и гибели сорных злаков. Мефенпир-диэтил — антидот, способствует быстрому распаду феноксапроп-П-этила в культурных растениях, обработанных препаратом. Это обеспечивает высокую селективность и исключает проявление фитотоксичности. В тканях сорных растений мефенпир-диэтил, как правило, не активен.","Спектр действия":"Эффективен против широкого спектра злаковых сорняков: овсюг, виды; просо, виды; канареечник, виды; ежовник обыкновенный; лисохвост мышехвостниковидный; метлица обыкновенная; кукуруза, падалица; щетинник, виды.","Период защитного действия":"Оказывает гербицидное действие на чувствительные однолетние злаковые сорняки, имеющиеся в посевах на момент опрыскивания, и не действует на появившиеся позднее, после обработки (вторая волна сорняков). Поэтому важно правильно выбрать сроки применения препарата, когда появится основная масса однолетних злаковых сорняков. Обычно одна обработка обеспечивает эффективную защиту посевов в течение всего вегетационного периода.","Скорость действия":"После внесения быстро проникает в листья сорных растений и практически уже через сутки в значительной степени устраняет конкуренцию однолетних злаковых сорных растений для культуры. Полная гибель чувствительных сорных растений происходит в течение 10–15 дней после опрыскивания, в зависимости от складывающихся погодных условий. Максимально быстрый гербицидный эффект достигается при обработке на ранних стадиях развития однолетних злаковых сорных растений, начиная с фазы 2-х листьев, и при благоприятных условиях роста — оптимальной влажности и температуре."},"advantages":["Широкий спектр контролируемых однолетних злаковых сорняков","Отсутствие ограничений для применения в севообороте: быстрая деградация в почве","Селективность к обрабатываемой культуре: наличие эффективного антидота"]}},{"name":"ЭНДИМИОН КНР","group":"Гербициды","status":"Регистрация 2026","source":"Список препаратов 2026–2028","regs":[{"crop":"Пшеница и ячмень яровые","dose":"0,6–0,8 л/га","target":"Однолетние и некоторые многолетние (бодяк полевой) двудольные сорняки","cropTags":["Пшеница","Ячмень"],"objClass":"Сорняки","objTags":["Бодяк полевой","Двудольные сорняки"],"technology":"Не применяется","method":"Опрыскивание посевов в фазе кущения культуры и ранние фазы роста сорняков. Расход рабочей жидкости — 200–300 л/га.","regYear":2026},{"crop":"Пшеница озимая","dose":"0,6–0,8 л/га","target":"Однолетние и некоторые многолетние (бодяк полевой) двудольные сорняки","cropTags":["Пшеница"],"objClass":"Сорняки","objTags":["Бодяк полевой","Двудольные сорняки"],"technology":"Не применяется","method":"Опрыскивание посевов в фазе кущения культуры весной. Расход рабочей жидкости — 200–300 л/га.","regYear":2026}],"active":"2,4-Д кислота (2-этилгексиловый эфир), 564 г/л","catalogInfo":{"meta":{"purpose":"Послевсходовый гербицид для борьбы с однолетними и некоторыми многолетними двудольными сорняками в посевах зерновых колосовых культур","package":"Канистра 20 л","storage":"3 года","temperature":"от –15 до +35 °C"},"sections":{"Рекомендации по применению":"Обработку следует проводить в фазу кущения культуры по активно вегетирующим сорнякам: 2–10 листьев у однолетних и фаза «розетки» у многолетних сорняков. Оптимальный температурный диапазон применения +5…+25 °C. Для расширения спектра действия рекомендуется баковая смесь Эндимион 0,6 л/га + Аргамак 15 г/га. Расход рабочей жидкости 200–300 л/га.","Механизм действия":"Гербицид быстро проникает и распространяется по всем частям сорных растений (в т. ч. корни) и блокирует рост клеток в молодых тканях. Аналог регулятора роста.","Совместимость":"Совместим с другими пестицидами, кроме препаратов с сильнощелочной или кислой реакцией. Однако в каждом конкретном случае необходима проверка на совместимость.","Возможность возникновения резистентности":"Для предотвращения возникновения устойчивости к препарату необходимо чередовать его с гербицидами из других химических групп.","Спектр действия":"Однолетние и некоторые многолетние двудольные сорняки (бодяки, осоты).","Скорость действия":"Первые видимые симптомы поражения наблюдаются через 1–3 дня. Полная гибель сорняков происходит в течение 3–7 дней в зависимости от погодных условий и видового состава сорняков."},"advantages":["Эфиры 2,4-Д быстрее проникают в сорные растения и сильнее поражают чувствительные виды по сравнению с солями","Благодаря препаративной форме КЭ активно передвигается по сосудистой системе сорняков к точкам роста побегов","Эффективен в условиях засухи, не обладает последействием","Проявляет гербицидную активность при температурах от +5 °С","Является отличным компонентом баковых смесей"]}},{"name":"Альфашанс","group":"Инсектициды","status":"Регистрации 2026 / 2028","source":"Список препаратов 2026–2028","regs":[{"crop":"Пшеница","dose":"0,1–0,2 л/га","target":"Клоп вредная чере лов, что вызывает остановку питания и гибель вследствие паралича.","Скорость действия":"Препарат воздействует на кишечный тракт и нервную систему насекомых. Действие проявляется сразу после обработки в течение первого часа.","Период защитного действия":"Не менее 7 суток.","Возможность возникновения резистентности":"Для предотвращения возникновения резистентности необходимо чередование применения препарата с инсектицидами других химических групп.","Рекомендации по применению":"Рекомендовано опрыскивание в период вегетации. Пшеница, ячмень, рапс, – двукратная обработка. Интервал между обработками 14–21 день. Горох, пастбища– однократная обработка. Ограничений по севообороту нет.","Совместимость":"Совместим с другими пестицидами, за исключением препаратов со щелочной реакцией. В каждом конкретном случае перед применением рекомендуется проверить на совместимость в малом объёме рабочего раствора.","Спектр действия":"Клоп вредная черепашка, пьявица обыкновенная, блошки семейства листоедов, тли, трипсы семейства флеотрипиды, цикадки, рапсовый цветоед, крестоцветные блошки, гороховая зерновка, гороховая плодожорка, гороховая тля."},"advantages":["Активен против большинства вредителей","Эффективен на всех стадиях развития насекомых","Устойчив к атмосферным осадкам","Малые дозы применения"]}},{"name":"КИНЖАЛ","group":"Инсектициды","status":"Регистрации 2026 / 2028","source":"Список препаратов 2026–2028","regs":[{"crop":"Соя","dose":"0,3–0,5 л/га","target":"Паутинный клещ","cropTags":["Соя"],"objClass":"Вредители","objTags":["Клещ","Паутинный клещ"],"technology":"Не применяется","method":"Опрыскивание в период вегетации. Расход рабочей жидкости – 200–400 л/га.","regYear":2026},{"crop":"Хлопчатник","dose":"0,3–0,5 л/га","target":"Хлопковая совка паутинный клещ*, трипс, тля","cropTags":["Хлопчатник"],"objClass":"Вредители","objTags":["Клещ","Паутинный клещ"],"technology":"Не применяется","method":"Опрыскивание в период вегетации. Расход рабочей жидкости – 200–400 л/га.","regYear са гусеницы перестают питаться и насекомое в течение 1–4 суток погибает. В отношении чешуекрылых обладает избирательным действием.","Спектр действия":"Системный инсектицид контактного и кишечного действия, активен в борьбе с паутинным клещем, хлопковой совкой, плодожорками, минирующими молями, клещами.","Период защитного действия":"От 15 суток до 3-х недель.","Скорость действия":"Вредители погибают в течение 1–4 дней.","Рекомендации по применению":"Срок проведения обработок: в период вегетации при появлении вредителей выше ЭПВ. Фаза развития защищаемой культуры: в период вегетации при появлении вредителей выше ЭПВ. Фаза развития (стадия) вредного организма: в период вегетации при появлении вредителей выше ЭПВ. Кратность обработок: двух- или трехкратная обработка за сезон. Интервал между обработками: через 10–14 дней в зависимости от появления вредителей.","Возможность возникновения резистентности":"При условии строгого соблюдения разработанных рекомендаций проблема резистентности не возникает.","Совместимость":"Совместим со многими пестицидами, но перед приготовлением баковой смеси стоит убедиться в совместимости компонентов. Не рекомендуется применять с препаратами, реакция которых щелочная. Нельзя применять в баковых смесях с фунгицидами на основе алюминия фосэтила, жидкими минеральными удобрениями."},"advantages":["Максимально эффективен в период откладывания яиц и по отложенным яйцекладкам","Длительный период защиты","Устойчив к атмосферным осадкам","Эффективен против гусениц"]}},{"name":"КЛОНРИН","group":"Инсектициды","status":"Регистрация 2026","source":"Список препаратов 2026–2028","regs":[{"crop":"Пшеница озимая","dose":"0,1–0,2 л/га","target":"Хлебная жужелица","cropTags":["Пшеница"],"objClass":"Вредители","objTags":["Хлебная жужелица"],"technology":"Не применяется","method":"Опрыскивание всходов весной, расход рабочей жидкости 100–200 л/га.","regYear":2026},{"crop":"Пшеница яровая","dose":"0,1–0,2 л/га","target":"Вредная черепашка, трипсы, тли, пьявица","c Спектр действия":"Клоп вредная черепашка, пьявица, тля, хлебные жуки, трипсы, хлебная жужелица, рапсовый цветоед, саранчовые (в период массового отрождения личинок), акациевая огневка, луговой мотылек, свекловичные блошки, долгоносики, свекловичная листовая тля, луговой мотылек, хвоеи листогрызущие вредители, в т. ч. непарный шелкопряд, сосновый пилильщик и самшитовая огнёвка.","Скорость действия":"Дезориентация насекомых и остановка питания происходит в течение нескольких минут после применения Клонрина. Полная гибель наступает в течение первых суток.","Период защитного действия":"Препарата 2–3 недели, в зависимости от вида, численности вредителей и погодных условий.","Возможность возникновения резистентности":"Возникновение резистентности маловероятно.","Рекомендации по применению":"Клонрин показывает высокую эффективность при применении в начале заселения вредителями, с учётом ЭВП. Клонрин не обладает избирательным действием и, помимо специализированных, он также подавляет и многоядных вредителей: стеблевого мотылька, озимую совку, совку-гамму, если обработка проводится в период начала массовой откладки яиц. Норма расхода рабочей жидкости должна быть достаточной для обеспечения покрытия всей поверхности культуры. Обработку следует проводить в утренние или вечерние часы при температуре +12 … +30 °C. При применении на крестоцветных, бобовых и овощных культурах рекомендуется добавлять в рабочий раствор суперсмачиватель Агент С, 50–100 м л/га, который улучшает покрытие растений препаратом.","Совместимость":"Клонрин совместим с большинством пестицидов, за исключением имеющих сильнощелочную или сильнокислую реакцию. Однако в каждом конкретном случае смешиваемые препараты следует проверять на совместимость и фитотоксичность."},"advantages":["Обеспечивает уничтожение комплекса вредителей","Обладает быстрым действием на насекомых","Длительный период защитного действия","Эффективен против резистентных к пиретроидам популяций насекомых"]}},{"name":"МЕТОМАКС","group":"Инсект сти 200–300 л/га.","regYear":2026},{"crop":"Рапс яровой","dose":"1,0–1,2 л/га","target":"Капустная моль","cropTags":["Рапс"],"objClass":"Вредители","objTags":["Капустная моль"],"technology":"Независимо от технологии","method":"Опрыскивание в период вегетации. Расход рабочей жидкости — 600–800 л/га.","regYear":2027,"rate":"1,0–1,2 л/га"}],"active":"метомил, 250 г/л + бифентрин, 25 г/л","catalogInfo":{"meta":{"purpose":"Системный инсекто-акарицид контактного и кишечного действия","package":"Канистра 5 л","storage":"2 года","temperature":"от –5 до +35 °C"},"sections":{"Механизм действия":"Системный и контактно-кишечный инсектицид и акарицид. Метомил ингибирует действие холинэстеразы и подавляет гидролиз ацетилхолина. Вследствие накопления ацетилхолина нарушается нормальное течение процесса передачи нервного импульса в мышечных тканях. Бифентрин действует как модулятор натриевых каналов нервных клеток центральной и периферической нервных систем членистоногих. Блокируя пропуск ионов натрия через мембраны, препятствует передаче нервных импульсов по аксону. В результате возникает судорожная активность мышц, приводящая к параличу.","Спектр действия":"Эффективен в борьбе с паутинным клещом, жесткокрылыми (Coleoptera), чешуекрылыми (Lepidoptera), равнокрылыми хоботными (Homoptera), бахромчатокрылыми (Thysanoptera), полужесткокрылыми (Hemiptera) и прямокрылыми (Orthoptera) и другими вредителями.","Скорость действия":"Дезориентация насекомых и остановка питания происходит в течение нескольких минут после применения Метомакса.","Возможность возникновения резистентности":"При соблюдении регламентов применения препарата возникновение резистентности маловероятно.","Совместимость":"Совместим с другими пестицидами, кроме препаратов с сильнощелочной или кислой реакцией. Однако в каждом конкретном случае необходима проверка на совместимость. Не рекомендуется применять в баковых смесях с агрохимикатами, повышающими рН рабочего раствора.","Рекомендации по применению":"Перед применением необходимо встряхнуть канистру. Метомакс следует применять в рекомендованных дозировках превентивно в период отрождения первых личинок. Опрыскивание должно обеспечивать равномерное внесение, а количество рабочего раствора на 1 гектар быть достаточным для того, чтобы покрыть всю листовую поверхность. Интервал между обработками обычно составляет 7–12 дней. Обработку против паутинного клеща следует проводить двукратно, первую — при численности вредителя 5 шт на одном листе или заселении 10% растений. При температурах воздуха выше 22 °C повторную обработку следует проводить с интервалом 5–7 дней, при необходимости."},"advantages":["Имеет овицидное действие против паутинного клеща при прямом попадании","Эффективен против всех возрастов личинок, начиная с отрождения до старшего возраста","Отсутствие резистентности у вредителей","Длительный период максимальной эффективности","Не накапливается в продуктах растениеводства","Широкий спектр контролируемых вредителей","Действие на все стадии развития насекомых и клещей"]}},{"name":"Прокроп","group":"Инсектициды","status":"Новая регистрация 2028","source":"Список препаратов 2026–2028","regs":[{"crop":"Незагруженные складские помещения и оборудование зерноперерабатывающих предприятий","dose":"0,4 мл/м²","target":"Вредители запасов (насекомые, клещи)","cropTags":["Незагруженные складские помещения и оборудование зерноперерабатывающих предприятий"],"objClass":"Вредители","objTags":["Вредители запасов (насекомые, клещи)"],"technology":"Не применяется","method":"Влажная дезинсекция. Опрыскивание с помощью ручных или моторизованных опрыскивателей. Расход рабочей жидкости - 50 мл/м². Допуск людей и загрузка складов через 1 сутки после обработки","regYear":2028},{"crop":"Территория зерноперерабатывающих предприятий и зернохранилищ в хозяйствах","dose":"0,8 мл/м²","target":"Вредители запасов (насекомые, клещи)","cropTags":["Территория зерноперерабатывающих предприятий и зернохранилищ в хозяйства"],"objClass":"Вредители","objTags":["Вредит
