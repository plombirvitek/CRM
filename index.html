async function auth(grant,body){
  const r=await fetch(URL_+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:PUB,'Content-Type':'application/json'},body:JSON.stringify(body)});

async function ensureLogin(){

const rnd=()=>'n'+Math.random().toString(36).slice(2,10);

    const r=await rest('docs?coll=eq.'+enc(path)+(flt||'')+'&select=id,data&order=id',{headers:{Range:from+'-'+(from+999)}});

    }};
}
function collRef(path){return {

    return {async get(){await ensureLogin();return mkSnap(path,await fetchColl(path,'&data->>'+f+'='+o+'.'+enc(v)))}}},
  onSnapshot(cb,eb){

.bell{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:8px;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer}
.bell .bdg{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
#npanel{position:fixed;top:64px;right:max(16px,env(safe-area-inset-right,0px));width:min(380px,calc(100vw - 32px));max-height:min(70vh,520px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);z-index:40}
#npanel .nh{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
#npanel .ni{padding:9px 12px;border-bottom:1px solid var(--line);font-size:13.5px}#npanel .ni:last-child{border-bottom:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:30;max-width:90vw}
.log{font-family:var(--f-num);font-size:12px;background:var(--surface2);border-radius:6px;padding:10px;max-height:260px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.prog{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--accent);width:0}
.pin{width:70px!important;text-align:right;font-family:var(--f-num)}
@media (max-width:560px){ .qa .w2{grid-column:auto} }
@media (max-width:560px){ form.f{grid-template-columns:1fr} .kpi .v{font-size:20px} .mrow{grid-template-columns:100px 1fr auto} }
@media (prefers-reduced-motion:no-preference){ .card,.btn{transition:border-color .12s,background .12s} }

.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-width:0}
.pc:hover,.pc:focus-visible{border-color:var(--accent);outline:none}
.pn{font-size:15px;overflow-wrap:anywhere}
.pp{font-size:12.5px;color:var(--ink);line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pmeta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.pmeta>div{background:var(--surface2);border-radius:6px;padding:8px 10px;font-size:13px}
.pmeta span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.psec{border-top:1px solid var(--line)}
.psec summary{cursor:pointer;padding:10px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between}
.psec summary::-webkit-details-marker{display:none}
.psec summary::after{content:"+";color:var(--muted)}
.psec[open] summary::after{content:"−"}
.rt{padding:0 0 10px;font-size:13.5px;line-height:1.55}
.rt p{margin:0 0 6px}.rt ul{margin:4px 0 8px 18px;padding:0}.rt li{margin:2px 0}

/* ---- фирменный стиль ФМРус ---- */
body{font-variant-numeric:tabular-nums}
.top{padding-bottom:12px;border-bottom:2px solid var(--accent);margin-bottom:16px}
.brand{flex-direction:row;align-items:center;gap:16px}
.plate{background:#fff;border-radius:10px;padding:6px 10px;display:flex;border:1px solid var(--line)}
.plate img{display:block;height:40px;width:auto}
.bt{display:flex;flex-direction:column;gap:2px;min-width:0}
h1{display:flex;align-items:center;gap:10px;font-size:19px;color:var(--accent);letter-spacing:.01em}
h1 b{font-weight:800}
h1 span{font-weight:300}
.vbar{display:inline-block;width:2px;height:22px;background:var(--accent)}
.brand small{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--accent);font-weight:600}
.tabs{border-bottom-color:var(--line)}
h3{color:var(--accent)}
.btn.pri{font-weight:600}
@media (max-width:560px){.plate img{height:30px}h1{font-size:16px}.brand{gap:10px}}
/* каталог: цвета и пиктограммы по группам препаратов */
.pc{border-left:4px solid var(--gc,var(--line))}
.gi{display:inline-block;flex:none;width:34px;height:34px;background:var(--gc,var(--accent));-webkit-mask:var(--gi) center/contain no-repeat;mask:var(--gi) center/contain no-repeat}
.gi.big{width:52px;height:52px}
.pc .hd{display:flex;gap:10px;align-items:center}
.gchip{background:color-mix(in srgb,var(--gc) 18%,transparent);color:var(--ink)}

.pgrid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;align-items:start}
.pmain{min-width:0}
.pan{background:var(--surface2);border-radius:8px;padding:12px;margin-top:14px;position:sticky;top:8px}
.al{list-style:none;margin:0;padding:0;font-size:12.5px}
.al li{padding:5px 0;border-top:1px solid var(--line);line-height:1.35;overflow-wrap:anywhere}
.al li:first-child{border-top:0}
.ar{color:var(--muted)}
.am{margin-top:6px;font-size:12.5px}
.am summary{cursor:pointer;color:var(--accent);font-weight:600;padding:4px 0}
@media (max-width:820px){.pgrid{grid-template-columns:1fr}.pan{position:static}}

<script>
/* ---------- разбор таблиц менеджеров ---------- */
const pad2=n=>String(n).padStart(2,'0');
const cellv=(r,i)=>(i<0||!r||r[i]==null)?'':String(r[i]).replace(/ /g,' ').trim();
function parseDate(s){
  // диапазоны «05-07.10.2026», «28 -30.10. 2026» берём по первой дате; пробелы внутри убираем
  const m=/^(\d{1,2})(?:\s*-\s*\d{1,2})?\.(\d{1,2})\.(\d{4})$/.exec(String(s||'').replace(/\s+/g,'').trim());
  if(!m)return '';
  const d=+m[1],mo=+m[2],y=+m[3];
  if(mo<1||mo>12||d<1||d>31||y<2000||y>2100)return '';
  return y+'-'+pad2(mo)+'-'+pad2(d);
}
function parseNum(s){
  const t=String(s==null?'':s).replace(/[^\d,.]/g,'').replace(',','.');
  const n=parseFloat(t);
  return isNaN(n)?0:n;
}
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
function uniqId(prefix,key,seen){
  let id=prefix+hash(key);
  if(seen[id]){seen[id]++;id+='_'+seen[id]}else seen[id]=1;
  return id;
}
const DEFAULT_MGRS=[
  {n:'Екатеринский Вячеслав',s:'Екатеринск'},{n:'Жукашев Абай',s:'Жукашев'},{n:'Жигарь Василий',s:'Жигарь'},
  {n:'Бурковский Николай',s:'Бурковский',i:'Н'},{n:'Бурковский Роман',s:'Бурковский',i:'Р'},
  {n:'Гладких Михаил',s:'Гладких'},{n:'Айтпаев Азамат',s:'Айтпаев'},{n:'Орлов Александр',s:'Орлов'},
  {n:'Жамбулов Саят',s:'Жамбулов'},{n:'Лейман Виктор',s:'Лейман'}
];
function parseManagers(str){
  const t=String(str||'');const out=[];
  for(const m of DEFAULT_MGRS){
    const re=new RegExp(m.s+'[^\\s]*\\s*'+(m.i?'([А-ЯA-Z])':''),'i');
    const mm=re.exec(t);
    if(!mm)continue;
    if(m.i){
      // инициал сразу после фамилии; Бурковский Н.Р. = Николай, Бурковский Р.Н. = Роман
      const all=[...t.matchAll(/Бурковск[^\s]*\s*([А-ЯA-Z])/gi)].map(x=>x[1].toUpperCase());
      if(!all.includes(m.i))continue;
    }
    out.push(m.n);
  }
  return out;
}
function normType(t){
  const raw=String(t||'').trim();
  if(!raw)return '';
  const s=raw.toLowerCase();
  if(s.includes('выезд'))return 'Выезд';
  if(s.includes('звон'))return 'Звонок';
  if(/whats|вацап|ватсап|вотсап|ватс/.test(s))return 'WhatsApp';
  if(s.includes('встреч'))return 'Встреча в офисе';
  return 'Другое';
}
const kpiCat=type=>type==='Выезд'?'visit':(type?'other':'');
function normStatus(f){
  const s=String(f||'').trim().toLowerCase();
  if(s==='выполнено')return 'done';
  if(s==='не выполнено')return 'failed';
  return '';
}

function parseJournal(values){
  const manager=cellv(values[0],0);
  const rows=[],seen={};
  for(let i=1;i<(values||[]).length;i++){
    const r=values[i]||[];
    const date=parseDate(cellv(r,0));
    if(!date)continue;
    const client=cellv(r,1),type=normType(cellv(r,2)),contact=cellv(r,3),plan=cellv(r,4);
    const status=normStatus(cellv(r,5)),result=cellv(r,6),pay=cellv(r,7);
    if(!client&&!plan&&!contact&&!result)continue; // пустые строки-заготовки с одной датой
    rows.push({id:uniqId('a_',[manager,date,client,type,plan,contact].join('|'),seen),rec:{date,manager,client,type,cat:kpiCat(type),contact,plan,status,result,pay}});
  }
  return {manager,rows};
}
function parseAgro(values){
  const rows=[],seen={};
  for(let i=1;i<(values||[]).length;i++){
    const r=values[i]||[];
    const date=parseDate(cellv(r,0));
    if(!date)continue;
    const rec={date,requestedBy:cellv(r,1),client:cellv(r,2),place:cellv(r,3),contact:cellv(r,4),goal:cellv(r,5),work:cellv(r,6),result:cellv(r,7),next:cellv(r,8)};
    if(!rec.client&&!rec.goal)continue;
    rows.push({id:uniqId('g_',[rec.date,rec.requestedBy,rec.client,rec.goal].join('|'),seen),rec});
  }
  return rows;
}
function colMap(header,rules){
  const map={};
  rules.forEach(([k,re])=>{map[k]=header.findIndex(h=>re.test(String(h||'')))});
  return map;
}
function parseFarmArea(text){
  const t=String(text||'').replace(/ /g,' ');
  let m=/пашн[иы]\s*([\d\s]+?)\s*га/i.exec(t);
  if(!m&&/^\s*\d/.test(t))m=/^\s*([\d\s]+?)\s*га/i.exec(t);
  if(!m)return 0;
  return parseInt(m[1].replace(/\s/g,''),10)||0;
}
/* этап хозяйства по тексту менеджера: контакт ставим только при явном признаке контакта */
function farmStage({info,status,last,note}){
  const own=[last,status].join(' ').trim();
  if(/наш клиент/i.test([info,status,last,note].join(' '))||/^\s*работаем\s*\.?\s*$/i.test(own))return 'client';
  if(!own)return 'none';
  if(/(?<!не\s)работа(?:ют|ет)\s+с\s+нами/i.test(own))return 'client';
  if(/не\s*знаком|не\s*знаю|не\s*работа(?:л(?!\w)|ем|ет|ют)|не\s*связ|не\s*предлагал|не\s*общал|не\s*встреч|не\s*был\b|не\s*нашел|не\s*нашёл|контакт\w*\s*нет|нет\s*контакт|без\s*контакт/i.test(own))return 'none';
  if(/отказ/i.test(own))return 'refused';
  if(/встреч|звон|\bбыл\b|\bбыла\b|видел|разговар|ездил|посещ|предлаг|отправил|прайс|\bкп\b|на связи|работал\w*\s+с\s+(?:нами|мной)|\d{1,2}\.\d{1,2}\.\d{2,4}/i.test(own))return 'contact';
  return 'none';
}
function parseFarms(values){
  const out=[],seen={};
  if(!values||!values.length)return out;
  const hi=values.findIndex(r=>r&&/насел[её]н/i.test(cellv(r,0)+cellv(r,1)));
  const H=hi<0?0:hi;
  const header=(values[H]||[]).map(x=>String(x||''));
  const c=colMap(header,[
    ["settlement",/насел[её]н/i],['manager',/закреплен/i],['dist',/рассто/i],['name',/наименование/i],
    ['contacts',/контактн/i],['areaText',/площад/i],['info',/доп/i],['last',/когда и с кем/i],
    ['note',/примечан/i],['status',/статус/i]
  ]);
  if(c.name<0)c.name=3;
  let settlement='',manager='',dist='';
  for(let i=H+1;i<values.length;i++){
    const r=values[i]||[];
    const st=cellv(r,c.settlement);
    if(st){settlement=st;manager=cellv(r,c.manager);dist=cellv(r,c.dist)}
    else if(cellv(r,c.manager)){manager=cellv(r,c.manager)}
    const name=cellv(r,c.name);
    if(!name)continue;
    const areaText=cellv(r,c.areaText),info=cellv(r,c.info),last=cellv(r,c.last),status=cellv(r,c.status),note=cellv(r,c.note);
    const stage=farmStage({info,status,last,note});
    const mg=parseManagers(manager);
    const rec={settlement,name,manager:mg.length?mg.join(', '):manager,dist,contacts:cellv(r,c.contacts),areaText,area:parseFarmArea(areaText),info,last,status,note,stage};
    out.push({id:uniqId('f_',settlement+'|'+name,seen),rec});
  }
  return out;
}
function parseSummary(values){
  const out=[];
  if(!values||!values.length)return out;
  const header=(values[0]||[]).map(x=>String(x||''));
  const c=colMap(header,[['manager',/менеджер/i],['district',/район/i],['area',/площад/i],['dist',/рассто/i],['contracts',/контракт/i],['sales',/реализ/i],['cover',/покрыт/i]]);
  for(let i=1;i<values.length;i++){
    const r=values[i]||[];
    const district=cellv(r,c.district);
    if(!district||/^итого/i.test(district)||/дистрибьютор/i.test(district))continue;

    }
    idxPaint();

    let dPend=false;PQ.forEach(p=>{if(p.c==='districts'&&!p.ok)dPend=true});
    if(!syncedOnce&&!dPend&&jobSig()===idxSig){syncedOnce=true;let t0=0;try{t0=+localStorage.getItem('crm_sync_t')||0}catch(e){}if(Date.now()-t0>3*36e5){try{localStorage.setItem('crm_sync_t',String(Date.now()))}catch(e){}syncRecent()}}
  }finally{farmIdxBusy=false}
}

let GPS=null,gpsBusy=false,gpsWk=0;
function gpsLoad(){if(gpsBusy||GPS||!db||!myUid||!isOwner)return;gpsBusy=true;db.collection('mgr/'+myUid+'/gps').get().then(s=>{GPS=s.docs.map(x=>x.data()||{})}).catch(()=>{GPS=[]}).finally(()=>{gpsBusy=false;if(tab==='dash')render()})}
function gpsPanel(){
  if(!isOwner)return '';

  if(!GPS.length)return '';
  const DN=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],MN=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  const mon=new Date();mon.setHours(12,0,0,0);mon.setDate(mon.getDate()-((mon.getDay()+6)%7)+gpsWk*7);
  const days=[0,1,2,3,4,5,6].map(i=>{const x=new Date(mon);x.setDate(mon.getDate()+i);return x});
  const ds=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
  const lab=x=>x.getDate()+' '+MN[x.getMonth()];
  const by=new Map(GPS.map(g=>[g.mgr+'|'+g.date,g]));
  const mgrs=[...new Set(GPS.map(g=>g.mgr))].filter(Boolean).sort();

  const cell=g=>{if(!g)return '<span class="muted">—</span>';const it=g.items||[];
    const tr=it.filter(i=>i.k==='trip').map(i=>`<div class="chip acc" style="display:block;white-space:normal;margin-bottom:3px;line-height:1.3" title="${esc((i.d||'')+(i.f&&i.f.length?' · в охвате: '+i.f.join(', '):''))}">${esc(i.p)}<br><span style="font-weight:400">${esc(i.t||'')} · ${dur(i.m||0)}</span></div>`).join('');
    const bs=it.filter(i=>i.k!=='trip').map(i=>esc(i.p)).join(', ');
    return tr+(bs?`<div class="muted" style="font-size:12px">${bs}</div>`:'')};
  return `<div class="panel" style="padding:0;margin-top:14px"><div class="spread" style="padding:14px 14px 8px"><h3 style="margin:0">Где были менеджеры · GPS <span class="muted" style="font-weight:400;font-size:12px">видно только вам</span></h3><div class="row"><button class="btn sm" data-act="gps-wk" data-arg="-1" aria-label="Предыдущая неделя">‹</button><span class="muted">${lab(days[0])} – ${lab(days[6])}</span><button class="btn sm" data-act="gps-wk" data-arg="1" aria-label="Следующая неделя"${gpsWk>=0?' disabled':''}>›</button></div></div><div class="tbl" style="border:0"><table style="min-width:900px;table-layout:fixed"><thead><tr><th style="width:120px">Менеджер</th>${days.map((x,i)=>`<th>${DN[i]} ${x.getDate()}</th>`).join('')}</tr></thead><tbody>${mgrs.map(m=>`<tr style="vertical-align:top"><td><b>${esc(m)}</b></td>${days.map(x=>`<td>${cell(by.get(m+'|'+ds(x)))}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
}

let dupArm='';
const nzName=s=>String(s||'').toLowerCase().replace(/ё/g,'е').replace(/[«»"'`]/g,'').replace(/\s+/g,' ').trim();
function dupGroups(){
  const m=new Map();
  (farmIdx||[]).forEach(f=>{const n=nzName(f[0]);if(!n||n.length<2)return;(m.get(n)||m.set(n,[]).get(n)).push(f)});
  const g=[];m.forEach(arr=>{if(arr.length>1)g.push(arr)});
  const sameDist=a=>new Set(a.map(f=>f[8])).size<a.length;
  g.sort((a,b)=>(sameDist(b)-sameDist(a))||(a[0][0]<b[0][0]?-1:1));
  return g;
}
/* список лишних копий: полностью идентичные (название+контакты+этап+надёжность+дата) в пределах одного района — оставляем по одной */
function dupDelList(){
  const nzC=s=>String(s||'').toLowerCase().replace(/\s+/g,' ').trim();
  const keyOf=f=>[f[3],f[4],(f[10]||'').trim(),(f[11]||'')].join('§');
  const out=[];
  dupGroups().forEach(arr=>{
    const c0=nzC(arr[0][10]);if(!arr.every(f=>nzC(f[10])===c0))return;
    const k0=keyOf(arr[0]);if(!arr.every(f=>keyOf(f)===k0))return;
    const byD={};arr.forEach(f=>{(byD[f[8]]=byD[f[8]]||[]).push(f)});
    Object.keys(byD).forEach(d=>{const l=byD[d];for(let i=1;i<l.length;i++)out.push(l[i])});
  });
  return out;
}

  }).join('');
  const delN=dupDelList().length;
  const autoBtn=delN?'<div style="margin:0 0 10px"><button class="btn pri" data-act="dup-all">'+(dupArm==='__all__'?('Точно удалить '+delN+' лишних копий?'):('Удалить все полностью идентичные ('+delN+')'))+'</button> <span class="muted" style="font-size:12px">уберёт лишние копии там, где совпадает всё (название, контакты, этап, надёжность, дата) в одном районе, оставив по одной</span></div>':'';
  return '<div class="panel" style="grid-column:1/-1"><h3>Дубликаты хозяйств · групп: '+g.length+'</h3><p style="margin:0 0 6px" class="muted">Хозяйства с одинаковым названием и совпадающими контактами (одинаковые названия с разными контактами не показаны — это разные хозяйства). «Записи идентичны» — совпадают ещё и этап, надёжность и дата. Удалите лишнюю строку кнопкой справа (нажмите дважды для подтверждения). Красным помечены двойники внутри одного района — это обычно и есть случайный повтор.</p>'+autoBtn+body+'</div>';

  el.innerHTML=`<div class="tbl"><table><thead><tr>${th('settlement','Село')}${th('name','Хозяйство')}${th('risk','Надёжность')}${th('manager','Менеджер')}${th('area','Пашня, га','r')}${th('stage','Этап')}${th('last','Последний контакт')}</tr></thead><tbody>${shown.map(f=>`<tr class="click" data-act="edit-farm" data-id="${f.id}"><td>${esc(f.settlement)}</td><td class="clip"><b>${esc(f.name)}</b><div class="muted" style="font-size:12px">${esc((f.contacts||'').slice(0,110))}</div></td><td><select class="rk ${f.risk?'rk-'+RISK[f.risk].c:''}" data-rk="${f.id}" aria-label="Надёжность">${[['','—'],...Object.entries(RISK).map(([k,v])=>[k,v.n])].map(([k,n])=>`<option value="${k}"${(f.risk||'')===k?' selected':''}>${n}</option>`).join('')}</select></td><td>${esc(f.manager)}</td><td class="r num">${f.area?fmt(f.area):''}</td><td><span class="chip ${f.stage==='client'?'good':f.stage==='contact'?'acc':f.stage==='refused'?'bad':''}">${FSTAGE[f.stage]||''}</span></td><td class="clip muted">${esc((f.last||f.status||'').slice(0,160))}</td></tr>`).join('')}</tbody></table></div>${rows.length>shown.length?`<div style="text-align:center;margin-top:10px"><button class="btn" data-act="more-f">Показать ещё (${rows.length-shown.length})</button></div>`:''}`;
}
let fStore={};
function rebuildFarms(id,us){
  const seen=new Set(),out=[];
  for(const u of us)for(const f of (fStore[u]||[])){if(seen.has(f.id))continue;seen.add(f.id);out.push({...f,_u:u})}
  FARMS=(isAdm()&&viewAs)?out.filter(f=>{const mg=parseManagers(f.manager||'');return !mg.length||mg.includes(viewAs)}):out;
}
function openDistrict(id,q){
  dist=id; ff={q:q||'',stage:'',mgr:'',set:'',risk:'',sk:'',sd:1,lim:300};
  if(farmsUnsub){farmsUnsub();farmsUnsub=null}
  FARMS=[];farmsFor=null;fStore={};farmErr='';
  const d=byId(S.districts,id);
  if(db&&id&&d){
    const us=d._us||[myUid],offs=[];let got=0;
    us.forEach(u=>{
      offs.push(db.collection('mgr/'+u+'/districts/'+id+'/farms').onSnapshot(snap=>{
        if(!(u in fStore))got++;
        fStore[u]=snap.docs.map(x=>({id:x.id,...x.data()}));
        rebuildFarms(id,us);farmsFor=id;
        if(got>=us.length)syncDistrictStats(id);
        if(tab==='reach'&&dist===id){const a=document.activeElement;if(a&&a.id==='ff-q'){fillFarms()}else render()}
      },err=>{farmErr=(err&&(err.code||err.message))||'ошибка';if(!(u in fStore)){fStore[u]=[];got++}rebuildFarms(id,us);farmsFor=id;toast('Не удалось прочитать хозяйства: '+farmErr);if(tab==='reach'&&dist===id)render()}));
    });
    farmsUnsub=()=>offs.forEach(f=>f&&f());
  }
  render();
}
let statT=null;
function syncDistrictStats(id){
  clearTimeout(statT);
  statT=setTimeout(async()=>{
    const d=byId(S.districts,id); if(!d||farmsFor!==id)return;
    for(const u of (d._us||[])){
      if(u!==myUid&&!isAdm())continue; /* чужой кабинет не правим */
      const prev=dSl[id]&&dSl[id][u]; if(!prev)continue;
      const fs=FARMS.filter(f=>f._u===u);
      const farmCount=fs.length,contacted=fs.filter(f=>isCov(f.stage)).length,clients=fs.filter(f=>f.stage==='client').length;
      if(prev.farmCount===farmCount&&prev.contacted===contacted&&prev.clients===clients)continue;
      await putAt(u,'districts',id,{...prev,farmCount,contacted,clients});
    }
  },1200);
}

function vDeals(){
  const mg=managers();
  const ds=S.deals.filter(d=>!dealMgr||d.manager===dealMgr);
  const head=`<div class="spread"><div class="row"><label class="muted" for="sel-mgr">Менеджер</label><select id="sel-mgr"><option value="">Все</option>${mg.map(m=>`<option${m===dealMgr?' selected':''}>${esc(m)}</option>`).join('')}</select></div><span class="row"><button class="btn" data-act="q-list">Заявки на КП</button><button class="btn pri" data-act="new-deal">+ Сделка</button></span></div>`;
  if(!S.deals.length)return head+empty('Сделок пока нет. Каждая сделка проходит этапы от лида до оплаты.',`<button class="btn pri" data-act="new-deal">+ Сделка</button>`);
  return head+`<div class="board">${STAGES.map((s,i)=>{
    const a=ds.filter(d=>d.stage===s.id).sort((x,y)=>(x.close||'9')<(y.close||'9')?-1:1),tot=a.reduce((n,d)=>n+(+d.amount||0),0);
    return `<section class="col"><header><b>${s.name}</b><span class="num muted" style="font-size:11px">${a.length} · ${short(tot)}</span></header>${a.map(d=>{
      const prev=s.id==='lost'?'talks':(i>0?STAGES[i-1].id:null),next=s.id==='lost'?null:(STAGES[i+1]&&STAGES[i+1].id!=='lost'?STAGES[i+1].id:null);
      return `<div class="card" data-act="edit-deal" data-id="${d.id}"><div class="nm">${esc(d.title)}</div><div class="muted">${esc(d.client||'Без клиента')}</div><div class="num">${money(d.amount)}</div>${d.prepay?`<div class="muted" style="font-size:12px">предоплата ${money(d.prepay)}${d.amount?' ('+Math.round(d.prepay/d.amount*100)+'%)':''}</div>`:''}${d.products?`<div class="muted" style="font-size:12px">${esc(d.products)}</div>`:''}<div class="muted" style="font-size:12px">${d.prepayDate?'предоплата до '+fdate(d.prepayDate)+' · ':''}${d.close?'расчёт до '+fdate(d.close)+' · ':''}${esc(d.manager||'')}</div>
      <div class="mv"><span>${prev?`<button class="btn sm" data-act="move" data-id="${d.id}" data-arg="${prev}" aria-label="Назад">${s.id==='lost'?'Вернуть':'‹'}</button>`:''}</span><span>${next?`<button class="btn sm" data-act="move" data-id="${d.id}" data-arg="${next}" aria-label="Дальше">›</button>`:''}</span></div></div>`}).join('')||'<div class="muted" style="font-size:12px">—</div>'}</section>`}).join('')}</div>`;
}

function qNum(){return Math.max(0,...S.quotes.map(x=>+x.num||0))+1}
function qCalc(q){
  const items=(q.items||[]).filter(i=>i.name||nf(i.qty)||nf(i.price));
  const total=items.reduce((t,i)=>t+nf(i.qty)*nf(i.price),0);
  let first=0,pct=0;
  if(q.payMode==='sum'){first=nf(q.first);pct=total?Math.round(first/total*1000)/10:0}
  else{pct=nf(q.pct);first=Math.round(total*pct/100)}
  return {items,total,first,pct,rest:Math.max(0,total-first)};
}
function qPayText(q,c){
  c=c||qCalc(q);
  if(!c.total&&!c.first)return 'Условия оплаты уточняются.';
  if(c.pct>=100)return 'Оплата: 100% предоплата'+(q.prepayDate?' до '+dmy(q.prepayDate):'')+'.';
  let t='Оплата: предоплата '+nfmt(c.pct)+'% ('+nfmt(c.first)+' ₸)'+(q.prepayDate?' до '+dmy(q.prepayDate):'');
  t+=', окончательный расчёт'+(q.finalDate?' до '+dmy(q.finalDate):' — по согласованию')+' (остаток '+nfmt(c.rest)+' ₸).';
  return t;
}
function qDelText(q){const ds=[...new Set((q.items||[]).map(i=>i.date).filter(Boolean))].sort();return 'Условие поставки товара: '+(q.delivery||'самовывоз / доставка')+(ds.length?', срок поставки '+(ds.length>1?'с '+dmy(ds[0])+' по '+dmy(ds[ds.length-1]):dmy(ds[0])):'')+'.'}

const DV_EXTRA={'ЭНДИМИОН':'2,4-Д'};
function qDv(name){
  const nz=x=>String(x||'').toLowerCase().split(',')[0].replace(/\s+\d+([.,]\d+)?\s*%/g,'').replace(/\s+кнр$/,'').replace(/\s+/g,' ').trim();
  const k=nz(name);if(!k)return '';
  let a='';
  const c=(typeof CATALOG!=='undefined'?CATALOG:[]).find(x=>nz(x.name)===k||nz(x.oldName)===k);
  if(c)a=c.active;
  if(!a){const p=(S.products||[]).find(x=>nz(x.name)===k);if(p)a=p.active||p.ai}
  if(!a)a=DV_EXTRA[String(name).trim().toUpperCase()]||'';

const GR_CAPSKIP=['кх','тоо','фх','к/х','ф/х','ип','ух'];
function gFix(s){

  s=s.replace(/ +,/g,',');
  s=s.replace(/(?<=[А-Яа-яЁёA-Za-z0-9%)]),(?=[А-Яа-яЁёA-Za-z(«"])/g,', ');
  s=s.replace(/(?<=[а-яё]{3})\.(?=[А-ЯЁA-Z])/g,'. ');
  return s.replace(/[ \t]{2,}/g,' ').trim();
}
function gCap(s){const w=s.split(' ')[0].toLowerCase();return(s&&/^[а-яёa-z]/.test(s[0])&&!GR_CAPSKIP.includes(w))?s[0].toUpperCase()+s.slice(1):s}
let GP={busy:false,msg:'',items:null};
async function gScan(){

async function gApply(){
  if(!isOwner||GP.busy||!GP.items||!GP.items.length)return;
  const by=new Map();GP.items.forEach(it=>{const key=it.u+'|'+it.col+'|'+it.id;(by.get(key)||by.set(key,[]).get(key)).push(it)});
  const all=[...by.values()];let ok=0,skip=0,fail=0;GP.busy=true;GP.msg='Применяю…';render();

    const it0=list[0];
    try{
      const ref=db.collection('mgr/'+it0.u+'/'+it0.col).doc(it0.id),snap=await ref.get();
      if(!snap.exists){skip++;return}

      for(const it of list)if(cur[it.k]===it.old)patch[it.k]=it.nw;
      if(!Object.keys(patch).length){skip++;return}
      await ref.set({...cur,...patch});ok++;

function vTasks(){

стьев к фитофторозу.","Рекомендации по применению":"Протравливание семян зерновых Максусом можно проводить заблаговременно или непосредственно перед посевом. Клубни картофеля обрабатывают непосредственно перед посадкой или при посадке. Допускается последовательное использование Максуса с ризоторфином при протравливании сои и гороха.","Совместимость":"Максус совместим с другими фунгицидными и инсектицидными протравителями, имеющими нейтральную химическую реакцию. Несовместим с препаратами на основе органических растворителей.","Приготовление рабочей жидкости":"Залить в бак протравочной машины 1/2 объема воды и включить мешалку. Добавить отмеренное количество препарата. Долить оставшееся количество воды до заданной нормы."},"advantages":["Самый эффективный продукт против фузариозных гнилей и других заболеваний, передающихся через почву","Прекрасно защищает картофель от видов парши, ризоктониоза и гнилей при хранении","Обладает иммуномодулирующим действием — культуры дружно прорастают","Оказывает продолжительную защиту от почвенных патогенов"]}},{"name":"РЕКСОЛ","group":"Протравители","status":"Регистрация 2026","source":"Список препаратов 2026–2028","regs":[{"crop":"Пшеница и ячмень яровые","dose":"0,4 л/т","target":"Твердая, пыльная, каменная головня, плесневение семян, корневые гнили","cropTags":["Пшеница","Ячмень"],"objClass":"Болезни","objTags":["Головня","Корневые гнили","Плесневение семян"],"technology":"Не применяется","method":"Протравливание семян суспензией препарата (10 л воды на 1 т семян).","regYear":2026}],"active":"тебуконазол, 60 г/л","catalogInfo":{"meta":{"purpose":"Универсальный системный протравитель семян","package":"Канистра 5 л","storage":"2 года","temperature":"от –10 до +40 °C"},"sections":{"Механизм действия":"Тебуконазол вызывает гибель гриба вследствие ингибирования синтеза эргостерина, являющегося основным строительным материалом клеток патогена. Действующее вещество способно проникать в зародыш семени. В момент его набухания и прорастания обеспечивает защиту от поверхностной и внутрисеменной инфекции.","Спектр действия":"Виды головни, фузариозные и гельминтоспориозные корневые гнили, плесневение семян.","Период защитного действия":"Рексол обеспечивает надежную защиту всходов от момента посева до фазы кущения. Препарат способен подавлять раннюю аэрогенную инфекцию (септориоз, мучнистая роса, ржавчина).","Возможность возникновения резистентности":"Для предотвращения резистентности обработки препаратом следует чередовать с препаратами из других химических групп.","Рекомендации по применению":"Обработку семян Рексолом проводят на протравочных машинах перед посевом или заблаговременно (до 6 месяцев). Расход рабочей жидкости составляет 10 л/тонну семян. При протравливании свежеубранных семян озимых с повышенной влажностью норму расхода рабочего раствора необходимо снизить. Чтобы обеспечить высокое качество протравливания, необходимо выполнять следующие условия:\n• семена должны быть без повреждений, очищены от пыли и примесей\n• нужно регулярно контролировать равномерность покрытия семян по степени окрашивания и норме расхода препарата.","Совместимость":"Совместим с другими протравителями и микроудобрениями, кроме препаратов с сильнощелочной или кислой реакцией. Однако в каждом конкретном случае необходима проверка на совместимость.","Приготовление рабочей жидкости":"• наполните бак протравочной машины на 1/2 необходимого объёма водой и включите перемешивающее устройство\n• встряхните канистру с препаратом\n• добавьте рассчитанное и отмеренное количество препарата Рексол и другие компоненты баковой смеси\n• добавьте оставшееся количество воды\n• перемешивание должно происходить в течение всего периода приготовления рабочей жидкости и процесса протравливания"},"advantages":["Исключительная эффективность против всех видов головни","Эффективен против поверхностной и внутренней семенной инфекции","Способствует формированию сильных растений","Обладает продолжительным защитным действием"]}},{"name":"Тридан","group":"Протравители","status":"Новая регистрация 2028","source":"Список препаратов 2026–2028","regs":[{"crop":"Пшеница яровая","dose":"0,4–0,5 л/т","target":"Твердая головня, пыльная головня, фузариозная корневая гниль, гельминтоспориозная корневая гниль, плесневение семян","cropTags":["Пшеница"],"objClass":"Болезни","objTags":["Твердая головня","Пыльная головня","Фузариозная корневая гниль","Гельминтоспориозная корневая гниль","Плесневение семян"],"technology":"Не применяется","method":"Протравливание семян с увлажнением перед посевом или заблаговременно. Расход рабочей жидкости – 10 л/т.","regYear":2028}],"active":"тиабендазол, 80 г/л + тебуконазол, 60 г/л + имазалил, 60 г/л","catalogInfo":{"meta":{"package":"5 л, 10 л.","storage":"2 года с даты изготовления в невскрытой заводской упаковке.","temperature":"От -5 °C до +30 °C"},"sections":{"Механизм действия":"Трехкомпонентный системный протравитель. Тебуконазол подавляет биосинтез эргостерола в мембранах клеток патогенов, эффективен против головневых инфекций и корневых гнилей. Тиабендазол нарушает процесс деления ядер клеток (митоз), связываясь с тубулином, обеспечивая контроль снежной плесени и прикорневых гнилей. Имазалил ингибирует синтез стеринов, проявляет локально-системное действие, активно защищает зародыш от гельминтоспориозной корневой гнили и плесневения семян.","Спектр действия":"Каменная головня, пыльная головня, твердая головня, ложная пыльная головня, фузариозная корневая гниль, гельминтоспориозная корневая гниль, плесневение семян, полосатая и темно-бурая пятнистости,","Скорость действия":"Препарат проникает в семя при набухании и начинает действовать с момента начала прорастания.","Период защитного действия":"Обеспечивает полную защиту всходов и молодой корневой системы от момента прорастания семян до фазы кущения — начала выхода в трубку.","Совместимость":"Совместим с большинством инсектицидных протравителей, регуляторов роста и микроудобрений. Перед приготовлением баковой смеси рекомендуется провести тестовое смешивание.","Возможность возникновения резистентности":"Комбинация трех действующих веществ из разных химических классов (бензимидазолы, триазолы, имидазолы) с разным механизмом воздействия исключает риск возникновения резистентности.","Рекомендации по применению":"Протравливание семян с увлажнением перед посевом или заблаговременно (до 1 года). Семенной материал должен быть очищен от пыли и примесей. Норма расхода препарата: 0,4–0,5 л/т.","Расход рабочей жидкости":"10 л/т."},"advantages":["Выраженный синергизм трех действующих веществ из разных химических классов; максимальный спектр защиты от корневых гнилей, головни; высокая эффективность защиты как на поверхности, так и внутри семени и в прикорневой зоне; полное отсутствие ретардантного действия на проростки; невозможность развития резистентности."]}},{"name":"Алгоритм","group":"Гербициды","status":"Регистрация 2026","source":"Список препаратов 2026–2028","regs":[{"crop":"Соя","dose":"0,7–1,0 л/га","target":"Однолетние двудольные и злаковые сорняки","cropTags":["Соя"],"objClass":"Сорняки","objTags":["Злаковые сорняки"],"technology":"Не применяется","method":"Опрыскивание почвы до всходов или в фазе 3 настоящих листьев культуры. Расход рабочей жидкости 200–300 л/га.","regYear":2026},{"crop":"Картофель","dose":"0,2 л/га","target":"Однолетние двудольные и злаковые сорняки","cropTags":["Картофель"],"objClass":"Сорняки","objTags":["Злаковые сорняки"],"technology":"Не применяется","method":"Опрыскивание почвы до всходов культуры. Расход рабочей жидкости 200–300 л/га.","regYear":2026},{"crop":"Рапс яровой","dose":"0,2 л/га","target":"Однолетние двудольные и злаковые сорняки","cropTags":["Рапс"],"objClass":"Сорняки","objTags":["Злаковые сорняки"],"technology":"Классическая","method":"Опрыскивание почвы до всходов культуры. Расход рабочей жидкости 200–300 л/га.","regYear":2026}],"active":"кломазон, 480 г/л","catalogInfo":{"meta":{"purpose":"Гербицид для борьбы с однолетними двудольными и некоторыми злаковыми сорняками в посевах сои, картофеля и рапса","package":"Канистра 1 л, 5 л","storage":"2 года","temperature":"от 0 до +30 °C"},"sections":{"Механизм действия":"Препарат поступает в растения через корни, побеги, листья и блокирует синтез каротиноидов, что ведёт к разрушению хлорофилла и ингибированию процесса фотосинтеза.","Период защитного действия":"Почвенное действие на прорастающие сорняки сохраняется более 30 дней.","Спектр действия":"Высокочувствительные виды: злаковые — куриное просо, росичка кровяная, мышей сизый, мышей зеленый, лисохвост, плевел; двудольные — марь белая, подмаренник цепкий, канатник Теофраста, паслен черный, гречишки, горцы, амброзия полыннолистная, пастушья сумка, горчица полевая, гибискус, яснотка стеблеобъемлющая.","Возможность возникновения резистентности":"Для предотвращения возникновения устойчивости к препарату необходимо чередовать его с гербицидами из других химических групп.","Скорость действия":"При применении по вегетации симптомы поражения (хлоротичная окраска, побеление) проявляются на 3 день, полная гибель наступает через 10–14 дней в зависимости от видового состава, фазы развития сорняков и погодных условий. При использовании в качестве почвенного гербицида гибель сорняков наступает в момент прорастания.","Рекомендации по применению":"Использование как почвенного гербицида. Применять препарат рекомендуется в первые 3 дня после посева культуры. Заделка препарата в почву не требуется. Достаточная влажность почвы — одно из условий оптимального поглощения. Применение смеси Алгоритм 0,4 л/га + Дифилайн 1,0 л/га на сое после посева позволяет сохранить чистое поле до следующей обработки, даже при очень высокой степени засорённости. Если наблюдается недостаток почвенной влаги после применения гербицида, рекомендуется провести прикатывание. Норма расхода препарата зависит от типа почвы, фазы развития и видового состава сорняков. На почвах лёгкого механического состава, с невысоким содержанием гумуса рекомендуется использовать минимальные дозы. Максимальный гербицидный эффект достигается при хорошей выровненности поверхности поля, мелкокомковатой структуре почвы и отсутствию растительных остатков. Использование смеси Алгоритм 0,12–0,15 л/га + Дифилайн 1,0 л/га на яровом рапсе — лучший способ борьбы с такими сорняками, как марь белая и виды щирицы. Использование по вегетации. При использовании на сое по вегетации смеси Алгоритм 0,2–0,4 л/га + Бентасил 1,5–2,0 л/га достигается самая высокая эффективность против мари и амброзии. Нежелательно использовать препарат в смеси с микроэлементами (медь, железо, цинк и т. д.). При применении препарата в совокупности более 0,8 л/га в сезон возможны побеления на следующий год.","Совместимость":"Совместим с другими пестицидами, кроме препаратов с сильнощелочной или кислой реакцией. Однако в каждом конкретном случае необходима проверка на совместимость. Не рекомендуется применять по вегетации сои в баковой смеси с препаратами на основе фомесафена в силу заметного снижения эффективности. При применении препарата в совокупности более 0,6 л/га в сезон возможны побеления на следующий год."},"advantages":["Как почвенный гербицид:","Защищает обрабатываемые культуры в наиболее критический период развития","Подавляет более 50 видов однолетних двудольных и злаковых сорняков","Не имеет ограничений по севообороту","Эффективно подавляет подмаренник цепкий","Незаменимый компонент в баковых смесях с другими почвенными гербицидами, проявляет синергический эффект","Как гербицид по вегетации на сое:","Расширяет спектр подавляемых сорняков (марь белая, падалица подсолнечника в т.ч. Clearfield и Экспресс) в баковых смесях с препаратами на основе бентазона","Почвенное действие позволяет сдержать следующую волну сорняков и обеспечить чистое поле до уборки"]}},{"name":"АНТАРЕС","group":"Гербициды","status":"Регистрация 2026","source":"Список препаратов 2026–2028","regs":[{"crop":"Горох","dose":"1,2–1,4 л/га","target":"Однолетние и многолетние двудольные сорняки","cropTags":["Горох"],"objClass":"Сорняки","objTags":["Многолетние двудольные сорняки","Двудольные сорняки"],"technology":"Не применяется","method":"Опрыскивание посевов в фазе 3–5 настоящих листьев культуры (при высоте растения гороха 10–15 см). Запрещается обрабатывать культуру во время цветения. Расход рабочей жидкости 200–300 л/га.","regYear":2026},{"crop":"Лен","dose":"1,2–1,4 л/га","target":"Однолетние и многолетние двудольные сорняки","cropTags":["Лён"],"objClass":"Сорняки","objTags":["Многолетние двудольные сорняки","Двудольные сорняки"],"technology":"Не применяется","method":"Опрыскивание посевов в фазе \"ёлочки\" при высоте культуры 3–10 см. Расход рабочей жидкости 200–300 л/га.","regYear":2026},{"crop":"Пшеница яровая","dose":"1,2–1,4 л/га","target":"Однолетние и многолетние двудольные сорняки","cropTags":["Пшеница"],"objClass":"Сорняки","objTags":["Многолетние двудольные сорняки","Двудольные сорняки"],"technology":"Не применяется","method":"Опрыскивание посевов в фазе кущения культуры до выхода в трубку. Расход рабочей жидкости 200–300 л/га.","regYear":2026}],"active":"МЦПА, 600 г/л","catalogInfo":{"meta":{"purpose":"Селективный системный гербицид для борьбы с двудольными сорняками в посевах льна, гороха, сои и яровой пшеницы","package":"Канистра 10 л","storage":"2 года","temperature":"от –5 до +35 °C"},"sections":{"Механизм действия":"МЦПА в рекомендуемых дозах обладает разноплановым действием: поглощается листьями, действует на наземные органы и корневую систему сорняков, тормозит синтез ферментов и ростовых веществ, ослабляет процессы дыхания и фотосинтеза.","Спектр действия":"Однолетние двудольные сорняки.","Период защитного действия":"Обеспечивает защиту посевов от момента обработки до появления новой «волны» сорняков.","Скорость действия":"Гербицид быстро проникает в листья сорняков, вызывая видимые признаки угнетения через 3–7 дней с момента обработки. Стебли и листья сорняков скручиваются и утолщаются, на стебле образуются трещины, рост растений нарушается. Полное отмирание сорняков происходит через 2–3 недели.","Возможность возникновения резистентности":"Случаев возникновения резистентности сорняков к препарату не отмечено. Для предотвращения возникновения устойчивости к препарату необходимо чередовать его с гербицидами из других химических групп.","Рекомендации по применению":"Не рекомендуется обрабатывать культуру, испытывающую угнетение из-за неблагоприятных погодных или иных условий. При применении максимальных доз препарата на основе МЦПА на отдельных культурах (лен, картофель, горох) по вегетирующим растениям сразу после обработки могут появиться негативные проявления активности гербицида. На льне может наблюдаться снижение высоты растений и незначительное ухудшение качества льносоломы. Иногда возможно легкое подкручивание растений, пропадающее в скором времени.","Совместимость":"Гербицид можно сочетать с сульфонилмочевинами для расширения спектра действия на двудольные сорняки. Также возможно смешивание с удобрениями, фунгицидами и инсектицидами при условии совпадения периодов внесения."},"advantages":["Подавляет широкий спектр однолетних двудольных сорняков","Прекрасный партнер в баковых смесях","Не фитотоксичен","Не накладывает ограничений на севооборот"]}},{"name":"Арбалет","group":"Гербициды","status":"Регистрация 2026","source":"Список препаратов 2026–2028","regs":[{"crop":"Пшеница и ячмень яровые","dose":"0,008–0,010 кг/га","target":"Однолетние двудольные, в т.ч. устойчивые к 2,4-Д и 2М-4Х и некоторые многолетние двудольные","cropTags":["Пшеница","Ячмень"],"objClass":"Сорняки","objTags":[],"technology":"Не применяется","method":"Опрыскивание посевов в фазе 2–3 листьев - до второго междоузлия культуры. На следующий год можно высевать только зерновые колосовые культуры.","regYear":2026}],"active":"метсульфурон-метил, 600 г/кг","catalogInfo":{"meta":{"purpose":"Гербицид для борьбы с однолетними двудольными сорняками и некоторыми многолетними двудольными сорняками в посевах пшеницы и ячменя","package":"Пакет 500 г","storage":"2 года","temperature":"от -20 до +30 °C"},"sections":{"Механизм действия":"Метсульфурон-метил проникает в растение через листья и частично через корневую систему, блокирует в нем синтез фермента ацетолактатсинтазы, участвующей в синтезе незаменимых аминокислот валина, лейцина и изолейцина. Подавление данного фермента блокирует деление клеток, приводит к быстрой остановке роста сорняков, пожелтению, а затем к их гибели.","Спектр действия":"Чувствительные сорняки: аистник цикутный, амброзия полыннолистная, бифора лучистая, бородавник обыкновенный, вика сорнополевая, воробейник полевой, воронья лапка, галинсога (виды), герань рассеченная, горох посевной, горчица полевая, донник лекарственный, дурман обыкновенный, дымянка аптечная, желтушник левкойный, звездчатка средняя, крапива жгучая, крестовник обыкновенный, куколь обыкновенный, курай, липучка (виды), лопушник (виды), льнянка обыкновенная, лютик полевой, мак-самосейка, манжетка полевая, пастушья сумка, пикульник (виды), подсолнечник сорный, пупавка (виды), сурепка обыкновенная, фиалка полевая, чина (виды), щирица запрокинутая, ярутка полевая. Среднечувствительные: вероника, герань нежная, гибискус тройчатый, горец почечуйный, горец вьюнковый, гречишка татарская, крапива двудомная, марь многосемянная, марь фиголистная, мать-и-мачеха обыкновенная, мелколепестник канадский, молокан татарский, молочай лозный, одуванчик лекарственный, осот полевой, подорожник (виды), ромашка непахучая, смолевка белая, яснотка (виды).","Период защитного действия":"Действует не только на сорняки, имеющиеся в посевах на момент обработки, но и создает в почве «защитный экран», препятствующий появлению второй «волны» сорняков. Однократное применение обеспечивает эффективную защиту посевов в течение всего вегетационного периода, при условии оптимальной конкуренции культуры.","Скорость действия":"Активный рост сорных растений прекращается через несколько часов после обработки, снижается потребление ими питательных веществ и воды. Полная гибель сорных растений происходит через 2–4 недели после опрыскивания.","Возможность возникновения резистентности":"Резистентность к препарату не выявлена. Для предупреждения возникновения устойчивых видов следует чередовать применение с препаратами, имеющими другие механизмы действия.","Рекомендации по применению":"Наиболее эффективно применение по активно вегетирующим сорнякам в интервале температур; от +10 °С до +25°С. Обладает исключительной избирательностью действия в отношении зерновых культур, оказывая наиболее сильное действие в период активного роста молодых сорных растений. Препарат высокоэффективен против однолетних и некоторых многолетних (в т. ч. устойчивых к 2,4-Д) двудольных сорняков в посевах зерновых. Оптимальные сроки его применения - от фазы 3 листьев до конца кущения культуры. Норма расхода рабочей жидкости должна быть достаточной для полного смачивания листовой поверхности сорняков. Однолетние сорняки эффективно подавляются при обработке в фазу 2–4 листьев, многолетние - в фазу розетки.","Ограничения по севообороту":"На следующий год после уборки зерновых нельзя высевать свеклу и овощи, подсолнечник и гречиху — только после глубокой вспашки. Нельзя высевать гречиху и подсолнечник на следующий год после применения препарата, если рН почвы выше 7,5 или если была продолжительная засуха в период от применения препарата до посева этих культур. При необходимости пересева обработанных препаратом площадей, можно высевать только яровые зерновые."},"advantages":["Высокий контроль над большинством двудольных сорняков при низких нормах расхода","Большая гибкость в сроках применения","Позволяет сдерживать рост многих видов сорняков в течение всего периода вегетации культуры","Высокоэффективен против двудольных сорняков, включая устойчивые к 2,4-Д и МЦПА","Можно применять от фазы 2–3 листьев культуры до выхода в трубку"]}},{"name":"АРГАМАК","group":"Гербициды","status":"Регистрация 2026","source":"Список препаратов 2026–2028","regs":[{"crop":"Пшеница и ячмень яровые","rate":"0,015–0,020 кг/га","dose":"0,015–0,020 кг/га","target":"Однолетние двудольные сорняки, в т.ч. устойчивые к 2,4-Д и 2М-4Х","method":"Опрыскивание посевов в фазе 2–3 листьев — начала кущения культуры и ранние фазы роста сорняков (2–4 листа). Расход рабочей жидкости — 200–300 л/га.","cropTags":["Пшеница","Ячмень"],"objClass":"Сорняки","objTags":["Однолетние двудольные сорняки"],"technology":"Не применяется","regYear":2026},{"crop":"Пшеница и ячмень яровые","rate":"0,020–0,025 кг/га","dose":"0,020–0,025 кг/га","target":"Однолетние двудольные сорняки, в т.ч. устойчивые к 2,4-Д и 2М-4Х и бодяк полевой","method":"Опрыскивание посевов в фазе кущения культуры и ранние фазы роста сорняков (однолетние — 2–4 листа, бодяк полевой — розетка). Расход рабочей жидкости — 200–300 л/га.","cropTags":["Пшеница","Ячмень"],"objClass":"Сорняки","objTags":["Однолетние двудольные сорняки","Бодяк полевой"],"technology":"Не применяется","regYear":2026}],"active":"трибенурон-метил, 750 г/кг","catalogInfo":{"meta":{"purpose":"Высокоэффективный гербицид против более ста видов сорняков на зерновых культурах и подсолнечнике, в т. ч. против сорных растений из семейства крестоцветные и сложноцветные","package":"Пакет 100 г, банка 0.5 и 1 кг","storage":"3 года","temperature":"от - 20 до +30 °C"},"sections":{"Механизм действия":"Препарат поглощается через листья, стебли и корни и перемещается к точкам роста. Трибенуронметил блокирует в сорняках фермент ацетолактатсинтазу, которая участвует в синтезе аминокислот. Это приводит к остановке деления клеток и гибели сорных растений.","Спектр действия":"Пастушья сумка, виды пикульника, виды пупавки, редька дикая, виды ромашки, торица полевая, щирица запрокинутая, ярутка полевая, виды яснотки и др.","Скорость действия":"Остановка роста сорняков происходит через несколько часов после обработки. Через 5–7 дней заметны визуальные признаки поражения (хлороз листьев, отмирание точек роста, антоциановая окраска). Окончательная гибель сорняков происходит через 15–17 дней (срок зависит от видового состава и погодных условий).","Возможность возникновения резистентности":"Для предотвращения возникновения устойчивости к препарату необходимо чередовать его с гербицидами из других химических групп.","Рекомендации по применению":"Препарат применяют для защиты озимых и яровых культур в фазу кущения-трубкования в норме 15–20 г/га, а при наличии на поле бодяка полевого в норме 20–25 г/га. Оптимальная температура для применения Аргамака: от +8 до +25 °C. Обработку следует проводить по активно вегетирующим сорнякам. Сорняки, которые находятся в фазе от 2 до 8 настоящих листьев, наиболее чувствительны к действию препарата. При жаркой и сухой погоде, высокой численности сорняков, при наличии переросших сорняков рекомендуется добавлять суперсмачиватель Агент С в норме 0,05–0,1% рабочего раствора. Не применять препарат, если ночная температура ниже +5 °C, за 3 дня до заморозков и через 3 дня после них. Не применять в условиях, когда культура находится в стрессовом состоянии (по причине засухи, при сильном поражении болезнями и повреждении вредителями). Для расширения спектра подавляемых сорняков в посевах зерновых культур рекомендуется использовать баковые смеси с препаратами на основе 2,4-Д, дикамбы, карфентразон-этила.","Совместимость":"Совместим с другими пестицидами, кроме препаратов с сильнощелочной или кислой реакцией. Однако в каждом конкретном случае необходима проверка на совместимость."},"advantages":["Не представляет опасности для последующих культур севооборота","Широкий диапазон сроков применения вплоть до флагового листа","Незаменимый компонент в баковых смесях с препаратами на основе 2,4-Д, дикамбы, карфентразон-этила"]}},{"name":"Аргамак ДФ","group":"Гербициды","status":"Новая регистрация 2027","source":"Список препаратов 2026–2028","regs":[{"crop":"Подсолнечник","dose":"0,025–0,050 кг/га","target":"Однолетние и некоторые многолетние (бодяк полевой) двудольные сорняки","cropTags":["Подсолнечник"],"objClass":"Сорняки","objTags":["Бодяк полевой","Двудольные сорняки"],"technology":"ExpressSun / SU","method":"Опрыскивание посевов в фазу культуры 2–8 листьев и ранние фазы роста сорняков Срок ожидания / кратность обработок: -(1).","regYear":2027}],"active":"трибенурон-метил, 750 г/кг","catalogInfo":{"meta":{"package":"Пластиковый флакон (банка) емкостью 0,5 кг.","storage":"3 года","temperature":"от -20°C до +30 °C"},"sections":{"Механизм действия":"Системный гербицид избирательного действия, предназначенный для борьбы с однолетними и многолетними сорняками, в том числе устойчивыми к 2,4-Д в посевах зерновых культур и подсолнечник (гибриды, устойчивые к трибенурон-метилу).","Спектр действия":"Широкий спектр двудольных сорняков (более 100 видов), включая виды, устойчивые к 2,4-Д и 2М-4Х. Эффективен против осота (виды), бодяка полевого, подмаренника цепкого, видов ромашки, мари белой, щирицы, пастушьей сумки, горчицы полевой, ярутки, а также падалицы подсолнечника.","Скорость действия":"Рост и деление клеток чувствительных сорняков прекращаются через несколько часов после обработки. Первые видимые признаки поражения (хлороз листьев, отмирание точек роста, антоциановая окраска) проявляются через 5–7 дней. Полная гибель сорных растений наступает через 15–17 дней в зависимости от погоды и видового состава.","Период защитного действия":"Оказывает гербицидное действие на сорняки, присутствовавшие на поле на момент обработки. Период защиты длится до конца вегетационного периода (при отсутствии новой «волны» всходов сорняков).","Совместимость":"Совместим с большинством пестицидов (гербицидами на основе 2,4-Д, дикамбы, карфентразон-этила, фунгицидами, инсектицидами), кроме препаратов с сильнокислой или сильнощелочной реакцией. Не рекомендуется смешивать с фосфорорганическими инсектицидами во избежание фитотоксичности для культуры.","Возможность возникновения резистентности":"Существует вероятность развития устойчивости при многолетнем бессменном использовании препаратов из группы сульфонилмочевин. Для предотвращения резистентности необходимо чередовать применение Аргамака с гербицидами других химических классов или использовать его в баковых смесях.","Рекомендации по применению":"Зерновые опрыскивают в фазу кущения культуры и ранние фазы роста сорных растений. Подсолнечник - опрыскивание посевов в фазу культуры 2–8 листьев и ранние фазы роста сорняков.","Расход рабочей жидкости":"200–300 л/га при наземном опрыскивании."},"advantages":["Высокая эффективность против более 100 видов двудольных сорняков, включая устойчивые к 2,4-Д.","Широкое «окно» применения — селективен к зерновым вплоть до появления флагового листа.","Полное отсутствие ограничений для последующих культур в севообороте благодаря быстрому распаду в почве.","Низкая норма расхода (15–25 г/га на зерновых, до 50 г/га на устойчивом подсолнечнике), удобная в логистике препаративная форма (ВДГ).","Идеальный базовый компонент для высокоэффективных баковых смесей."]}},{"name":"АСТЭРИКС КНР","group":"Гербициды","status":"Регистрация 2026","source":"Список препаратов 2026–2028","regs":[{"crop":"Пшеница яровая и озимая, ячмень яровой","rate":"0,3–0,5 л/га","dose":"0,3–0,5 л/га","target":"Однолетние и многолетние двудольные сорняки","method":"Опрыскивание посевов в фазе кущения культуры до появления второго междоузлия. Расход рабочей жидкости — 200–300 л/га.","cropTags":["Пшеница","Ячмень"],"objClass":"Сорняки","objTags":["Однолетние двудольные сорняки","Многолетние двудольные сорняки"],"technology":"Не применяется","regYear":2026},{"crop":"Кукуруза","rate":"0,3–0,5 л/га","dose":"0,3–0,5 л/га","target":"Однолетние и многолетние двудольные сорняки","method":"Опрыскивание посевов в фазе 3–5 листьев культуры и ранние фазы роста сорняков. Расход рабочей жидкости — 200–300 л/га.","cropTags":["Кукуруза"],"objClass":"Сорняки","objTags":["Однолетние двудольные сорняки","Многолетние двудольные сорняки"],"technology":"Не применяется","regYear":2026}],"active":"2,4-Д кислота, 410 г/л + флорасулам, 7,4 г/л","catalogInfo":{"meta":{"purpose":"Высокоэффективный гербицид на зерновых и кукурузе, в т.ч. против сорных растений из семейства крестоцветные и сложноцветные","package":"Канистра 5 л","storage":"3 года","temperature":"от −15 до +35 °C"},"sections":{"Механизм действия":"Действующие вещества обладают системной активностью, но резко различаются механизмом действия. Благодаря синергизму обеспечивается максимально высокий гербицидный эффект. 2,4-Д выступает в роли ауксиноподобного регулятора роста, в то время как флорасулам является ингибитором биосинтеза незаменимых аминокислот за счёт инактивации фермента ацеталактатсинтазы (ALS).","Спектр действия":"Уничтожает более 150 видов сорных растений, в т.ч. подмаренник цепкий, виды ромашки, бодяк полевой, бодяк щетинистый, виды осота, виды вероники, вьюнок полевой, василек синий, горчицу полевую, пастушью сумку, ярутку полевую, виды яснотки, редьку дикую, марь белую, мак-самосейку, виды щирицы, желтушник левкойный, паслен черный, гулявник лекарственный, дымянку аптечную, звездчатку среднюю, виды горца, гречишку вьюнковую, амброзию полыннолистную, дескурайнию Софии, латук татарский, одуванчик лекарственный, молочай лозный, молокан татарский и др.","Скорость действия":"Визуальные признаки отмечаются через 3–4 дня, полная гибель — через 2–3 недели.","Возможность возникновения резистентности":"Случаев резистентности не отмечено.","Рекомендации по применению":"Наибольшая эффективность гербицида достигается при обработке в фазу 2–6 листьев у однолетних двудольных сорняков (высота 5–10 см), многолетних корнеотпрысковых — в фазу розетки — до начала стеблевания. Максимальную норму расхода следует использовать при высокой засоренности, по переросшим сорнякам и при наличии многолетних корнеотпрысковых сорняков. Оптимальная температура применения — от −15 до +35 °C. Обработку проводить во время активного роста сорняков. Сорняки в фазе от 2 до 8 настоящих листьев наиболее чувствительны к действию препарата. ВНИМАНИЕ! Не применять препарат, если ночная температура ниже +10 °C, за 2 дня до заморозков и через 2 дня после них. Не применять в условиях, когда культура находится в стрессовом состоянии (по причине засухи, при сильном поражении болезнями и повреждении вредителями).","Совместимость":"Совместим с другими пестицидами кроме препаратов с сильнощелочной или кислой реакцией. Однако в каждом конкретном случае необходима проверка на совместимость."},"advantages":["Высокоэффективен против широкого спектра сорных растений","Обладает высокой скоростью проникновения и гербицидного действия","Может применяться в поздние фазы развития","Не имеет последействия и ограничений по севообороту"]}},{"name":"Атриум","group":"Гербициды","status":"Регистрация 2026","source":"Список препаратов 2026–2028","regs":[{"crop":"Кукуруза на зерно","rate":"1,12–1,65 кг/га","dose":"1,12–1,65 кг/га","target":"Однодольные и двудольные сорняки","method":"Опрыскивание сорняков в период активного роста до всходов культуры.","cropTags":["Кукуруза"],"objClass":"Сорняки","objTags":["Однодольные сорняки","Двудольные сорняки"],"technology":"Классическая","regYear":2026}],"active":"атразин, 900 г/кг","catalogInfo":{"meta":{"purpose":"До- и послевсходовый гербицид, который избирательно уничтожает сорняки и злаки в сорго, кукурузе","package":"Пакет 100 г, банка 0,5 кг, 1 кг","storage":"2 года","temperature":"от 0 до +25 °C"},"sections":{"Механизм действия":"Заключается в поглощении корнями, и его эффективность зависит от осадков или полива, которые доставляют его в зону корней сорняков.","Спектр действия":"Сорняки и травы в рапсе (только сорта, устойчивые к триазинам), сорго, кукурузе, сахарной кукурузе, сахарном тростнике, люпине, просе, саккалине и кормовом сорго. Мятлик в укоренившейся люцерне. Бромус в Сирокко (Ковыль тростниковидный), Фаларисе (канареечник), овсянице и райграсе пастбищном.","Рекомендации по применению":"Препарат действует в основном через корневую систему; его эффективность зависит от наличия осадков или полива, которые переносят его в зону корней сорняков. Продолжительность и эффективность борьбы зависят от количества внесенного химиката, типа почвы, количества осадков и вида сорняков. Максимальная норма расхода Атриума при выращивании всех культур, кроме лесопосадок, ограничена количеством препарата, эквивалентным 3 кг Атриума в пересчёте на действующее вещество/га в год. Не превышайте эту норму, особенно при послевсходовом применении атразинового гербицида, если довсходовый гербицид на основе атразина уже применялся. Максимальная норма внесения в лесовосстановлении составляет 4,5 кг Атриума на гектар в год на песчаных почвах и почвах, подверженных сильной эрозии, и 8 кг Атриума на гектар в год на суглинистых и более тяжелых почвах.","Совместимость":"Этот продукт совместим с дикватом и другими остаточными гербицидами, такими как диурон. При выращивании сахарного тростника добавление 2,4-дихлорфеноксиуксусной кислоты поможет в краткосрочной перспективе подавить рост мятлика и других осоковых.","Смешивание":"Заполните резервуар чистой водой на 60–80% ДО добавления Атриума. Начните энергично перемешивать содержимое резервуара и продолжайте перемешивать на протяжении всего процесса смешивания и распыления. Равномерно высыпьте необходимое количество Атриума в резервуар. Обеспечьте интенсивное перемешивание для полного растворения продукта. Не высыпайте продукт в резервуар сразу. После добавления необходимого количества Атриума и получения полной растворимости продолжайте наполнять бак до нужного уровня для опрыскивания. Тщательное перемешивание распыляемой жидкости должно продолжаться в течение всего процесса распыления. Примечание: раствор для распыления не следует оставлять в резервуаре на ночь."},"advantages":["Эффективен в борьбе с однодольными широколиственными сорняками и однолетними двудольными","Малотоксичен для человека и животных","Действие препарата основывается на ингибировании фотосинтеза растений","Устойчив к атмосферным осадкам"]}},{"name":"БЕНТАСИЛ КНР","group":"Гербициды","status":"Регистрация 2026","source":"Список препаратов 2026–2028","regs":[{"crop":"Соя","dose":"1,5–3 л/га","target":"Однолетние двудольные, в т.ч. дурнишник обыкновенный","cropTags":["Соя"],"objClass":"Сорняки","objTags":["Однолетние двудольные сорняки","Двудольные сорняки"],"technology":"Не применяется","method":"Опрыскивание посевов в фазе 1–3 листьев настоящих листьев культуры.","regYear":2026},{"crop":"Горох","dose":"2–3 л/га","target":"Однолетние двудольные, в т.ч. дурнишник обыкновенный","cropTags":["Горох"],"objClass":"Сорняки","objTags":["Однолетние двудольные сорняки","Двудольные сорняки"],"technology":"Не применяется","method":"Опрыскивание посевов в фазе 5–6 листьев культуры и ранние фазы роста сорняков. Принимать во внимание сортовую чувствительность. Расход рабочей жидкости 200–300 л/га.","regYear":2026},{"crop":"Лен","dose":"3–4 л/га","target":"Однолетние двудольные, в т.ч. дурнишник обыкновенный","cropTags":["Лён"],"objClass":"Сорняки","objTags":["Однолетние двудольные сорняки","Двудольные сорняки"],"technology":"Не применяется","method":"Опрыскивание посевов в фазе «елочки» культуры в ранние фазы роста сорняков (3–5 листьев). Расход рабочей жидкости 200–300 л/га.","regYear":2026}],"active":"бентазон, 480 г/л","catalogInfo":{"meta":{"purpose":"Базовый гербицид для защиты бобовых культур и льна масличного","package":"Канистра 20 л, кубитейнер 1000 л","storage":"2 года","temperature":"от 0 до +35 °C"},"sections":{"Механизм действия":"Бентазона основан на необратимом блокировании транспорта электронов, участвующих в процессе фотосинтеза. Как следствие, прерывается ассимиляция СО2, останавливается рост, и растение погибает.","Возможность возникновения резистентности":"Для предотвращения возникновения устойчивости к препарату необходимо чередовать его с гербицидами из других химических групп.","Спектр действия":"Высокочувствительные сорняки: амброзия (виды), василёк синий, горчица полевая, виды мари, ромашка (виды), дурнишник, гречишка вьюнковая, горец почечуйный, канатник Теофраста, пастушья сумка, подсолнечник (падалица), подмаренник цепкий, бодяк полевой, гулявник струйчатый, частуха обыкновенная, виды портулака, виды клубнекамыша, сыть съедобная, щирица запрокинутая, ярутка полевая. Среднечувствительные сорняки: виды ясноток, пикульник обыкновенный, фиалка полевая.","Рекомендации по применению":"Для достижения высокой эффективности опрыскивание должно обеспечить достаточное покрытие сорных растений рабочим раствором. В широкорядных посевах сои обработку следует проводить не позднее смыкания рядков. Холодная погода замедляет действие гербицида, оптимальная температура для применения от +15 до +25 °C. На посевах сои при наличии трудноискоренимых сорняков (марь белая, амброзия полыннолистная) необходимо применять баковую смесь Бентасил 1,5–2,0 л/га + Алгоритм 0,2–0,4 л/га. Эта смесь также показывает высокую эффективность против падалицы подсолнечника, включая гибриды, устойчивые к имидазолинонам и Express Sun.","Совместимость":"Совместим с другими пестицидами, кроме препаратов с сильнощелочной или кислой реакцией. Однако в каждом конкретном случае необходима проверка на совместимость.","Скорость действия":"Видимые признаки гербицидного воздействия проявляются в первую неделю после обработки. Полная гибель сорняков наступает в течение 10–14 дней."},"advantages":["Широкий спектр действия против двудольных сорняков","Может применяться на зерновых с подсевом бобовых трав","Не фитотоксичен для культуры","Не обладает последействием в севообороте","Гибкие сроки применения на сое — от первого тройчатого листа до фазы бутонизации"]}},{"name":"Галлон","group":"Гербициды","status":"Новая регистрация 2027","source":"Список препаратов 2026–2028","regs":[{"crop":"Рапс яровой","dose":"0,5–1,0 л/га","target":"Однолетние злаковые сорняки (виды щетинника, просо куриное, просо сорное) и многолетние злаковые сорняки (пырей ползучий)","cropTags":["Рапс"],"objClass":"Сорняки","objTags":["Однолетние злаковые сорняки","Многолетние злаковые сорняки","Пырей ползучий","Злаковые сорняки"],"technology":"Классическая","method":"Опрыскивание однолетних злаковых сорняков в период их активного роста (в фазе от 2–6 листьев до кущения) и при высоте пырея ползучего 10–15 см. Расход рабочей жидкости - 200–300 л/га. Срок ожидания / кратность обработок: 60(1).","regYear":2027},{"crop":"Лен масличный","dose":"0,5–1,0 л/га","target":"Однолетние злаковые сорняки (виды щетинника, просо куриное, просо сорное) и многолетние злаковые сорняки (пырей ползучий)","cropTags":["Лен"],"objClass":"Сорняки","objTags":["Однолетние злаковые сорняки","Многолетние злаковые сорняки","Щетинник","Просо","Пырей ползучий"],"technology":"Не применяется","method":"Опрыскивание однолетних злаковых сорняков в период их активного роста (в фазе от 2–6 листьев до кущения) и при высоте пырея ползучего 10–15 см. Расход рабочей жидкости - 200–300 л/га. Срок ожидания / кратность обработок: 60(1).","regYear":2027},{"crop":"Сахарная свекла","dose":"0,5–1,0 л/га","target":"Однолетние злаковые сорняки (виды щетинника, просо куриное, просо сорное) и многолетние злаковые сорняки (пырей ползучий)","cropTags":["Свекла сахарная"],"objClass":"Сорняки","objTags":["Однолетние злаковые сорняки","Многолетние злаковые сорняки","Щетинник","Просо","Пырей ползучий"],"technology":"Не применяется","method":"Опрыскивание однолетних злаковых сорняков в период их активного роста (в фазе от 2–6 листьев до кущения) и при высоте пырея ползучего 10–15 см. Расход рабочей жидкости - 200–300 л/га. Срок ожидания / кратность обработок: 60(1).","regYear":2027},{"crop":"Подсолнечник","dose":"0,5–1,0 л/га","target":"Однолетние злаковые сорняки (виды щетинника, просо куриное, просо сорное) и многолетние злаковые сорняки (пырей ползучий)","cropTags":["Подсолнечник"],"objClass":"Сорняки","objTags":["Однолетние злаковые сорняки","Многолетние злаковые сорняки","Щетинник","Просо","Пырей ползучий"],"technology":"Классическая","method":"Опрыскивание однолетних злаковых сорняков в период их активного роста (в фазе от 2–6 листьев до кущения) и при высоте пырея ползучего 10–15 см. Расход рабочей жидкости - 200–300 л/га. Срок ожидания / кратность обработок: 60(1).","regYear":2027}],"active":"галоксифоп-П-метил, 104 г/л","catalogInfo":{"meta":{"package":"Пластиковая канистра емкостью 5 л или 10 л.","storage":"3 года","temperature":"от -15°C до +30 °C"},"sections":{"Механизм действия":"Системный высокоселективный послевсходовый гербицид для борьбы с однолетними и многолетними злаковыми сорными растениями на посевах рапса ярового, льна масличного, сахарной свеклы и подсолнечника.","Спектр действия":"Селективный противо злаковый препарат. Уничтожает однолетние злаковые сорняки (овсюг, виды щетинника, просо куриное, метлица, росичка) и многолетние злаковые сорняки (пырей ползучий, гумай, свинорой пальчатый, падалица зерновых). Абсолютно безопасен для двудольных (широколиственных) культур.","Скорость действия":"Первые признаки угнетения сорняков (остановка роста, пожелтение и некроз верхушечных листьев) проявляются через 5–7 дней после обработки. Полная гибель однолетних злаков наступает через 10–14 дней, многолетних — через 2–3 недели в зависимости от погодных условий.","Период защитного действия":"Уничтожает злаковые сорные растения, вегетирующие на момент обработки. Гербицидный эффект сохраняется в течение всего вегетационного периода при условии отсутствия второй «волны» всходов сорняков.","Совместимость":"Прекрасно совмещается в баковых смесях с большинством гербицидов, предназначенных для борьбы с двудольными сорняками (на основе бентазона, клопиралида, фенмедифама, десмедифама, этофумезата), а также с инсектицидами и фунгицидами. Исключение составляют препараты с сильнощелочной реакцией.","Возможность возникновения резистентности":"При соблюдении регламентов применения и чередовании с гербицидами других химических классов риск возникновения устойчивости минимален. Рекомендуется использовать в системах защиты с граминицидами иного механизма действия (например, на основе клетодима).","Рекомендации по применению":"Опрыскивание однолетних злаковых сорняков в период их активного роста (в фазе от 2–6 листьев до кущения) и при высоте пырея ползучего 10–15 см.","Расход рабочей жидкости":"200–300 л/га."},"advantages":["Инновационная препаративная форма (КЭ): Концентрат эмульсии обеспечивает идеальное удержание капель на восковом налете злаков, быстрое проникновение действующего вещества внутрь листа и высокую дождестойкость уже через 1 час после обработки.","Высочайшая эффективность против пырея: Надежно уничтожает корневую систему многолетних злаков, предотвращая их повторное отрастание из скрытых почек.","Полная селективность к культуре: Не оказывает фитотоксического действия на двудольные растения, что позволяет применять его в любую фазу развития защищаемой культуры.","Экономичность и гибкость: Низкие нормы расхода и возможность гибкого выбора сроков внесения в зависимости от фазы развития сорняков, а не культуры.","Идеальный компонент для баковых смесей: Позволяет за один проход полностью очистить посевы от смешанного типа засоренности при совмещении с противодвудольными гербицидами."]}},{"name":"Герб 900","group":"Гербициды","status":"Регистрация 2026","source":"Список препаратов 2026–2028","regs":[{"crop":"Кукуруза","dose":"1,5–3,0 л/га","target":"Однолетние злаковые и двудольные сорняки","cropTags":["Кукуруза"],"objClass":"Сорняки","objTags":["Двудольные сорняки"],"technology":"Не применяется","method":"Опрыскивание почвы до посева (с заделкой при недостатке влаги) или до всходов культуры.","regYear":2026},{"crop":"Подсолнечник, соя","dose":"1,5–2,7 л/га","target":"Однолетние злаковые и двудольные сорняки","cropTags":["Подсолнечник","Соя"],"objClass":"Сорняки","objTags":["Двудольные сорняки"],"technology":"Классическая","method":"Опрыскивание почвы до всходов культуры.","regYear":2026}],"active":"ацетохлор, 900 г/л","catalogInfo":{"meta":{"purpose":"Довсходовый гербицид для продолжительной защиты посевов кукурузы, подсолнечника и сои от однолетних злаковых и двудольных сорняков","package":"Канистра 20л","storage":"3 года","temperature":"от –10 до +35 °C"},"sections":{"Механизм действия":"Воздействует на проростки сорных растений. Проникает в сорняки преимущественно через корни и в меньшей степени через колеоптиль и семядоли. Он ингибирует синтез белков, следствием чего является гибель чувствительных видов растений.","Спектр действия":"Злаковые: куриное просо, щетинники, росички, просо, плевел, мятлик, лисохвост, овсюг, гумай из семян, пырей ползучий из семян. Двудольные сорняки: щирица, марь, амброзия, горцы, ромашка, паслен черный, бодяк из семян, осот из семян и др.","Скорость действия":"Гербицид применяется до посева или до всходов культурных растений. Действие гербицида на прорастающие сорняки проявляется достаточно быстро - через 2–5 дней после опрыскивания.","Возможность возникновения резистентности":"Для предупреждения возникновения резистентности у сорняков рекомендуется чередовать обработки гербицидом Герб 900 с применением других препаратов, имеющих отличный от него механизм действия.","Рекомендации по применению":"Максимальный эффект от применения Герб 900 будет получен равномерном внесении на выровненную, тщательно разделанную (без комков и крупных растительных остатков) поверхность почвы без заделки (если почва увлажнена) или с легкой заделкой (если почва сухая). Вносить сразу после посева, но возможно внесение и перед посевом. Минимальные (в пределах регламента) нормы расхода используются на легких (супесчаных, песчаных), бедных органикой (не более 1,5% гумуса) почвах, максимальные - на тяжелых (глинистых), а также почвах с высоким содержанием гумуса (4–5% и более). В течение всего периода защитного действия препарата, как правило, не рекомендуется, в целях сохранения целостности гербицидного экрана, проведение любых видов механической обработки почвы. Следует полностью отказаться от междурядных обработок или сократить их число. В случаях образования почвенной корки, затрудняющей всходы культур, возможна обработка вдоль рядков легкими ротационными боронами.","Совместимость":"Совместим со многими препаратами, которые рекомендованы для использования на культурах,.","Период защитного действия":"Гербицид обеспечивает защиту посевов от сорняков в течение всего вегетационного периода (не менее 8–10 недель при благоприятных погодных условиях)."},"advantages":["Уничтожает сорняки в довсходовый период","Активность гербицида в почве сохраняется длительное время (10–12 недель)","Отличается высокой фотостабильностью, не летуч, не подвержен воздействию высоких температур","Не создает проблемы остаточных количеств в продукции, поскольку гербицид не проникает в надземные органы растений"]}},{"name":"ДИФИЛАЙН","group":"Гербициды","status":"Регистрация 2026","source":"Список препаратов 2026–2028","regs":[{"crop":"Подсолнечник, рапс яровой, соя, кукуруза","dose":"1,3–1,6 л/га","target":"Однолетние злаковые и некоторые двудольные сорняки","cropTags":["Подсолнечник","Рапс","Соя","Кукуруза"],"objClass":"Сорняки","objTags":["Двудольные сорняки"],"technology":"Классическая","method":"Опрыскивание почвы до всходов культуры. Расход рабочей жидкости — 200–400 л/га.","regYear":2026}],"active":"S-метолахлор, 960 г/л","catalogInfo":{"meta":{"purpose":"Довсходовый гербицид для защиты подсолнечника, кукурузы, сои и рапса","package":"Канистра 5 л, 20 л, кубитейнер 1000 л","storage":"3 года","temperature":"от –30 до +35 °C"},"sections":{"Механизм действия":"Гербицид Дифилайн блокирует процесс деления клеток, что ведёт к прекращению отрастания и гибели сорняков. В злаковых сорняках С-метолахлор проникает в колеоптиль, в процессе чего росток скручивается и гибнет. В двудольных действующее вещество проникает в семядоли и вызывает их гибель.","Спектр действия":"Куриное просо, просо волосовидное, щетинник (виды), росичка (виды), гумай (проростки), щирица (виды), звездчатка средняя, пастушья сумка, портулак огородный, ромашка (виды), галинсога (виды), яснотка (виды) и многие другие.","Скорость действия":"Препарат контролирует сорняки в момент прорастания.","Период защитного действия":"Почвенное действие препарата на прорастающие сорняки сохраняется 8–10 недель.","Возможность возникновения резистентности":"Для предотвращения возникновения устойчивости к препарату необходимо чередовать его с гербицидами из других химических групп.","Рекомендации по применению":"Применять препарат рекомендуется в течение первых трёх дней после посева культуры. Достаточная увлажненность почвы — одно из условий оптимального поглощения. Если наблюдается недостаток почвенной влаги, после применения гербицида рекомендуется провести прикатывание почвы. При сухой почве рекомендуется проведение опрыскивания гербицидом перед высевом семян и лёгкая заделка на глубину 2–3 см. Норма расхода препарата зависит от типа почвы, уровня и видового состава сорняков. На почвах лёгкого механического состава, с невысоким содержанием гумуса рекомендуется использовать минимальные дозы. Максимальный гербицидный эффект достигается при хорошей выровненности поверхности поля, мелкокомковатой структуре почвы и отсутствию растительных остатков. Для расширения спектра действия рекомендуется баковая смесь с гербицидами Алгоритм или Акзифор. На рапсе при наличии мари белой, амброзии и подмаренника цепкого: Дифилайн 1,0 л/га + Алгоритм 0,12–0,15 л/га. На сое при наличии мари белой и амброзиии: Дифилайн 1,0 л/га + Алгоритм 0,2–0,4 л/га.","Совместимость":"Совместим с другими пестицидами, кроме препаратов с сильнощелочной или кислой реакцией. Однако в каждом конкретном случае необходима проверка на совместимость."},"advantages":["Высокоэффективен против широкого спектра однолетних злаковых и двудольных сорняков","Устраняет конкуренцию с сорными растениями в начальный период роста","Не оказывает фитотоксичного воздействия на культуру и не имеет последействия","Обеспечивает продолжительный период защитного действия от 8 до 10 недель"]}},{"name":"КЛОРИТ","group":"Гербициды","status":"Регистрация 2026","source":"Список препаратов 2026–2028","regs":[{"crop":"Пшеница озимая и яровая","dose":"0,2–0,4 л/га","target":"Виды ромашки, горца, гречишка вьюнковая, виды бодяка, осота, латука","cropTags":["Пшеница"],"objClass":"Сорняки","objTags":["Осот"],"technology":"Не применяется","method":"Опрыскивание посевов в фазе кущения до выхода в трубку культуры. Озимые обрабатываются весной. Расход рабочей жидкости 200–300 л/га.","regYear":2026},{"crop":"Рапс яровой (семенные посевы)","dose":"0,2–0,4 л/га","target":"Виды осота, ромашки, горца","cropTags":["Рапс"],"objClass":"Сорняки","objTags":["Осот"],"technology":"Классическая","method":"Опрыскивание культуры в фазе 3–4 настоящих листьев. Расход рабочей жидкости 200–300 л/га.","regYear":2026},{"crop":"Кукуруза","dose":"0,2–0,4 л/га","target":"Виды ромашки, горца, гречишка вьюнковая, виды бодяка, осота, латука","cropTags":["Кукуруза"],"objClass":"Сорняки","objTags":["Осот"],"technology":"Не применяется","method":"Опрыскивание посевов в фазе 3–5 листьев культуры. Расход рабочей жидкости 200–300 л/га.","regYear":2026},{"crop":"Сахарная свекла","dose":"0,3–0,5 л/га","target":"Виды ромашки, горца, гречишка вьюнковая, виды бодяка, осота, латука","cropTags":["Сахарная свекла"],"objClass":"Сорняки","objTags":["Осот"],"technology":"Не применяется","method":"Опрыскивание посевов в фазе 1–3 пары настоящих листьев культуры. Расход рабочей жидкости 200–300 л/га.","regYear":2026},{"crop":"Лен масличный","dose":"0,1–0,3 л/га","target":"Виды осота, ромашки, горца","cropTags":["Лён"],"objClass":"Сорняки","objTags":["Осот"],"technology":"Не применяется","method":"Опрыскивание посевов в фазе «елочки». Расход рабочей жидкости 200–300 л/га.","regYear":2026}],"active":"клопиралид, 300 г/л","catalogInfo":{"meta":{"purpose":"Незаменимый гербицид для борьбы с трудноискоренимыми и злостными сорняками в посевах сельскохозяйственных культур","package":"Канистра 5 л","storage":"3 года","temperature":"от 0 до +30 °C"},"sections":{"Механизм действия":"Системный гербицид ауксинового типа. Клопиралид поглощается всеми органами растения, перемещается по нему и накапливается в точках роста, нарушая деление клеток. Сорняки прекращают рост через несколько часов после обработки.","Спектр действия":"Виды осота, бодяка, латука, ромашки, горца, гречишка вьюнковая, одуванчик, щавель, подорожник, тысячелистник и другие двудольные сорняки.","Скорость действия":"Признаки увядания сорных растений (деформация, скручивание, утолщение стеблей и листьев) наблюдаются на 4–5 день; хлороз, отмирание точки роста и затем гибель сорняков — через 10–15 дней.","Период защитного действия":"Действует только на сорняки, находившиеся в посевах в момент проведения обработки. На сорняки, взошедшие после проведения опрыскивания, препарат не действует.","Возможность возникновения резистентности":"Для предотвращения возникновения устойчивости к препарату необходимо чередовать его с гербицидами из других химических групп.","Рекомендации по применению":"Оптимальная температура для применения препарата от +10 °C до +25 °C. Обработку следует проводить по активно вегетирующим сорнякам: 2–10 листьев у однолетних и 10–15 см («розетка») у многолетних корнеотпрысковых сорняков. Не рекомендуется применять препарат за 3 дня до и после заморозков. Не применять в условиях, когда культура находится в стрессовом состоянии (по причине засухи, при сильном поражении болезнями и повреждении вредителями). Препарат не оказывает влияния на последующие культуры севооборота.","Совместимость":"Совместим с другими пестицидами, кроме препаратов с щелочной или кислой реакцией. Однако в каждом конкретном случае необходима проверка на совместимость."},"advantages":["Работает против злостных сорняков в посевах с/х культур (виды осота, бодяка, латука, горца, ромашки и др.)","Уничтожает как надземную, так и подземную часть сорных растений","Обладает высокой селективностью к защищаемым культурам","Прекрасный партнёр для баковых смесей"]}},{"name":"Клорузо","gr
