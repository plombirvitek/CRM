 гибель вредителей начинается уже в первые часы после контакта с обработанной поверхностью или зерном.","Период защитного действия":"До 6–12 месяцев при обработке зерна (в зависимости от условий хранения и дозировки) и до 3–6 месяцев при дезинсекции складских помещений и территорий.","Совместимость":"Совместим с большинством других инсектицидов и фунгицидов, применяемых для обработки складов и зерна. Перед приготовлением баковых смесей рекомендуется предварительно проверять препараты на химическую и физическую совместимость.","Возможность возникновения резистентности":"Риск возникновения резистентности минимален (практически исключен) благодаря комбинации двух действующих веществ из разных химических классов (фосфорорганические соединения + пиретроиды) с кардинально разными механизмами воздействия.","Рекомендации по применению":"- Влажная дезинсекция. Опрыскивание с помощью ручных или моторизованных опрыскивателей.\n- Дезинсекция холодным туманом. Обработка с помощью генераторов холодного тумана. Экспозиция 24 часа.\n- Опрыскивание при перемещении зерна с использованием специальных распылителей инсектицидов."},"advantages":["Синергизм двух активных компонентов разного спектра и механизма действия;","Эффективен против всех основных амбарных вредителей, включая клещей, при явной и скрытой формах заражения;","Обеспечивает длительный период защиты зерна без необходимости повторных обработок;","Сохраняет высокую активность при сниженных температурах воздуха и зерна;","Не оказывает отрицательного влияния на всхожесть семенного материала, пищевые и хлебопекарные качества зерна."]}},{"name":"Тиамакс — протравитель","group":"Протравители","status":"Регистрация 2026","source":"Список препаратов 2026–2028","regs":[{"crop":"Пшеница, ячмень","dose":"0,7–1,4 л/т","target":"Внутристеблевые мухи, блошки","cropTags":["Пшеница","Ячмень"],"objClass":"Вредители","objTags":["Внутристеблевые мухи","Блошки"],"technology":"Не применяется","method":"Обработка семян непосредственно перед посевом или заблаговременно, расход рабочей жидкости 10 л/т.","regYear":2026},{"crop":"Рапс яровой","dose":"12–15 л/т","target":"Крестоцветные блошки, проволочники, ложнопроволочники","cropTags":["Рапс"],"objClass":"Вредители","objTags":["Крестоцветные блошки","Проволочники","Ложнопроволочники","Блошки"],"technology":"Независимо от технологии","method":"Обработка семян непосредственно перед посевом или заблаговременно, расход рабочей жидкости 20 л/т.","regYear":2026},{"crop":"Картофель","dose":"0,3–0,4 л/т","target":"Колорадский жук, проволочники, ложнопроволочники","cropTags":["Картофель"],"objClass":"Вредители","objTags":["Колорадский жук","Проволочники","Ложнопроволочники"],"technology":"Не применяется","method":"Обработка клубней перед посадкой, расход рабочей жидкости 10 л/т.","regYear":2026}],"active":"тиаметоксам, 240 г/л","catalogInfo":{"meta":{"purpose":"Универсальный инсектицидный протравитель семян контактно-системного действия","package":"Канистра 5 л","storage":"2 года","temperature":"от −5 до +35 °C"},"sections":{"Механизм действия":"Тиаметоксам поглощается растением в момент прорастания семян и передвигается по ксилеме к вегетативным частям растений. По механизму действия относится к ингибиторам ацетилхолинэстеразы, вызывает открытие натриевых каналов в цепочке передачи нервного импульса, что приводит к остановке питания и гибели насекомого вследствие перевозбуждения и паралича.","Спектр действия":"Эффективен в борьбе с внутристеблевыми мухами и блошками на зерновых; колорадским жуком и проволочником на картофеле и с крестоцветными блошками, проволочниками, ложнопроволочниками — на рапсе.","Скорость действия":"Тиамакс начинает действовать с момента набухания-прорастания семян.","Период защитного действия":"Период защитного действия до 40 дней, в зависимости от вредителя, обрабатываемой культуры и погодных условий в момент прорастания семян.","Возможность возникновения резистентности":"Для предотвращения возникновения устойчивости к препарату необходимо чередовать его с инсектицидами из других химических групп.","Рекомендации по применению":"Обработку семян Тиамаксом проводят на протравочных машинах перед посевом или заблаговременно. При протравливании свежеубранных семян озимых с повышенной влажностью норму расхода рабочего раствора необходимо снизить. Чтобы обеспечить высокое качество протравливания, необходимо выполнять следующие условия:\n• семена должны быть без повреждений, очищены от пыли и примесей\n• необходимо регулярно контролировать равномерность покрытия семян по степени окрашивания и норме расхода препарата.","Приготовление рабочей жидкости":"• наполните бак протравочной машины на 1/2 необходимого объёма воды и включите перемешивающее устройство\n• встряхните канистру с препаратом\n• добавьте рассчитанное и отмеренное количество препарата Тиамакс и другие компоненты баковой смеси\n• добавьте оставшееся количество воды; перемешивание должно происходить в течение всего периода приготовления рабочей жидкости и процесса протравливания\nРабочий раствор необходимо использовать в течение первых суток после приготовления.","Обработка семенных клубней картофеля":"Для обработки клубней при посадке используют серийно выпускаемые картофелепосадочные машины, оснащённые аппликаторами для протравливания.","Совместимость":"Совместим с другими пестицидами, кроме препаратов с сильнощелочной или кислой реакцией. Однако в каждом конкретном случае необходима проверка на совместимость."},"advantages":["Продолжительная защита от комплекса вредителей всходов","Контроль как почвообитающих, так и наземных вредителей","Совместим с фунгицидными протравителями","Обеспечивает дружные всходы"]}},{"name":"Тиамакс — инсектицид","group":"Инсектициды","status":"Регистрация 2026","source":"Список препаратов 2026–2028","regs":[{"crop":"Пшеница","dose":"0,1–0,2 л/га","target":"Клоп вредная черепашка, пьявицы","cropTags":["Пшеница"],"objClass":"Вредители","objTags":["Клоп вредная черепашка","Пьявицы"],"technology":"Не применяется","method": агонистом ацетилхолинэстеразы: путем открытия натриевых каналов в цепочке передачи нервного импульса вызывает перевозбуждение насекомого с последующим параличем.","Спектр действия":"Эффективен в борьбе с клопом вредная черепашка, пьявицами на злаковых; рапсовым цветоедом на рапсе; колорадским жуком на картофеле; яблонной медяницей и яблонным цветоедом на яблоне; трипсами, блошками и луговым мотыльком на масличном льне.","Скорость действия":"Тиамакс начинает действовать в момент питания насекомого.","Период защитного действия":"Защитное действие сохраняется от 2-х до 4-х недель в зависимости от культуры, видового состава вредителей и погодных условий.","Возможность возникновения резистентности":"Для предотвращения возникновения устойчивости к препарату необходимо чередовать его с инсектицидами из других химических групп.","Рекомендации по применению":"Тиамакс высокоэффективен при применении в начале заселения вредителями, с учётом ЭПВ. Норма расхода рабочей жидкости должна быть достаточной для обеспечения покрытия всей поверхности культуры. Обработка проводится в утренние или вечерние часы при температуре +12 … +25 °C. При применении на крестоцветных рекомендуется добавлять в рабочий раствор суперсмачиватель Агент С, 50–100 мл/га, который усиливает действие препарата и позволяет уничтожить вредителей в труднодоступных местах.","Совместимость":"Совместим с другими пестицидами, кроме препаратов с сильнощелочной или кислой реакцией. Однако в каждом конкретном случае необходима проверка на совместимость."},"advantages":["Контролирует широкий спектр вредителей основных с/х культур и садов","Эффективность мало зависит от погодных условий","Обладает трансламинарным и системным эффектом","Совместим с большинством гербицидов и фунгицидов, применяемых в те же сроки"]}},{"name":"ШАМАН","group":"Инсектициды","status":"Регистрация 2026","source":"Список препаратов 2026–2028","regs":[{"crop":"Рапс","dose":"1,5–2,0 л/га","target":"Рапсовый цветоед","cropTags":["Рапс"],"objClass":"В чей жидкости — 100–400 л/га.","regYear":2026}],"active":"хлорпирифос, 500 г/л + циперметрин, 50 г/л","catalogInfo":{"meta":{"purpose":"Инсектицид широкого спектра действия, который защищает культуру при неблагоприятных условиях","package":"Канистра 5 л","storage":"2 года","temperature":"от −15 до +25 °C"},"sections":{"Механизм действия":"Хлорпирифос действует как ингибитор ацетилхолинэстеразы, вызывает паралич насекомых и последующую гибель. Это вещество эффективно против широкого спектра вредителей, включая грызущих и сосущих насекомых. Циперметрин относится к классу пиретроидов и действует на нервную систему насекомых, вызывая её перевозбуждение, что ведет к параличу и смерти. Особенно эффективен против взрослых особей насекомых и их личинок.","Спектр действия":"Шаман уничтожает клещей, устойчивых к фосфорорганическим инсектицидам. Эффективен против вредителей, устойчивых к фосфорорганическим соединениям и пиретроидам.","Период защитного действия":"Защита растений от вредителей сохраняется до трех недель, что снижает необходимость в частых обработках.","Скорость воздействия":"Препарат начинает действовать сразу после применения, обеспечивая быстрое уничтожение вредителей.","Совместимость":"Препарат совместим с другими пестицидами. Перед созданием баковой смеси необходимо провести тест на совместимость, чтобы избежать нежелательных химических реакций, которые могут снизить эффективность действующих веществ или увеличить риск фитотоксичности. Не рекомендуется смешивание или последовательное использование Шамана с гербицидами на основе сульфонилмочевин в течение 14 дней, чтобы избежать повреждения растений."},"advantages":["Обладает кишечным, контактным, фумигантным, локально-системным и репеллентным действиями","Инсектицид длительного защитного действия с широким спектром действия"]}},{"name":"ТриЗаРа Супер","group":"Фунгициды","status":"Новая регистрация","source":"Список препаратов 2026–2028","regs":[{"crop":"Пшеница яровая","dose":"0,8–1,5 л/га","target":"Ржавчин method":"Опрыскивание в период вегетации: первое - при появлении первых признаков заболевания, второе – через 10–14 дней (при необходимости).Расход рабочей жидкости - 200–300 л/га Срок ожидания / кратность обработок: 60(1–2).","regYear":2027,"cropTags":["Соя"],"objClass":"Болезни","objTags":["Антракноз","Аскохитоз","Пероноспороз"],"technology":"Не применяется"}],"active":"прохлораз, 267 г/л + тебуконазол, 100 г/л + азоксистробин, 83 г/л","catalogInfo":{"meta":{"package":"Пластиковая канистра емкостью 5 л или 10 л.","storage":"3 года","temperature":"от -20°C до +30 °C."},"sections":{"Механизм действия":"Трехкомпонентный системно-трансламинарный фунгицид с выраженным лечебным, защитным и искореняющим действием. Сочетает три действующих вещества из разных химических классов: Прохлораз (имидазолы) — обладает локально-системным действием, эффективно дезинфицирует ткани и подавляет биосинтез эргостерина в мембранах клеток грибов. Тебуконазол (триазолы) — быстро проникает внутрь растения, двигаясь акропетально (вверх по сосудам), блокирует синтез эргостерина, нарушая деление клеток патогена. Азоксистробин (стробилурины) — обладает трансламинарным эффектом, блокирует дыхательную цепь в митохондриях гриба. Подавляет прорастание спор и рост мицелия, а также вызывает выраженный физиологический «зеленый эффект» (продлевает вегетацию, улучшает усвоение азота и устойчивость к засухе).","Спектр действия":"Широкий спектр грибных заболеваний зерновых колосовых культур. Высокоэффективен против прикорневых и стеблевых гнилей (фузариозная, гельминтоспориозная, церкоспореллезная), сетчатой, темного-бурой и полосатой пятнистостей ячменя, септориоза листьев и колоса, мучнистой росы, видов ржавчины (бурая, стеблевая, желтая), ринхоспориоза, а также фузариоза колоса.","Скорость действия":"Препарат начинает проникать в растение сразу после нанесения. Защитный и лечебный эффект активируется в течение первых 2–4 часов после обработки, останавливая дальнейшее продвижение и развитие инфекции.","Период защитного действия":"За счет комбинации стабильных триазолов и стробилурина обеспечивает длительную защиту культурных растений от инфекций на протяжении 3–4 недель (21–28 дней) с момента внесения.","Совместимость":"Совместим в баковых смесях с большинством инсектицидов, гербицидов, регуляторов роста и жидких макро- и микроудобрений, применяемых на зерновых культурах. Перед масштабным применением рекомендуется провести тест на физико-химическую совместимость компонентов смеси.","Возможность возникновения резистентности":"Риск возникновения устойчивости патогенов сведен к минимуму. Препарат содержит три действующих вещества с принципиально разными механизмами влияния на клетки гриба (ингибиторы биосинтеза стеринов + ингибиторы митохондриального дыхания), что исключает формирование перекрестной резистентности.","Рекомендации по применению":"Пшеница яровая, ячмень яровой, сахарная свекла, соя – норма расхода 0,8–1,5 л/га, опрыскивание в период вегетации: первое - при появлении первых признаков заболевания, второе – через 10–14 дней (при необходимости).","Расход рабочей жидкости":"200–300 л/га"},"advantages":["3D-защита посевов: Бескомпромиссный контроль прикорневых гнилей, пятнистостей листьев и болезней колоса в одной канистре.","Лечебный и искореняющий эффект: Прохлораз и тебуконазол быстро «стопируют» уже развивающуюся внутри тканей инфекцию, не давая ей уничтожить флаг-лист и колос.","Физиологический AgCelence-эффект: Азоксистробин стимулирует фотосинтез, снижает уровень стресса растений в засушливых условиях и способствует максимальному наливу зерна.","Идеальная препаративная форма: Концентрат эмульсии (КЭ) гарантирует мгновенное распределение по листовой поверхности и высокую скорость проникновения через кутикулу.","Широкий температурный диапазон: Стабильно работает даже в условиях изменчивой весенне-летней погоды."]}},{"name":"Диего (ФМР 250200)","group":"Фунгициды","status":"Новая регистрация 2027","source":"Список препаратов 2026–2028","regs":[{"crop":"П  ринхоспориоза, фузариоза колоса. На подсолнечнике и рапсе контролирует фомоз, фомопсис, альтернариоз, септориоз, склеротиниоз (белую гниль). На сое эффективен против антракноза, септориоза и пероноспороза.","Скорость действия":"Начинает работать сразу после нанесения на растения. Активное проникновение и перераспределение действующих веществ в тканях происходит в течение первых 2–4 часов, останавливая развитие и распространение инфекции.","Период защитного действия":"За счет стабильного системного действия тебуконазола и прочной фиксации азоксистробина в восковом слое листьев обеспечивает надежную защиту посевов от инфекций на протяжении 3–4 недель (21–28 дней).","Совместимость":"Отлично совмещается в баковых смесях с большинством инсектицидов, гербицидов, регуляторов роста, а также жидких макро- и микроудобрений. Не рекомендуется смешивать с препаратами на основе сильнокислых или сильнощелочных соединений. Перед приготовлением сложной баковой смеси желательно провести тест на физико-химическую совместимость.","Возможность возникновения резистентности":"Риск возникновения устойчивости минимален. Препарат содержит два действующих вещества из принципиально разных химических классов с независимыми механизмами воздействия на патогены (ингибитор синтеза стеринов + ингибитор клеточного дыхания), что исключает формирование перекрестной резистентности.","Рекомендации по применению":"Норма расхода: 0,5–1,0 л/га на пшеница яровая, ячмень яровой, сахарная свекла, подсолнечник, горох, рапс яровой, лен масличный. Опрыскивание в период вегетации: первое - при появлении первых признаков заболевания, второе – через 10–14 дней (при необходимости).","Расход рабочей жидкости":"- 200–300 л/га."},"advantages":["Мощный лечебно-профилактический комплекс: Сочетание лучшего триазола и эталонного стробилурина гарантирует уничтожение скрытой инфекции и защиту нового прироста.","Выраженный физиологический «зеленый» эффект (Greening effect): Азоксистробин оптимизирует водный баланс растения, усиливает усвоение азота и продлевает работу фотосинтетического аппарата, что увеличивает массу тысячи семян и напрямую повышает урожайность.","Универсальность применения: Надежно защищает широкий спектр культур — от зерновых колосовых до масличных и бобовых.","Высокая дождестойкость: Препарат поглощается тканями растений в короткие сроки, поэтому осадки, выпавшие через 1,5–2 часа после обработки, не снижают его эффективность.","Удобная современная препаративная форма: Концентрат суспензии (КС) обеспечивает стабильность рабочего раствора, не забивает форсунки опрыскивателя и отлично распределяется по листу."]}},{"name":"Инспектор","group":"Фунгициды","status":"Регистрация 2026","source":"Список препаратов 2026–2028","regs":[{"crop":"Соя","dose":"0,4 л/га","target":"Аскохитоз, пероноспороз","cropTags":["Соя"],"objClass":"Болезни","objTags":["Аскохитоз","Пероноспороз"],"technology":"Не применяется","method":"Опрыскивание в период вегетации профилактическое при появлении первых признаков болезни. Расход рабочей жидкости — 300 л/га.","regYear":2026},{"crop":"Кукуруза (на зерно)","dose":"0,4 л/га","target":"Фузариоз","cropTags":["Кукуруза"],"objClass":"Болезни","objTags":["Фузариоз"],"technology":"Не применяется","method":"Опрыскивание в период вегетации профилактическое или при появлении первых признаков болезней в фазы видимого образования междоузлий или выметания початочных нитей. Расход рабочей жидкости при наземном опрыскивании — 300 л/га, при авиационном — 50 л/га.","regYear":2026},{"crop":"Кукуруза","dose":"0,4 л/га","target":"Пузырчатая головня, гельминтоспориоз","cropTags":["Кукуруза"],"objClass":"Болезни","objTags":["Пузырчатая головня","Гельминтоспориоз"],"technology":"Не применяется","method":"Опрыскивание в период вегетации. Расход рабочей жидкости — 200–300 л/га.","regYear":2026},{"crop":"Соя","dose":"0,4 л/га","target":"Септориоз","cropTags":["Соя"],"objClass":"Болезни","objTags":["Септориоз"],"technology":"Не применяется","method":"Опрыскивание в период вегетации. Расход рабочей жидкости — 200–300 л/га.","regYear":2026},{"crop":"Яблоня","dose":"0,4 л/га","target":"Мучнистая роса","cropTags":["Яблоня"],"objClass":"Болезни","objTags":["Мучнистая роса"],"technology":"Не применяется","method":"Опрыскивание в период вегетации. Расход рабочей жидкости — 200–300 л/га.","regYear":2026},{"crop":"Пшеница яровая","dose":"0,3–0,6 л/га","target":"Ржавчина, септориоз","cropTags":["Пшеница"],"objClass":"Болезни","objTags":["Ржавчина","Септориоз"],"technology":"Не применяется","method":"Опрыскивание в период вегетации. Расход рабочей жидкости — 200–300 л/га.","regYear":2026},{"crop":"Горох, подсолнечник","dose":"0,3–0,6 л/га","target":"Аскохитоз, ржавчина, белая и серая гнили, альтернариоз, фомоз, фомопсис","cropTags":["Горох","Подсолнечник"],"objClass":"Болезни","objTags":["Аскохитоз","Ржавчина","Белая и серая гнили","Альтернариоз","Фомоз","Фомопсис"],"technology":"Независимо от технологии","method":"Опрыскивание в период вегетации. Расход рабочей жидкости — 200–300 л/га.","regYear":2026}],"active":"пираклостробин, 250 г/л","catalogInfo":{"meta":{"purpose":"Универсальный фунгицид профилактического действия для защиты от основного перечня болезней с/х культур","package":"Канистра 5 л.","storage":"3 года","temperature":"от 0 до +25 °C"},"sections":{"Механизм действия":"Пираклостробин, действующее вещество препарата Инспектор, ингибирует митохондриальное дыхание, блокируя транспорт электронов в цепи цитохромов. Обладает контактным, лечебным и антиспорулятивным действием. Ингибирует прорастание спор, рост ростковых трубок, блокирует образование апрессориев.","Спектр действия":"Белая и серая гнили, альтернариоз, фомоз, фомопсис, аскохитоз, ржавчина, пероноспороз, септориоз.","Скорость действия":"Пираклостробин поступает в растение в течение суток после обработки. Взаимодействует с поверхностью растений, поглощаясь восковым слоем листьев и плодов, при этом на поверхности растения формируются прочно связанные запасы действующего вещества, благодаря чему обеспечивается высокая устойчивость препарата к действию атмосферных осадков. Фунгицидное действие проявляется на 2-ой день после проникновения в клетки гриба.","Период защитного действия":"В силу высокой химической стабильности пираклостробина препарат Инспектор, КЭ защищает культуру от болезней до 21–30 дней.","Возможность возникновения резистентности":"Необходимо чередовать с фунгицидами из других химических групп.","Совместимость":"Препарат Инспектор совместим с фунгицидами и инсектицидами, кроме препаратов, обладающих сильнощелочной или сильнокислой реакцией. Однако в каждом конкретном случае необходимо предварительно проверить смешиваемые компоненты на совместимость и фитотоксичность.","Особенности применения":"Наибольшая эффективность от применения пираклостробина достигается при проведении превентивных обработок."},"advantages":["Эффективная защита сои, гороха и подсолнечника от комплекса грибных заболеваний","Стробилурины работают против большинства типов грибных патогенов","Способствует повышению урожайности","Повышение продуктивности фотосинтеза;","Замедление старения (выраженный физиологический эффект)","Хорошее профилактическое и антиспорулятивное действие фунгицида"]}},{"name":"ТИНАЗОЛ","group":"Фунгициды","status":"Регистрация 2026","source":"Список препаратов 2026–2028","regs":[{"crop":"Пшеница и ячмень яровые (на 2026 год)","dose":"0,5 л/га","target":"Септориоз, ржавчина","cropTags":["Пшеница","Ячмень"],"objClass":"Болезни","objTags":["Ржавчина","Септориоз"],"technology":"Не применяется","method":"Опрыскивание в период вегетации. Расход рабочей жидкости – 200–300 л/га.","regYear":2026},{"crop":"Рапс","dose":"0,5 л/га","target":"Альтернариоз, фомоз","cropTags":["Рапс"],"objClass":"Болезни","objTags":["Альтернариоз","Фомоз"],"technology":"Независимо от технологии","method":"Опрыскивание в период вегетации. Расход рабочей жидкости – 200–300 л/га.","regYear":2026}],"active":"пропиконазол, 250 г/л","catalogInfo":{"meta":{"purpose":"Высокоэффективный системный фунгицид для защиты зерновых культур от широкого спектра возбудителей болезней","package":"Канистра 5 л","storage":"2 года","temperature":"от -15 до +35°С"},"sections":{"Механизм действия":"Ингибирует превращение ланостерина в эргостерин, входящий в состав клеточных мембран грибов, что приводит к нарушению роста мицелия и прекращению спорообразования патогенов.","Спектр действия":"Септориоз, ржавчина бурая, ржавчина стеблевая, альтернариоз, фомоз.","Скорость действия":"Поступает в растение в течение суток через листья и стебли и перемещается акропетально.","Фитотоксичность":"При применении в соответствии с регламентом не оказывает фитотоксического действия.","Совместимость":"Совместим с большинством фунгицидов и инсектицидов, используемых для защиты зерновых культур; можно смешивать с микроудобрениями (при рН воды <10 и её температуре не ниже 10 °С)."},"advantages":["Лечебное и профилактическое действие","Cильный фитотерапевтический эффект","Отличное средство против ржавчины","Способствует развитию и сохранению листового аппарата","Высокая скорость воздействия","Длительный период защитного действия","Прекрасный компонент баковых смесей"]}},{"name":"ТРИАЗОЛ","group":"Фунгициды","status":"Регистрация 2026","source":"Список препаратов 2026–2028","regs":[{"crop":"Пшеница яровая и озимая","dose":"0,5–1,0 л/га","target":"Ржавчина бурая, ржавчина стеблевая, ржавчина желтая, септориоз листьев и колоса, мучнистая роса, ломкость стеблей, пиренофороз, темно-бурая пятнистость, фузариоз колоса, чернь колоса","cropTags":["Пшеница"],"objClass":"Болезни","objTags":["Ржавчина","Септориоз","Мучнистая роса","Ломкость стеблей","Пиренофороз","Темно-бурая пятнистость","Фузариоз колоса","Чернь колоса","Фузариоз"],"technology":"Не применяется","method":"Опрыскивание в период вегетации: первое - при появлении первых признаков заболевания, второе - через 10–14 дней (при необходимости). Расход рабочей жидкости - 200–300 л/га.","regYear":2026},{"crop":"Ячмень яровой и ози аботки растений.\nПриготовление рабочей жидкости с использованием опрыскивателей, оснащенных баком для предварительного растворения (бак-смеситель): не смешивать препарат с водой в баке-смесителе, а подавать в бак опрыскивателя, на 1/2 заполненный водой, в неразбавленном виде. Затем заполнить бак опрыскивателя водой до полного объема. Перемешивание продолжать и во время обработки растений.\nПриготовленную рабочую жидкость необходимо использовать в тот же день.","Совместимость":"Совместим с большинством пестицидов. Однако в каждом конкретном случае смешиваемые препараты следует проверить на совместимость. Смешивать препараты в баке опрыскивателя нужно в следующем порядке:\nСП (водорастворимые пакеты) → СП → ВДГ (СТС) → СК (ВСК) → СЭ → Триазол, КЭ → КНЭ (КМЭ, МЭ, КЭ, ЭМВ) → ВРГ → ВРК (ВР) → ПАВ\nКаждый последующий компонент добавляется после полного растворения (диспергирования) предыдущего.","Механизм действия":"Проявляет профилактическое и лечебное системное действие. Триазол проникает в растение через ассимилирующие части и равномерно распространяется по ксилеме. Фунгицид подавляет биосинтез эргостерина в мембранах клеток патогенов и нарушает процесс метаболизма.","Скорость воздействия":"Проникает в растение через ассимилирующие части в течение 2–4 ч после применения. Благодаря высокой активности тебуконазола, уже через несколько часов после применения фунгицида отмечается улучшение фитосанитарного состояния растений.","Период защитного действия":"4–5 недель с момента обработки. Обладая отличной дождестойкостью, Триазол гарантирует надежную защиту даже в случае выпадения осадков после применения.","Фитотоксичность":"При соблюдении регламентов применения не фитотоксичен.","Возможность возникновения резистентности":"Случаев возникновения резистентности к препарату не выявлено, но для предотвращения ее возможного появления рекомендуется чередовать его применение с препаратами других химических классов."},"advantages":["Отличные системные свойства и высокая скорость действия","Широкий спектр действия – подавление наиболее вредоносных болезней зерновых культур","Профилактика и лечение болезней","Длительный период защиты"]}},{"name":"ФАНФАН","group":"Фунгициды","status":"Регистрация 2026","source":"Список препаратов 2026–2028","regs":[{"crop":"Пшеница яровая, озимая","dose":"0,2–0,4 л/га","target":"Виды ржавчины, мучнистая роса, септориоз, фузариоз колоса","cropTags":["Пшеница"],"objClass":"Болезни","objTags":["Мучнистая роса","Септориоз","Фузариоз"],"technology":"Не применяется","method":"Опрыскивание в период вегетации при проявлении первых признаков заболевания культуры. Расход рабочей жидкости 200–300 л/га.","regYear":2026},{"crop":"Соя","dose":"0,2–0,4 л/га","target":"Церкоспороз, септориоз, антракноз","cropTags":["Соя"],"objClass":"Болезни","objTags":["Антракноз","Септориоз","Церкоспороз"],"technology":"Не применяется","method":"Опрыскивание в период вегетации при проявлении первых признаков заболевания культуры. Расход рабочей жидкости 200–300 л/га.","regYear":2026},{"crop":"Рапс яровой","dose":"0,2–0,4 л/га","target":"Альтернариоз, фомоз","cropTags":["Рапс"],"objClass":"Болезни","objTags":["Альтернариоз","Фомоз"],"technology":"Независимо от технологии","method":"Опрыскивание в период вегетации при появлении первых признаков болезней, последующее — через 10–14 дней (вытягивание стеблей — начало образования стручков в нижнем ярусе). Расход рабочей жидкости — 200–300 л/га.","regYear":2026},{"crop":"Рапс яровой","dose":"0,2–0,4 л/га","target":"Склеротиниоз, мучнистая роса","cropTags":["Рапс"],"objClass":"Болезни","objTags":["Склеротиниоз","Мучнистая роса"],"technology":"Независимо от технологии","method":"Опрыскивание в период вегетации в фазе 9 и более листьев — начало удлинения стебля и конец бутонизации — начало цветения. Расход рабочей жидкости — 200–300 л/га.","regYear":2026}],"active":"ципроконазол, 250 г/л","catalogInfo":{"meta":{"purpose":"Высокоэффективный фунгицид класса триазолов для защиты зерновых культур, рапса и сои от комплекса болезней","package":"Канистра 5 л","storage":"3 года","temperature":"от −15 до +35 °C","pack":"Канистра 5 л"},"sections":{"Механизм действия":"Действующее вещество препарата — ципроконазол — абсорбируется растением в течение 1 часа и переносится акропетально по ксилеме. Эта системная транслокация приводит к хорошему распределению действующего вещества внутри растительных тканей и предотвращает их от смывания. Ципроконазол действует на грибной патоген внутри растения на стадии образования первых отростков. Торможение роста грибов происходит за счет нарушения процесса биосинтеза стеролов в клеточной мембране. Действующее вещество обладает защитным, лечебным или искореняющим действием, когда препарат применяется на ранних стадиях проявления болезней.","Период защитного действия":"Препарат оказывает фунгицидное действие в течение 14–20 дней после применения, в зависимости от климатических условий.","Совместимость":"Препарат совместим с большинством пестицидов, обычно используемых на зерновых. Однако рекомендуется проверять смешиваемые препараты на совместимость.","Возможность возникновения резистентности":"Возможны случаи формирования устойчивых популяций патогенов. При применении препарата по рекомендованным регламентам риск возникновения резистентности у патогенов находится на среднем уровне.","Рекомендации по применению":"Применение рекомендовано при появлении первых признаков заболевания. Опрыскивание посевов в период вегетации: первое — при появлении первых признаков заболевания, второе — через 10–14 дней при необходимости.","Скорость действия":"Фанфан поступает в растения в течение часа после обработки через листья и стебли и перемещается акропетально."},"advantages":["Быстро проникает в растение в любой фазе развития и гарантирует быстрый результат","Обладает профилактическим, лечебным и искореняющим механизмом действия","Обладает высокой системностью","Отличный партнёр в баковой смеси для борьбы с церкоспорозом"]}},{"name":"Футляр (ФМР М350)","group":"Протравители","status":"Новая регистрация 2027","source":"Список препаратов 2026–2028","regs":[{"crop":"Подсолнечник","dose":"3 л/т","target":"Ложная мучнистая роса (пероноспороз)","cropTags":["Подсолнечник"],"objClass":"Болезни","objTags":["Ложная мучнистая роса","Мучнистая роса","Пероноспороз"],"technology":"Независимо от технологии","method":"Предпосевная обработка семян непосредственно перед посевом или заблаговременно (до 1 года). Расход рабочей жидкости - 10–15 л/т. Срок ожидания / кратность обработок: -1.","regYear":2027},{"crop":"Рапс яровой","dose":"1,7 л/т","target":"Черная ножка (питиоз)","cropTags":["Рапс"],"objClass":"Болезни","objTags":["Питиоз","Черная ножка"],"technology":"Независимо от технологии","method":"Предпосевная обработка семян непосредственно перед посевом или заблаговременно (до 1 года). Расход рабочей жидкости - 10–15 л/т. Срок ожидания / кратность обработок: -1.","regYear":2027}],"active":"мефеноксам, 350 г/л","catalogInfo":{"meta":{"package":"Пластиковая канистра емкостью 5 л.","storage":"4 года","temperature":"от 0°C до + 35 °C."},"sections":{"Механизм действия":"Системный фунгицид-протравитель семян из класса фениламидов. Обладает защитным и лечебным действием. Мефеноксам ингибирует биосинтез нуклеиновых кислот РНК (путем подавления активности фермента РНК-полимеразы I) в клетках патогенов, что приводит к полной остановке деления клеток и прекращению роста мицелия. Обладает высокой подвижностью: быстро поглощается семенем при прорастании, проникает в проросток и системно распределяется по всем органам молодого растения (корешкам и первым листьям), защищая его изнутри.","Спектр действия":"Специализированный высокоэффективный контроль грибов из класса Оомицеты (Oomycetes), вызывающих заболевания семян, проростков и всходов. Уничтожает возбудителей корневых гнилей (виды рода Pythium), пероноспороза (ложной мучнистой росы), фитофтороза, черная ножка (питиоз) а также плесневения семян на широком спектре культур (подсолнечник, рапс и др.).","Скорость действия":"Начинает действовать сразу после обработки семян. Защитный барьер активируется в момент набухания зерна и начала его прорастания, предотвращая заражение проростка из почвы и семенной инфекции на самых уязвимых ранних стадиях развития.","Период защитного действия":"Обеспечивает надежную защиту семян, проростков и корневой системы молодых растений от момента посева до фазы 2–4 настоящих листьев культуры (в среднем от 3 до 5 недель в зависимости от полевых условий).","Совместимость":"Отлично совмещается в баковых смесях с большинством других фунгицидных протравителей (на основе тебуконазола, флудиоксонила, азоксистробина) для расширения спектра действия против настоящих грибов (головня, фузариоз, альтернариоз). Также полностью совместим с инсектицидными протравителями и микроудобрениями. Перед приготовлением многокомпонентной смеси рекомендуется провести тест на совместимость.","Возможность возникновения резистентности":"Существует умеренный риск развития устойчивости при моноприменении, так как мефеноксам имеет специфический точечный механизм действия. Для предотвращения резистентности препарат рекомендуется использовать в комбинации (баковых смесях или готовых смесевых продуктах) с фунгицидами других химических классов, обладающих иным механизмом действия (например, с флудиоксонилом).","Рекомендации по применению":"Норма расхода: 3 л/т – подсолнечник. Норма расхода: 1,7 л/т – лен масличный. Предпосевная обработка семян подсолнечника и льна масличного непосредственно перед посевом или заблаговременно (до 1 года).","Расход рабочей жидкости":"10–15 л/т."},"advantages":["Эталон против оомицетов: Обеспечивает непревзойденный уровень защиты от питиозной корневой гнили и ложной мучнистой росы (пероноспороза) на ранних этапах.","Идеальная препаративная форма: Водная эмульсия (ВЭ) гарантирует равномерное распределение препарата по поверхности семенной оболочки, прочную фиксацию без осыпания и отсутствие пыления при дозировании.","Высокая системная мобильность: Быстро перераспределяется внутри прорастающего семени и надежно защищает не только подземную часть, но и первые надземные органы молодого растения.","Энергия старта: Сохраняет всхожесть семян и обеспечивает получение дружных, выровненных и здоровых всходов даже в условиях затяжной и холодной весны.","Низкие нормы расхода: Высокая концентрация действующего вещества позволяет работать минимальными дозировками препарата на тонну семян."]}},{"name":"Скорпион","group":"Десиканты","status":"Регистрация 2026","source":"Список препаратов 2026–2028","regs":[{"crop":"Пшеница яровая","dose":"1,5–2,0 л/га","target":"Десикация","cropTags":["Пшеница"],"objClass":"Десикация","objTags":["Десикация"],"technology":"Не применяется","method":"Опрыскивание в начале фазы восковой спелости зерна.","regYear":2026},{"crop":"Подсолнечник","dose":"2,0 л/га","target":"Десикация","cropTags":["Подсолнечник"],"objClass":"Десикация","objTags":["Десикация"],"technology":"Независимо от технологии","method":"Опрыскивание посевов в начале побурения корзинок. Расход рабочей жидкости — 200–300 л/га.","regYear":2026},{"crop":"Картофель (семенные участки)","dose":"2,0 л/га","target":"Десикация","cropTags":["Картофель"],"objClass":"Десикация","objTags":["Десикация"],"technology":"Не применяется","method":"Опрыскивание в период формирования клубней и огрубления кожуры. Расход рабочей жидкости — 200–300 л/га.","regYear":2026},{"crop":"Рапс","dose":"1,5–2,0 л/га","target":"Десикация","cropTags":["Рапс"],"objClass":"Десикация","objTags":["Десикация"],"technology":"Независимо от технологии","method":"Опрыскивание в период побурения 60% стручков в срединной части стебля. Расход рабочей жидкости — 100–300 л/га.","regYear":2026}],"active":"дикват дибромид, 150 г/л","catalogInfo":{"meta":{"purpose":"Высокоэффективный десикант","package":"Канистра 20 л","storage":"2 года","temperature":"от –15 до +35 °C"},"sections":{"Механизм действия":"Высушивание растений происходит в результате нарушения физиологических и биохимических процессов, что ведёт к ослаблению водоудерживающей способности тканей, гибели клеток и высыханию растений.","Скорость действия":"Эффект десикации проявляется через 5–7 дней, в зависимости от температуры воздуха и степени созревания растений.","Рекомендации по применению":"Обработка препаратом Скорпион позволяет эффективно регулировать сроки уборки урожая, повысить качество семян, уменьшить затраты на их подработку и сушку, снизить распространение и развитие болезней. При наземном опрыскивании используется норма расхода рабочей жидкости не менее 200 л/га. Не допускайте стекания рабочего раствора с обработанной поверхности! Для приготовления рабочего раствора используйте только чистую воду. Для загущенных и сильно облиственных посевов, а также при влажности воздуха менее 60%, при высокой температуре воздуха более 35 °C. В солнечную погоду скорость действия препарата увеличивается. Продукт отлично противостоит осадкам, через 15–30 минут после обработки уже не смывается с обработанных растений! В случае прогнозируемых затяжных осадков не рекомендуется применять десикант. Кроме того, необходимо придерживаться рекомендованных фаз развития культурного растения на момент десикации. При влажности воздуха менее 60%, при температуре воздуха более 35 ⁰С, а также при длительной засухе необходимо применять совместно с прилипателем!","Совместимость":"Совместим в баковых смесях с аммиачной селитрой."},"advantages":["Обеспечивает быстрое и равномерное подсушивание растений, что позволяет приступить к уборке уже через 5–7 дней после обработки","Снижает влажность семян, в результате уменьшаются затраты на сушку","Сокращает потери семян при уборке","Способствует повышению качества семян и сохранению масличности","Облегчает уборку: наряду с культурными высушивает и сорные растения","Способствует снижению затрат на уборку"]}},{"name":"Авилор АВИА","group":"ПАВы","status":"Каталог 2026","source":"Каталог 2026","active":"эмульгатор","regs":[{"crop":"Сельскохозяйственные и лесные культуры","dose":"90 мл/га или 30 мл/л рабочего раствора","target":"Эмульгатор для авиаопрыскивания","cropTags":["Сельскохозяйственные культуры","Лесные культуры"],"objClass":"ПАВ","objTags":["Эмульгатор"],"technology":"Не применяется","method":"Авиаопрыскивание с нормой расхода рабочей жидкости 3 л/га. Первым растворяют инсектицид, затем добавляют эмульгатор Авилор АВИА.","regYear":null}],"catalogInfo":{"meta":{"purpose":"Универсальный эмульгатор для приготовления рабочих растворов пестицидов для применения авиаметодом в сельском и лесном хозяйстве","package":"Канистра 5 л и 20 л","storage":"3 года","temperature":"от 0 до +25 °C"},"sections":{"Механизм действия":"Эмульгатор способствует стабильности водных эмульсий, снижает испаряемость при авиаобработках и обеспечивает равномерное распределение рабочего раствора пестицида на поверхности растений. Повышает эффективность действия инсектицидов. Испытания, проведенные в 2017 г. НПК «ПАНХ», показали высокую эффективность авиационного внесения сверхлегким самолетом типа Х-32 препарата Клонрин с добавлением эмульгатора Авилор Авиа при норме расхода рабочего раствора 3 л/га. Такой способ применения впервые зарегистрирован для использования в сельском и лесном хозяйстве РФ.","Рекомендации по применению":"Авилор Авиа рекомендуется к применению в норме расхода 90 мл/га или 30 мл/л рабочего раствора при авиаопрыскивании с нормой расхода рабочей жидкости 3 л/га. При подготовке баковой смеси первым растворяют инсектицид, затем добавляют эмульгатор Авилор Авиа."},"advantages":["Обеспечивает высокую и стабильную эффективность СЗР","Повышает эффективность препарата при опрыскивании растений, покрытых пылью, восковым налётом и сильно опушённых","Позволяет снизить норму расхода рабочей жидкости до 3 л/га","Позволяет увеличить скорость обработки","Повышает устойчивость к смыванию препарата осадками","Не фитотоксичен"]}},{"name":"Агент С","group":"ПАВы","status":"Каталог 2026","source":"Каталог 2026","active":"органосилико ель"],"technology":"Не применяется","regYear":2026},{"crop":"Внекорневые подкормки микроудобрениями","dose":"25–75 мл","target":"","method":"Объём воды: 50–150 л/га","cropTags":["Внекорневые подкормки"],"objClass":"ПАВ","objTags":["Суперсмачиватель"],"technology":"Не применяется","regYear":2026}],"catalogInfo":{"meta":{"purpose":"Универсальный органосиликоновый суперсмачиватель","package":"Канистра 5 л и 20 л","storage":"3 года","temperature":"от 0 до +35 °C"},"sections":{"Механизм действия":"Агент С применяется в качестве добавки к рабочему раствору пестицидов и агрохимикатов с целью повышения эффективности. Он способствует увеличению площади покрытия поверхности растений рабочим раствором и улучшению смачивания вследствие значительного снижения поверхностного натяжения раствора. Это особенно актуально при использовании низких норм расхода воды, при проведении опрыскивания в условиях засухи или при использовании «жесткой» воды. Используется в баковых смесях с гербицидами, фунгицидами, инсектицидами.","Особенности применения":"1. Агент С с фунгицидами. При попадании рабочего раствора системного фунгицида на верхнюю часть листа нижняя остаётся не защищённой. Агент С при использовании с системными и контактными фунгицидами обеспечивает наиболее полное покрытие и надёжную защиту всего растения.\n2. Агент С с инсектицидами. В баковой смеси с инсектицидами Агент С значительно усиливает контактную активность и проникновение в труднодоступные места. Это позволяет эффективно бороться со скрытноживущими вредителями, в частности с хлопковой совкой на кукурузе после её проникновения в початок.\n3. Агент С с гербицидами. Повышает эффективность гербицидов на сорняках, листья которых покрыты пылью, восковым налётом и сильно опушёны. Усиливает действие гербицидов по переросшим сорнякам.\n4. Агент С с почвенными гербицидами. Обеспечивает проникновение через мелкие капилляры сухой почвы к влажному слою; создаёт надёжный гербицидный экран, что позволяет достичь высокой эффективности даже в условиях недостаточной увлажненности.","Совместимость и ограничения":"ВНИМАНИЕ! Агент С не совместим с медьсодержащими пестицидами. Максимальные концентрации препарата могут применяться только с системными препаратами и гербицидами сплошного действия. Повышенные нормы Агента С или увеличение объёма воды не улучшают покрытия обрабатываемых растений, а наоборот, создают риск чрезмерного стекания рабочего раствора."},"advantages":["Увеличивает эффективность и стабильность рабочих растворов пестицидов","Усиливает проникновение рабочих растворов в растение","Повышает эффективность препаратов на растениях, покрытых пылью, восковым налётом и сильно опушённых","Повышает устойчивость препаратов к смыванию осадками","Не фитотоксичен"]}},{"name":"Альф","group":"ПАВы","status":"Каталог 2026","source":"Каталог 2026","active":"ПАВ на основе этоксилата, этандиола и других неионогенных ПАВ","regs":[{"crop":"Совместно с гербицидами","dose":"0,2–0,3 л/га или 0,1%","target":"Поверхностно-активное вещество","cropTags":["Совместно с гербицидами"],"objClass":"ПАВ","objTags":["Поверхностно-активное вещество"],"technology":"Не применяется","method":"В приготовленный рабочий раствор гербицида вливают заранее отмеренное количество ПАВ — Альф, Ж.","regYear":2026}],"catalogInfo":{"meta":{"purpose":"Поверхностно-активное вещество","package":"Канистра 5 л","storage":"2 года","temperature":"от -10 до +35 °C"},"sections":{"Механизм действия":"Альф, Ж проявляет поверхностно-активные свойства (является ПАВом). При применении его совместно с гербицидами он существенно ослабляет поверхностное натяжение рабочего раствора, в результате улучшается распределение капель по поверхности вегетативных органов растения; гербицид дольше сохраняется и быстрее преодолевает восковой налёт на покровных тканях. В результате эффективность препаратов увеличивается на 10–20%.","Рекомендации по применению":"Рабочий раствор готовится механизированным способом непосредственно перед опрыскиванием. Для приготовления рабочей жидкости заполнить 1/2 бака опрыскивателя чистой водой, добавить маточный раствор препарата и продолжать заполнение бака водой с одновременным перемешиванием. В приготовленный рабочий раствор гербицида вливают заранее отмеренное количество ПАВ — Альф, Ж (из расчета 0,2–0,3 л/га или 0,1% на одну заправку опрыскивателя).","Совместимость с другими препаратами":"Применяется совместно с гербицидами.","Фитотоксичность":"Отсутствует."},"advantages":["Увеличивает эффективность и стабильность рабочих растворов пестицидов","Усиливает проникновение рабочих растворов в растение","Повышает эффективность препаратов на растениях, покрытых пылью, восковым налётом и сильно опушённых","Повышает устойчивость препаратов к смыванию осадками","Не фитотоксичен"]}},{"name":"Кондиционер ФМР 20","group":"ПАВы","status":"Каталог 2026","source":"Каталог 2026","active":"кондиционер для улучшения качества воды","regs":[{"crop":"Рабочий раствор пестицидов","dose":"0,2 л/га","target":"Кондиционирование воды","cropTags":["Рабочий раствор пестицидов"],"objClass":"ПАВ","objTags":["Кондиционер воды"],"technology":"Не применяется","method":"Вносить первым в бак опрыскивателя при приготовлении рабочего раствора."}],"catalogInfo":{"meta":{"purpose":"Кондиционер для улучшения качества воды","package":"Канистра 20 л","storage":"3 года","temperature":"от +5 до +30 °C"},"sections":{"Механизм действия":"Жесткая вода может повлиять на эффективность пестицидов из-за образования нерастворимых комплексов. Входящие в состав воды ионы (Ca, Mg, Fe и др.) вступают в реакцию с действующим веществом пестицида и блокируют его проникновение. Кондиционер ФМР 20 нейтрализует входящие в состав воды ионы и нормализует уровень pH воды. ФМР 20 уменьшает скатывание капель рабочей жидкости с поверхности растений, увеличивает площадь покрытия капли и тем самым оптимизирует распределение препарата, способствуя быстрому проникновению действующих веществ в растение. Кондиционер ФМР 20 улучшает смачивающую способность рабочего раствора за счет снижения поверхностного натяжения, что позволяет сократить расход рабочего раствора на 1 га и повысить производительность.","Особенности применения":"ВНИМАНИЕ! В заполненный водой на 1/2 бак опрыскивателя сначала вносят Кондиционер ФМР 20, затем добавляют пестициды."},"advantages":["Смягчает жесткость воды","Нормализует уровень pH","Повышает стабильность рабочего раствора","Усиливает смачиваемость листовой поверхности","Улучшает прилипаемость и проницаемость пестицидов в растение","Повышает дождестойкость препаратов"]}},{"name":"Супертэн НЭО","group":"Гербициды","status":"Регистрация 2027","source":"Информация для каталогов.docx","regs":[{"crop":"Пшеница яровая","dose":"0,2–0,25 л/га","target":"Однолетние и многолетние двудольные сорные растения, включая виды осота, бодяка","cropTags":["Пшеница"],"objClass":"Сорняки","objTags":["Однолетние двудольные сорняки","Многолетние двудольные сорняки","Двудольные сорняки"],"technology":"Не применяется","method":"Опрыскивание посевов от фазы кущения культуры до фазы формирования второго междоузлия (включительно) и ранние фазы роста сорных растений. Расход рабочей жидкости – 200–300 л/га. Срок ожидания / кратность обработок: 47(1).","regYear":2027},{"crop":"Ячмень яровой","dose":"0,2–0,25 л/га","target":"Однолетние и многолетние двудольные сорные растения, включая виды осота, бодяка","cropTags":["Ячмень"],"objClass":"Сорняки","objTags":["Однолетние двудольные сорняки","Многолетние двудольные сорняки","Двудольные сорняки"],"technology":"Не применяется","method":"Опрыскивание посевов от фазы кущения культуры до фазы формирования второго междоузлия (включительно) и ранние фазы роста сорных растений. Расход рабочей жидкости – 200–300 л/га. Срок ожидания / кратность обработок: 47(1).","regYear":2027}],"active":"тифенсульфурон-метил, 110 г/л + флуметсулам, 32 г/л + флорасулам, 22 г/л","catalogInfo":{"meta":{"package":"Пластиковая канистра емкостью 5 л.","storage":"2 года","temperature":"от 0°C до +25 °C"},"sections":{"Механизм действия":"Системный трехкомпонентный гербицид против двудольных сорняков. Все три действующих вещества относятся к разным химическим классам (сульфонилмочевины, триазолопиримидины), но обладают синергетическим ALS-ингибирующим действием. Они блокируют фермент ацетолактатсинтазу, что полностью останавливает синтез незаменимых аминокислот. Препарат быстро поглощается листьями и частично корнями, перемещаясь по ксилеме и флоэме к точкам роста, где мгновенно прекращает деление клеток сорных растений.","Спектр действия":"Уничтожает широкий спектр однолетних и некоторых многолетних двудольных сорняков. Исключительно эффективен против подмаренника цепкого (на всех стадиях развития), видов ромашки, мари белой, щирицы, звездчатки средней, горцев, амброзии, сурепки, пастушьей сумки, а также обеспечивает надежный контроль падалицы подсолнечника (включая гибриды, устойчивые к имидазолинонам и сульфонилмочевинам) и падалицы рапса.","Скорость действия":"Видимые признаки повреждений (остановка роста, обесцвечивание жилок, хлороз верхушек, антоциановая окраска) проявляются уже через 4–7 дней после обработки. Полная гибель чувствительных сорняков наступает через 14–21 день в зависимости от фазы развития растений и климатических условий.","Период защитного действия":"За счет комбинации действующих веществ обеспечивает защиту посевов от момента обработки до конца вегетационного периода. Благодаря флуметсуламу обладает мягким почвенным действием, сдерживая появление новых всходов некоторых чувствительных двудольных сорняков.","Совместимость":"Хорошо совместим в баковых смесях с большинством граминицидов, инсектицидов, фунгицидов и регуляторов роста. За счет препаративной формы масляной дисперсии (МД) не требует добавления дополнительных поверхностно-активных веществ (ПАВ).","Возможность возникновения резистентности":"Риск возникновения резистентности сведен к минимуму благодаря тройному сочетанию действующих веществ из разных химических групп (хоть и с одинаковым механизмом действия). Для предотвращения устойчивости рекомендуется чередовать в севообороте с гербицидами, имеющими другой механизм действия (например, на основе синтетических ауксинов).","Рекомендации по применению":"Пшеница яровая и ячмень яровой - Опрыскивание посевов от фазы кущения культуры до фазы формирования второго междоузлия (включительно) и ранние фазы роста сорных растений.","Расход рабочей жидкости":"200–300 л/га."},"advantages":["Уникальный трехкомпонентный синергизм: Максимально эффективный контроль проблемных двудольных сорняков, включая устойчивые к 2,4-Д виды.","Эксперт по падалице: Безупречно уничтожает падалицу подсолнечника (включая Express/Clearfield технологии) и рапса в посевах.","Превосходная формуляция (МД): Масляная основа гарантирует максимальное удержание капель, растворение воскового налета сорняков и быстрое проникновение внутрь листа даже в условиях прохладной или сухой погоды.","Контроль подмаренника: Уничтожает подмаренник цепкий на более поздних стадиях его развития, обеспечивая чистоту уборки.","Отсутствие жестких ограничений в севообороте: Быстро деградирует в почве, позволяя высевать любые последующие культуры на следующий год."]}}];

function richText(s){
  const lines=String(s||'').split('\n');let out='',ul=false;
  for(const l of lines){
    const b=/^\s*[•\-–]\s*(.*)$/.exec(l);
    if(b){if(!ul){out+='<ul>';ul=true}out+=`<li>${esc(b[1])}</li>`}
    else{if(ul){out+='</ul>';ul=false}if(l.trim())out+=`<p>${esc(l)}</p>`}
  }
  return out+(ul?'</ul>':'');
}

function dupScan(){
  const norm=t=>String(t||'').toLowerCase().replace(/\s+/g,' ').trim();
  const isOld=x=>x.src==='sheet'&&x.note!=null&&x.plan==null&&x.status==null; // запись первой версии загрузки: план, итог и результат склеены в одно поле
  const weak=x=>[norm(x.manager),x.date,norm(x.client),norm(x.type)].join('|');
  const GL=/^([\s\S]*?) · (Выполнено|Не выполнено)(?: · [\s\S]*)?$/;
  const isGl=x=>x.src==='sheet'&&!x.status&&!x.result&&!!x.plan&&GL.test(x.plan);
  const blank=[],legacy=[],groups={},have=new Set(),glKeys=new Set();
  S.activities.forEach(x=>{if(!isOld(x))have.add(weak(x));if(!isGl(x)&&x.status&&x.plan)glKeys.add(weak(x)+'|'+norm(x.plan))});
  S.activities.forEach(x=>{
    const plan=x.plan||x.note||'';
    if(isGl(x)&&glKeys.has(weak(x)+'|'+norm(GL.exec(x.plan)[1]))){legacy.push(x);return}
    if(x.src==='sheet'&&!x.client&&!plan&&!x.contact&&!x.result){blank.push(x);return}
    if(isOld(x)&&have.has(weak(x))){legacy.push(x);return}
    const k=[norm(x.manager),x.date,norm(x.client),norm(x.type),norm(x.contact),norm(plan)].join('|');
    (groups[k]=groups[k]||[]).push(x);
  });
  const sc=x=>(x.src==='crm'?100:0)+(x.status?4:0)+(x.plan?2:0)+(x.result?2:0)+(x.pay?1:0);
  const dups=legacy.slice();
  Object.values(groups).forEach(g=>{if(g.length<2)return;g.sort((a,b)=>sc(b)-sc(a)||(b.createdAt||0)-(a.createdAt||0));dups.push(...g.slice(1))});
  return {blank,dups,legacy:legacy.length};
}

    try{p=await driveCreate(b.name,b.X.write(b.wb,{type:'base64',bookType:'xlsx'}),folder);files.push(b.name)}
    catch(e){
      if(!isBig(e))throw e;

        if(rows.length>cap&&rows.length>50){const h=Math.ceil(rows.length/2);await up(sh,rows.slice(0,h),(part?part+'.':'')+'1');await up(sh,rows.slice(h),(part?part+'.':'')+'2');return true}

/* ---------- импорт из Google Таблиц ---------- */
function ilog(line,p){
  if(line!=null){imp.log.push(line);if(imp.log.length>400)imp.log.splice(0,100)}
  if(p!=null)imp.pct=p;
  const el=$('#implog');if(el){el.textContent=imp.log.join('\n');el.scrollTop=el.scrollHeight}
  const b=$('#impbar i');if(b)b.style.width=imp.pct+'%';
}
function mcpMsg(e){
  const c=e&&e.code;
  if(c==='needs_reauth')return 'Подключение Google Sheets устарело. Переподключите его в Настройки → Коннекторы.';
  if(c==='server_not_connected'||c==='selection_required')return 'Google Sheets не подключён. Добавьте его в Настройки → Коннекторы.';
  if(c==='not_in_manifest'||c==='approval_required'||c==='consent_required')return 'Нужно разрешить странице доступ к Google Sheets. Повторите нажатие и подтвердите запрос.';
  if(c==='blocked_by_policy')return 'Доступ к Google Sheets закрыт политикой организации.';
  if(c==='tool_error')return 'Google Sheets вернул ошибку: '+String(e.message||'').slice(0,160)+' Проверьте, что у вашего аккаунта есть доступ к таблице.';
  return 'Не удалось связаться с Google Sheets ('+(c||'ошибка')+').';
}
function valuesOf(r){
  let p=r&&r.payload;
  if(typeof p==='string'){try{p=JSON.parse(p)}catch(e){p=null}}
  if(!p&&r&&r.content){const t=r.content.find(c=>c.type==='text');if(t){try{p=JSON.parse(t.text)}catch(e){}}}
  return (p&&(p.values||(p.valueRange&&p.valueRange.values)))||[];
}
async function sheetTitles(id){
  const r=await mcp.callTool('Google Sheets','get_spreadsheet',{spreadsheetId:id,fields:['sheets.properties.title']},{cache:false});
  let p=r&&r.payload;if(typeof p==='string'){try{p=JSON.parse(p)}catch(e){p=null}}
  return ((p&&p.sheets)||[]).map(s=>s.properties&&s.properties.title).filter(Boolean);
}
async function sheetValues(id,title,cols,rows){
  const range="'"+title.replace(/'/g,"''")+"'!A1:"+cols+rows;
  const r=await mcp.callTool('Google Sheets','get_values',{spreadsheetId:id,range},{cache:false});
  return valuesOf(r);
}
async function setRetry(col,id,data){
  for(let a=0;a<5;a++){
    try{await db.collection(col).doc(id).set(data);return true}
    catch(e){const c=e&&e.code;if(c==='resource_exhausted'||c==='unavailable'){await sleep(500*Math.pow(2,a)+Math.random()*300);continue}imp.errs++;if(c==='quota_exceeded')ilog('Достигнут предел базы: '+(e.message||''));return false}
  }
  imp.errs++;return false;
}
async function pool(items,worker,n,onTick){
  let i=0,done=0;
  const run=async()=>{while(i<items.length){const k=i++;await worker(items[k]);done++;if(onTick&&done%25===0)onTick(done)}};
  await Promise.all(Array.from({length:n},run));
  if(onTick)onTick(done);
}
const same=(a,b,keys)=>keys.every(k=>String(a[k]??'')===String(b[k]??''));
async function upsert(col,items,existing,keys,label,p0,p1,uidOf){
  const todo=[];let skipped=0,edited=0,unreg={};
  for(const it of items){
    let u=uidOf(it.rec);
    if(!u){const n=it.rec.manager||it.rec.requestedBy||'?';unreg[n]=(unreg[n]||0)+1;u=myUid}
    it.u=u;
    const ex=existing.get(it.id);
    if(ex&&ex._u===u){if(ex.src==='crm'){edited++;continue}if(same(ex,it.rec,keys)){skipped++;continue}}
    else if(ex&&ex.src==='crm'){edited++;continue}
    todo.push(it);
  }
  const un=Object.entries(unreg);
  ilog(label+': к записи '+todo.length+', без изменений '+skipped+(edited?', изменено в CRM '+edited:''));
  if(un.length)ilog('  Менеджер ещё не открыл страницу, записи пока в вашем кабинете: '+un.map(([n,c])=>n+' ('+c+')').join(', ')+'. Когда он войдёт и выберет имя, повторите загрузку: записи перейдут к нему.');
  if(imp.dry){const by={};todo.forEach(it=>{const n=it.rec.manager||it.rec.requestedBy||'?';by[n]=(by[n]||0)+1});Object.entries(by).forEach(([n,c])=>ilog('  не хватает в CRM: '+n+' — '+c));imp.missing=(imp.missing||0)+todo.length;return {ok:0,total:todo.length}}
  let ok=0;
  await pool(todo,async it=>{
    if(await setRetry(pathOf(col,it.u),it.id,{...it.rec,src:'sheet',createdAt:Date.now()})){
      ok++;const ex=existing.get(it.id);
      if(ex&&ex._u&&ex._u!==it.u){try{await db.collection(pathOf(col,ex._u)).doc(it.id).delete()}catch(e){}}
    }},5,d=>ilog(null,p0+(p1-p0)*d/Math.max(1,todo.length)));
  return {ok,total:todo.length};
}
async function importJournal(){
  ilog('Читаю список листов…',2);
  const titles=await sheetTitles(SHEET_JOURNAL);
  const mgrSheets=titles.filter(t=>!NON_JOURNAL.includes(t));
  const ex=new Map(S.activities.map(x=>[x.id,x]));
  const all=[];
  for(let i=0;i<mgrSheets.length;i++){
    const t=mgrSheets[i];
    const vals=await sheetValues(SHEET_JOURNAL,t,'H',1100);
    const j=parseJournal(vals);
    if(!j.manager){ilog('Лист «'+t+'»: не найдено имя менеджера в A1, пропущен');continue}
    ilog('Лист «'+t+'»: '+j.rows.length+' записей ('+j.manager+')',2+20*(i+1)/mgrSheets.length);
    all.push(...j.rows);
  }
  const r=await upsert('activities',all,ex,['date','manager','client','type','plan','contact','status','result','pay'],'Журнал',25,80,r=>uidOfMgr(r.manager));
  ilog('Журнал: записано '+r.ok+' из '+r.total,80);
  if(titles.includes('Агроном-консультант')){
    const vals=await sheetValues(SHEET_JOURNAL,'Агроном-консультант','I',600);
    const rows=parseAgro(vals);
    const exA=new Map(S.agro.map(x=>[x.id,x]));
    const ra=await upsert('agro',rows,exA,['date','requestedBy','client','place','goal','work','result','next','contact'],'Агроном',80,98,r=>{const n=parseManagers(r.requestedBy)[0];return n?uidOfMgr(n):myUid});
    ilog('Агроном: записано '+ra.ok+' из '+ra.total,98);
  }
}
async function importReach(){
  ilog('Читаю сводки по областям…',1);
  const titles=await sheetTitles(SHEET_REACH);
  const summ={};
  for(const reg of Object.keys(SUMMARY_SHEETS)){
    if(!titles.includes(reg)){ilog('Нет листа «'+reg+'»');continue}
    summ[reg]=parseSummary(await sheetValues(SHEET_REACH,reg,'H',200));
    ilog('Сводка «'+reg+'»: '+summ[reg].length+' строк');
  }
  const distSheets=titles.filter(t=>!SUMMARY_SHEETS[t]);
  const docs={}; // id -> district doc
  const usedRows=new Set();
  const mkId=(r,n)=>'d_'+hash(r+'|'+n);
  // районы из листов
  for(const t of distSheets){
    const region=regionOfSheet(t)||'Другое';
    const id=mkId(region,t);
    docs[id]={region,name:t,sheet:t,managerRaw:'',area:0,dist:'',contracts:0,sales:0,cover:0};
    const rows=summ[region]||[];
    const cand=rows.map(r=>r.district);
    const hit=matchDistrict(t,cand);
    if(hit){const row=rows.find(r=>r.district===hit);usedRows.add(region+'|'+hit);Object.assign(docs[id],{managerRaw:row.managerRaw,area:row.area,dist:row.dist,contracts:row.contracts,sales:row.sales,cover:row.cover})}
  }
  // строки сводки без листа
  for(const [region,rows] of Object.entries(summ)){
    for(const row of rows){
      if(usedRows.has(region+'|'+row.district))continue;
      let reg2=region,nm=row.district;
      if(/,\s*ско/i.test(nm)){reg2='СКО';nm=nm.replace(/,\s*ско/i,'').trim()}
      const sheetHit=distSheets.find(t=>regionOfSheet(t)===reg2&&matchDistrict(nm,[t]));
      if(sheetHit){const id=mkId(reg2,sheetHit);if(docs[id]&&!docs[id].contracts&&!docs[id].sales){Object.assign(docs[id],{managerRaw:row.managerRaw,area:row.area||docs[id].area,dist:row.dist||docs[id].dist,contracts:row.contracts,sales:row.sales,cover:row.cover});continue}}
      const id=mkId(reg2,'x:'+nm);
      docs[id]={region:reg2,name:nm,sheet:'',managerRaw:row.managerRaw,area:row.area,dist:row.dist,contracts:row.contracts,sales:row.sales,cover:row.cover,noSheet:true};
    }
  }
  {const skip=new Set((byId(S.settings,'skip')||{}).ids||[]);for(const k of Object.keys(docs))if(skip.has(k))delete docs[k]}
  const ids=Object.keys(docs);
  let farmsTotal=0,farmsOk=0;
  const unreg=new Set();
  const uidsOf=(raw,fallback)=>{
    const mg=parseManagers(raw);
    if(!mg.length)return fallback;
    const out=[];mg.forEach(n=>{const u=uidOfMgr(n);if(u)out.push(u);else unreg.add(n)});
    return out.length?out:fallback;
  };
  const dUmap={};
  const keys=['settlement','name','manager','dist','contacts','areaText','info','last','status','note','stage','area'];
  const dwrite=[]; // [uid,id,doc]
  for(let i=0;i<ids.length;i++){
    const id=ids[i],d=docs[id],p0=5+85*i/ids.length,p1=5+85*(i+1)/ids.length;
    const dU=uidsOf(d.managerRaw,[myUid]);
    dUmap[id]=dU;
    const slices={};dU.forEach(u=>slices[u]=[]);let allFarms=[];
    if(d.sheet){
      const vals=await sheetValues(SHEET_REACH,d.sheet,'K',1100);
      const farms=parseFarms(vals);
      farmsTotal+=farms.length;allFarms=farms;
      for(const f of farms)uidsOf(f.rec.manager,dU).forEach(u=>(slices[u]=slices[u]||[]).push(f));
    }
    let shown=0,wrote=0;
    for(const [u,farms] of Object.entries(slices)){
      const fpath='mgr/'+u+'/districts/'+id+'/farms';
      let ex=new Map();
      if(farms.length){try{const snap=await db.collection(fpath).get();ex=new Map(snap.docs.map(x=>[x.id,{id:x.id,...x.data()}]))}catch(e){}}
      const todo=[];let skipped=0,edited=0;
      for(const f of farms){const e=ex.get(f.id);if(e){if(e.src==='crm'){edited++;continue}if(same(e,f.rec,keys)){skipped++;continue}}todo.push(f)}
      let ok=0;imp.missing=(imp.missing||0)+(imp.dry?todo.length:0);
      if(!imp.dry)await pool(todo,async f=>{{const pe=ex.get(f.id);if(await setRetry(fpath,f.id,{...f.rec,src:'sheet',...(pe&&pe.risk?{risk:pe.risk}:{})}))ok++}},5,n=>ilog(null,p0+(p1-p0)*n/Math.max(1,todo.length)));
      farmsOk+=ok+skipped+edited;wrote+=todo.length;shown+=farms.length;
      dwrite.push([u,id,{...d,farmCount:farms.length,contacted:farms.filter(f=>f.rec.stage!=='none').length,clients:farms.filter(f=>f.rec.stage==='client').length}]);
    }
    // зеркало для менеджеров с расширенным доступом к области (только просмотр)
    if(d.sheet&&allFarms.length)for(const [mn,regsX] of Object.entries(EXTRA_ACCESS)){
      const mu=uidOfMgr(mn);if(!mu||!regsX.includes(d.region)||dU.includes(mu))continue;
      const mpath='mgr/'+mu+'/districts/'+id+'/farms';
      let ex=new Map();try{const snap=await db.collection(mpath).get();ex=new Map(snap.docs.map(x=>[x.id,{id:x.id,...x.data()}]))}catch(e){}
      const todo=allFarms.filter(f=>{const e=ex.get(f.id);return !(e&&same(e,f.rec,keys))});
      imp.missing=(imp.missing||0)+(imp.dry?todo.length:0);
      if(!imp.dry){await pool(todo,async f=>{await setRetry(mpath,f.id,{...f.rec,src:'sheet',mirror:true})},5);
        dwrite.push([mu,id,{...d,mirror:true,farmCount:allFarms.length,contacted:allFarms.filter(f=>f.rec.stage!=='none').length,clients:allFarms.filter(f=>f.rec.stage==='client').length}])}
      ilog('  доступ '+mn+': '+allFarms.length+' хозяйств, к записи '+todo.length);

  ilog('Записываю районы…',92);
  let dok=0;
  await pool(dwrite,async([u,id,doc])=>{const prev=(dSl[id]&&dSl[id][u])||{};if(await setRetry('mgr/'+u+'/districts',id,{...prev,...doc,createdAt:prev.createdAt||Date.now()}))dok++},5);

      const dr=db.collection('mgr/'+myUid+'/districts').doc(id);
      const ex=await dr.get();if(ex.exists){await dr.delete();moved++}
    }catch(e){}
  }
  if(moved)ilog('Перенесено из кабинета руководителя в кабинеты менеджеров: '+moved);
  if(unreg.size)ilog('Эти менеджеры ещё не открыли страницу: '+[...unreg].join(', ')+'. Их районы пока лежат в вашем кабинете. Когда менеджер войдёт и выберет имя, повторите загрузку: районы перейдут к нему.');
  idxFull=true;reloadIdx(3000);
  ilog('Записей районов: '+dok+', хозяйств в таблице: '+farmsTotal,100);
}
async function runMigrate(removeOld){
  if(imp.busy||!db||!isOwner)return;
  imp={busy:true,log:[],pct:0,errs:0};render();
  const unreg=new Set();
  const uidsOf=(raw,fallback)=>{const mg=parseManagers(raw);if(!mg.length)return fallback;const out=[];mg.forEach(n=>{const u=uidOfMgr(n);if(u)out.push(u);else unreg.add(n)});return out.length?out:[myUid]};
  try{
    for(const c of ['activities','agro','deals','tasks','plans']){
      let snap;try{snap=await db.collection(c).get()}catch(e){ilog(c+': не удалось прочитать старые данные');continue}
      const items=snap.docs.map(d=>({id:d.id,data:d.data()}));
      ilog(c+': '+items.length+' записей');let ok=0;
      await pool(items,async it=>{
        const n=c==='agro'?parseManagers(it.data.requestedBy||'')[0]:(it.data.manager||'');
        if(n&&!uidOfMgr(n))unreg.add(n);
        const u=(n&&uidOfMgr(n))||myUid;
        let dd=it.data; if(c==='activities'){dd={...dd};if(!dd.plan&&dd.note)dd.plan=dd.note;delete dd.note;if(dd.src==='sheet'&&!dd.client&&!dd.plan&&!dd.contact&&!dd.result)return}
        if(await setRetry(pathOf(c,u),it.id,dd)){ok++;if(removeOld){try{await db.collection(c).doc(it.id).delete()}catch(e){}}}
      },5);
      ilog('  перенесено '+ok);
    }
    let snap;try{snap=await db.collection('districts').get()}catch(e){snap={docs:[]}}
    ilog('districts: '+snap.docs.length+' районов');
    let fcount=0;
    for(const dd of snap.docs){
      const id=dd.id,d=dd.data();
      const dU=uidsOf(d.managerRaw,[myUid]);
    dUmap[id]=dU;
      let farms=[];try{const fs=await db.collection('districts/'+id+'/farms').get();farms=fs.docs.map(x=>({id:x.id,data:x.data()}))}catch(e){}
      const slices={};dU.forEach(u=>slices[u]=[]);
      for(const f of farms)uidsOf(f.data.manager,dU).forEach(u=>(slices[u]=slices[u]||[]).push(f));
      for(const [u,fl] of Object.entries(slices)){
        await pool(fl,async f=>{if(await setRetry('mgr/'+u+'/districts/'+id+'/farms',f.id,f.data))fcount++},5);
        await setRetry('mgr/'+u+'/districts',id,{...d,farmCount:fl.length,contacted:fl.filter(f=>f.data.stage&&f.data.stage!=='none').length,clients:fl.filter(f=>f.data.stage==='client').length});
      }
      if(removeOld){for(const f of farms){try{await db.collection('districts/'+id+'/farms').doc(f.id).delete()}catch(e){}}try{await db.collection('districts').doc(id).delete()}catch(e){}}
    }
    ilog('Хозяйств перенесено: '+fcount);
    if(unreg.size)ilog('Менеджеры без входа (данные оставлены у вас): '+[...unreg].join(', '));
    ilog('Готово.',100);
  }catch(e){ilog('Ошибка: '+((e&&(e.code||e.message))||e))}
  imp.busy=false;render();
}
async function runImport(kind){
  if(imp.busy||!db||!mcp)return;
  const chk=kind==='check';
  if(!chk&&frozen()){toast('Импорт из таблиц закрыт');return}
  imp={busy:true,log:[],pct:0,errs:0,dry:chk,missing:0};render();
  const t0=Date.now();
  try{
    if(chk){ilog('СВЕРКА (ничего не записывается)');await importJournal();await importReach();ilog('ИТОГО не хватает записей: '+imp.missing+(imp.missing?'. Нажмите «Журнал менеджеров и агроном» и «Охват по районам», затем повторите сверку.':'. Всё перенесено, можно закрывать импорт.'),100);
      try{await put('settings','check',{at:Date.now(),missing:imp.missing})}catch(e){}}
    else await (kind==='journal'?importJournal():importReach());
    if(!chk)ilog('Готово за '+Math.round((Date.now()-t0)/1000)+' с'+(imp.errs?'. Ошибок записи: '+imp.errs+', повторите загрузку.':'.'),100);
    toast(chk?'Сверка завершена':imp.errs?'Загрузка завершена с ошибками':'Загрузка завершена');
  }catch(e){
    ilog('Остановлено: '+mcpMsg(e));
    toast('Загрузка остановлена');
  }finally{imp.busy=false;const b=$('#view');if(tab==='data')render()}
}
