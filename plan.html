<!DOCTYPE html>
<html lang="ru"><head>
<script>/* Слой данных: Supabase вместо базы Claude. Тот же интерфейс window.claude.use('db'|'user'|'downloads'|'mcp'). */
(()=>{
const URL_='https://teysgklvfzzfdozdtqkd.supabase.co',PUB='sb_publishable_Urb9ajGZ_a-G-uCnXAPLqw_6xNe6_jC';
const SK='crm_sb_session';let sess=null,prof=null,loginP=null,refP=null;
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
async function auth(grant,body){
  const r=await fetch(URL_+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:PUB,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||j.error||'Ошибка входа');
  sess={at:j.access_token,rt:j.refresh_token,exp:Date.now()+(j.expires_in-60)*1000,uid:j.user.id};lsSet(SK,JSON.stringify(sess));return sess;
}
async function token(){
  if(!sess)throw {code:'unauthenticated'};
  if(Date.now()>sess.exp){if(!refP)refP=auth('refresh_token',{refresh_token:sess.rt}).finally(()=>{refP=null});try{await refP}catch(e){if(sess&&Date.now()<=sess.exp)return sess.at;if(e instanceof TypeError)throw {code:'unavailable',message:'нет связи'};sess=null;lsSet(SK,null);location.reload();throw {code:'unauthenticated'}}}
  return sess.at;
}
async function rest(path,opt={}){
  const t=await token();
  const r=await fetch(URL_+'/rest/v1/'+path,{method:opt.method||'GET',headers:{apikey:PUB,Authorization:'Bearer '+t,'Content-Type':'application/json',...(opt.headers||{})},body:opt.body?JSON.stringify(opt.body):undefined});
  if(!r.ok){const tx=await r.text();throw {code:r.status===401||r.status===403?'permission_denied':'bad_request',message:tx.slice(0,200)}}
  return r;
}
function loginUI(){
  return new Promise(res=>{
    const d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:#f4f6f4;display:flex;align-items:center;justify-content:center;font:15px -apple-system,BlinkMacSystemFont,sans-serif';
    d.innerHTML='<form style="background:#fff;padding:28px;border-radius:14px;box-shadow:0 4px 24px #0002;width:300px;display:grid;gap:12px"><b style="font-size:20px">CRM ФМРус</b><input id="lg_e" placeholder="Логин" autocomplete="username" style="padding:11px;font-size:16px;border:1px solid #bbb;border-radius:8px"><input id="lg_p" type="password" placeholder="Пароль" autocomplete="current-password" style="padding:11px;font-size:16px;border:1px solid #bbb;border-radius:8px"><button style="padding:12px;font-size:16px;border:0;border-radius:8px;background:#2f7d3b;color:#fff">Войти</button><div id="lg_m" style="color:#b00;min-height:18px"></div></form>';
    document.body.appendChild(d);
    d.querySelector('form').onsubmit=async ev=>{ev.preventDefault();const m=d.querySelector('#lg_m');m.textContent='';
      let e=d.querySelector('#lg_e').value.trim().toLowerCase();if(e&&!e.includes('@'))e+='@crm.fmrus.kz';
      try{await auth('password',{email:e,password:d.querySelector('#lg_p').value});d.remove();res()}catch(x){m.textContent=/invalid/i.test(x.message)?'Неверный логин или пароль':x.message}};
  });
}
async function ensureLogin(){
  if(loginP)return loginP;
  loginP=(async()=>{
    try{const s=JSON.parse(lsGet(SK)||'null');if(s){sess=s;await token()}}catch(e){sess=null}
    if(!sess){if(document.body)await loginUI();else await new Promise(r=>addEventListener('DOMContentLoaded',r)).then(loginUI)}
    const r=await rest('profiles?user_id=eq.'+sess.uid+'&select=old_uid,name,is_admin');const a=await r.json();
    if(!a.length)throw new Error('Нет профиля');prof=a[0];
    if(!prof.is_admin){document.body.innerHTML='<div style="max-width:420px;margin:80px auto;font:16px -apple-system,sans-serif;text-align:center"><b>Нет доступа</b><p>Планирование продаж доступно только руководству.</p><p><a href="./">Вернуться в CRM</a></p></div>';throw new Error('no access')}
  })();
  return loginP;
}
const rnd=()=>'n'+Math.random().toString(36).slice(2,10);
const enc=encodeURIComponent;
async function fetchColl(path,flt){
  const out=[];let from=0;
  for(;;){
    const r=await rest('docs?coll=eq.'+enc(path)+(flt||'')+'&select=id,data&order=id',{headers:{Range:from+'-'+(from+999)}});
    const a=await r.json();out.push(...a);if(a.length<1000)break;from+=1000;
  }
  return out;
}
const listeners=[];
function mkSnap(path,rows){
  const docs=rows.map(x=>({id:x.id,exists:true,data:()=>x.data,ref:docRef(path,x.id)}));
  return {docs,size:docs.length,empty:!docs.length,forEach:f=>docs.forEach(f)};
}
function docRef(path,id){
  id=id||rnd();
  return {id,path:path+'/'+id,
    async set(d){await ensureLogin();await rest('docs?on_conflict=coll,id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:{coll:path,id,data:JSON.parse(JSON.stringify(d)),updated_at:new Date().toISOString()}});bump(path)},
    async delete(){await ensureLogin();await rest('docs?coll=eq.'+enc(path)+'&id=eq.'+enc(id),{method:'DELETE',headers:{Prefer:'return=minimal'}});bump(path)},
    async get(){await ensureLogin();const r=await rest('docs?coll=eq.'+enc(path)+'&id=eq.'+enc(id)+'&select=data');const a=await r.json();return {id,exists:!!a.length,data:()=>a.length?a[0].data:undefined}},
    onSnapshot(cb,eb){
      let stop=false,last='';
      const run=async()=>{try{const r=await this.get();const s=JSON.stringify(r.data());if(s!==last){last=s;if(!stop)cb(r)}}catch(e){if(eb&&!stop)eb(e)}};
      const l={path,id,run};listeners.push(l);ensureLogin().then(run);return ()=>{stop=true;const i=listeners.indexOf(l);if(i>=0)listeners.splice(i,1)};
    }};
}
function collRef(path){return {
  doc:id=>docRef(path,id),
  async get(){await ensureLogin();return mkSnap(path,await fetchColl(path))},
  where(f,op,v){const o={'>=':'gte','==':'eq','>':'gt','<':'lt','<=':'lte'}[op]||'eq';
    return {async get(){await ensureLogin();return mkSnap(path,await fetchColl(path,'&data->>'+f+'='+o+'.'+enc(v)))}}},
  onSnapshot(cb,eb){
    let stop=false,sig=null;
    const run=async(force)=>{
      try{
        const r=await rest('docs?coll=eq.'+enc(path)+'&select=updated_at&order=updated_at.desc&limit=1',{headers:{Prefer:'count=exact'}});
        const a=await r.json();const s=(r.headers.get('content-range')||'')+'|'+(a[0]?a[0].updated_at:'');
        if(!force&&s===sig)return;sig=s;
        const rows=await fetchColl(path);if(!stop)cb(mkSnap(path,rows));
      }catch(e){if(eb&&!stop)eb(e)}
    };
    const l={path,run:()=>run(false),force:()=>run(true)};listeners.push(l);ensureLogin().then(()=>run(true));
    return ()=>{stop=true;const i=listeners.indexOf(l);if(i>=0)listeners.splice(i,1)};
  }
}}
function bump(path){setTimeout(()=>listeners.filter(l=>l.path===path).forEach(l=>(l.force||l.run)()),50)}
setInterval(()=>{if(document.hidden||!sess)return;listeners.forEach(l=>l.run())},20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&sess)listeners.forEach(l=>l.run())});
const db={collection:p=>collRef('plan/'+p),doc:p=>{const i=p.lastIndexOf('/');return docRef('plan/'+p.slice(0,i),p.slice(i+1))}};
const user={async id(){await ensureLogin();return prof.old_uid},async isOwner(){await ensureLogin();return !!prof.is_admin},
  async profiles(ids){await ensureLogin();const r=await rest('profiles?select=old_uid,name');const a=await r.json();const m={};a.forEach(x=>m[x.old_uid]=x.name);return Object.fromEntries(ids.map(i=>[i,{id:i,name:m[i]||''}]))}};
const downloads={async save({filename,data}){if(!(data instanceof Blob)){const x=(filename.split('.').pop()||'').toLowerCase();data=new Blob([data],{type:x==='html'?'text/html;charset=utf-8':x==='xlsx'?'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':x==='pdf'?'application/pdf':x==='csv'?'text/csv;charset=utf-8':'application/octet-stream'})}const a=document.createElement('a');a.href=URL.createObjectURL(data);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}};
window.claude={use:async n=>{if(n==='db'){await ensureLogin();return db}if(n==='user'){await ensureLogin();return user}if(n==='downloads')return downloads;return null}};
window.__sbLogout=()=>{lsSet(SK,null);location.reload()};
})();
</script>

function buildCat(){CAT=CATALOG_SRC.map(c=>({id:c.k,name:c.name,group:c.group,ai:c.ai,unit:c.unit,origin:c.origin,isNew:c.new,price:(EXT.prices||{})[c.k]||null})).concat((EXT.extra||[]).map(x=>({...x,extra:true,price:(EXT.prices||{})[x.id]||null})))}
buildCat();

const regOf=id=>REGIONS.find(r=>r.id===id);
const curRegs=()=>region==='all'?REGIONS:[regOf(region)];
const curMgrs=()=>curRegs().flatMap(r=>r.mgrs.map(m=>({m,r:r.id})));
const season4=g=>(SET.season&&SET.season[g])||SEASON_DEF[g]||[25,25,25,25];
const price=p=>+p.price||0;
const lit=(r,pid,m)=>+((planOf(r).qty[pid]||{})[m])||0;
const locked=r=>planOf(r).status==='approved';
function mgrTot(r,m){let s=0,l=0;for(const p of CAT){const q=lit(r,p.id,m);l+=q;s+=q*price(p)}return{s,l}}
function mgrQ(r,m){const q=[0,0,0,0];for(const p of CAT){const v=lit(r,p.id,m)*price(p);if(v)season4(p.group).forEach((w,k)=>q[k]+=v*w/100)}return q}
function prodTot(pid){let l=0;for(const {m,r} of curMgrs())l+=lit(r,pid,m);return l}
function totals(){let s=0,l=0,g=0,sg=0;const used=new Set();for(const {m,r} of curMgrs()){const t=mgrTot(r,m),gm=+(planOf(r).goals[m])||0;s+=t.s;l+=t.l;g+=gm;if(gm)sg+=t.s}
 for(const p of CAT)if(prodTot(p.id))used.add(p.id);return{s,l,g,sg,n:used.size}}

/* ---------- запись в базу: одна запись на документ за раз ---------- */
const pend={},busy={};
function save(path,data){pend[path]=data;clearTimeout(save['t'+path]);save['t'+path]=setTimeout(()=>flush(path),700);mark('Сохраняю…')}
async function flush(path){
 if(!db){mark('Нет связи с базой: изменения не сохранятся');return}
 if(busy[path]){setTimeout(()=>flush(path),300);return}
 const data=pend[path];if(!data)return;delete pend[path];busy[path]=true;
 try{await db.doc(path).set(JSON.parse(JSON.stringify(data)));mark('Сохранено')}
 catch(e){mark('Не сохранилось');toast('Не удалось сохранить: '+((e&&e.code)||'ошибка'))}
 busy[path]=false;
}
const planPath=r=>'plans/'+season+'-'+r;
function savePlan(r){save(planPath(r),planOf(r))}

function renderHeader(){

 const h=REGIONS.map(r=>`<option value="${r.id}"${r.id===region?' selected':''}>${r.name} (${r.city})</option>`).join('')+`<option value="all"${region==='all'?' selected':''}>Вся компания</option>`;
 if(rs.dataset.h!==h){rs.dataset.h=h;rs.innerHTML=h}
 if(region==='all'){
  $('#status').innerHTML=REGIONS.map(r=>{const[s,c]=STATUS[planOf(r.id).status];return `<span class="chip ${c}" title="${s}">${r.name}: ${s.toLowerCase()}</span>`}).join(' ');
  $('#flow').innerHTML='';
 }else{
  const p=planOf(region),[s,c]=STATUS[p.status];const last=(p.log||[]).filter(x=>x.act==='approved').slice(-1)[0];
  $('#status').innerHTML=`<span class="chip ${c}">${s}${p.status==='approved'&&last?' '+new Date(last.at).toLocaleDateString('ru-RU'):''}</span>`;
  let b='';
  if(p.status==='draft')b=`<button class="btn pri" data-flow="review">На согласование</button>`;
  else if(p.status==='review')b=isOwner?`<button class="btn" data-flow="draft">Вернуть на доработку</button><button class="btn pri" data-flow="approved">Утвердить</button>`:`<span class="save">Ждёт утверждения</span>`;
  else if(isOwner)b=`<button class="btn" data-flow="draft">Снять утверждение</button>`;
  $('#flow').innerHTML=b;
 }
 const miss=CAT.filter(p=>!price(p)&&prodTot(p.id)).length;
 let ban='';
 if(ready&&!db)ban='Откройте страницу по ссылке из своего аккаунта Claude: иначе изменения не сохранятся.';
 else if(ready&&miss)ban=`Цены 2027 ещё не внесены у ${miss} препаратов из плана: суммы по ним пока нулевые. Цены вносятся на вкладке «Препараты и цены».`;
 $('#banner').innerHTML=ban?`<div class="banner">${ban}</div>`:'';
}

function vMatrix(){

  <select id="fg"><option value="">Все группы</option>${GROUPS.map(g=>`<option${g===filt.g?' selected':''}>${g}</option>`).join('')}</select>
  <label class="row muted" style="gap:5px"><input type="checkbox" id="fo"${filt.only?' checked':''}> только с планом</label></div>
  <span class="save" id="svst">${all?'Вся компания: только просмотр, правки в своей области':locked(region)?'План утверждён: правки закрыты':'Литры сохраняются сами'}</span></div>`;

  rows+=`<tr><td class="l" style="min-width:210px"><div class="pn">${esc(p.name)}${tags(p)}</div><div class="sub">${esc(p.ai)}</div></td>

  M.map(({m,r})=>{const v=lit(r,p.id,m);const dis=all||locked(r)||!db;return `<td><input class="q${v?'':' z'}" inputmode="numeric" data-p="${p.id}" data-m="${esc(m)}" data-r="${r}" value="${v||''}" placeholder=""${dis?' disabled':''}><div class="sub" data-c="${p.id}|${esc(m)}">${v&&price(p)?mln(v*price(p)):''}</div></td>`}).join('')+
  `<td data-t="${p.id}"><b>${tl?fmt(tl):''}</b><div class="sub">${tl&&price(p)?mln(tl*price(p)):''}</div></td></tr>`;
 }
 const head=`<tr><th class="l">Препарат</th><th>Цена</th>${M.map(({m,r})=>`<th title="${esc(m)}">${esc(short(m))}${all?`<div class="sub" style="text-transform:none">${regOf(r).name}</div>`:''}</th>`).join('')}<th>Итого</th></tr>`;
 const foot=`<tr class="tot"><td class="l">Итого менеджер<div class="sub">цель и выполнение</div></td><td></td>${M.map(({m,r})=>`<td data-f="${esc(m)}">${footCell(r,m)}</td>`).join('')}<td data-f="__all">${footAll()}</td></tr>`;
 return tools+`<div class="tbl"><table><thead>${head}</thead><tbody>${rows||`<tr><td colspan="${M.length+3}" class="l muted">Ничего не найдено</td></tr>`}</tbody><tfoot>${foot}</tfoot></table></div>`;
}
function footCell(r,m){const t=mgrTot(r,m),g=+(planOf(r).goals[m])||0,pc=g?Math.round(t.s/g*100):null;
 return `${mln(t.s)}<div class="sub">${fmt(t.l)} л/кг</div><div class="sub ${pc==null?'':pc>=100?'ok':'lo'}">${pc==null?'цель не задана':pc+'% от '+mln(g)}</div>`}
function footAll(){const t=totals();return `${mln(t.s)}<div class="sub">${fmt(t.l)} л/кг</div>`}
function refreshNums(pid,m,r){
 const p=CAT.find(x=>x.id===pid);const v=lit(r,pid,m);
 const c=document.querySelector(`[data-c="${CSS.escape(pid+'|'+m)}"]`);if(c)c.textContent=v&&price(p)?mln(v*price(p)):'';
 const tl=prodTot(pid),tc=document.querySelector(`[data-t="${CSS.escape(pid)}"]`);if(tc)tc.innerHTML=`<b>${tl?fmt(tl):''}</b><div class="sub">${tl&&price(p)?mln(tl*price(p)):''}</div>`;
 const f=document.querySelector(`[data-f="${CSS.escape(m)}"]`);if(f)f.innerHTML=footCell(r,m);

 renderKpis();
}

function mgrQL(r,m){const q=[0,0,0,0];for(const p of CAT){const v=lit(r,p.id,m);if(v)season4(p.group).forEach((w,k)=>q[k]+=v*w/100)}return q}
function vQuarters(){
 const all=region==='all';const add=(a,b)=>a.map((x,i)=>x+b[i]);
 const units=all?REGIONS.map(r=>({lab:r.name+' ('+r.city+')',ql:r.mgrs.map(m=>mgrQL(r.id,m)).reduce(add,[0,0,0,0]),qs:r.mgrs.map(m=>mgrQ(r.id,m)).reduce(add,[0,0,0,0])})):regOf(region).mgrs.map(m=>({lab:m,ql:mgrQL(region,m),qs:mgrQ(region,m)}));
 const totL=units.map(u=>u.ql).reduce(add,[0,0,0,0]),totS=units.map(u=>u.qs).reduce(add,[0,0,0,0]);
 const TL=totL.reduce((a,b)=>a+b,0),TS=totS.reduce((a,b)=>a+b,0),hasS=TS>0;
 const cell=(l,sv)=>l?`${fmt(l)}${hasS?`<div class="sub">${sv?mln(sv):'—'}</div>`:''}`:'<span class="muted">—</span>';
 const row=(lab,ql,qs,b)=>`<tr${b?' class="tot"':''}><td class="l">${esc(lab)}</td>${ql.map((x,k)=>`<td>${cell(x,qs[k])}</td>`).join('')}<td><b>${cell(ql.reduce((a,c)=>a+c,0),qs.reduce((a,c)=>a+c,0))}</b></td></tr>`;
 const base=hasS?totS:totL,BT=hasS?TS:TL;
 const bar=BT?`<div class="qbar">${base.map((x,k)=>x?`<div style="width:${x/BT*100}%;background:${QCOL[k]};color:${k?'#fff':'#4a1518'}">${k+1} кв · ${Math.round(x/BT*100)}%</div>`:'').join('')}</div>`:'';
 const head=f=>`<thead><tr><th class="l">${f}</th><th>1 квартал</th><th>2 квартал</th><th>3 квартал</th><th>4 квартал</th><th>Год</th></tr></thead>`;
 const t1=`<div class="tbl" style="max-height:none"><table>${head(all?'Область':'Менеджер')}<tbody>${units.map(u=>row(u.lab,u.ql,u.qs)).join('')}</tbody><tfoot>${row(all?'Компания':'Область',totL,totS,true)}</tfoot></table></div>`;
 let prows='';
 for(const g of GROUPS){const ps=CAT.filter(p=>p.group===g&&prodTot(p.id));if(!ps.length)continue;const w=season4(g);
  const gl=[0,0,0,0],gs=[0,0,0,0];
  const rr=ps.map(p=>{const L=prodTot(p.id),ql=w.map(x=>L*x/100),qs=ql.map(x=>x*price(p));ql.forEach((x,k)=>{gl[k]+=x;gs[k]+=qs[k]});return row(p.name+(p.unit?', '+p.unit:''),ql,qs)}).join('');
  prows+=`<tr class="grp"><td class="l" colspan="6">${gIco(g)} <b>${esc(g)}</b> <span class="muted">· ${w.join(' / ')} %</span></td></tr>`+rr+row('Итого '+g.toLowerCase(),gl,gs,true);}
 const t2=prows?`<h3 style="margin-top:22px">По препаратам, л/кг${hasS?' и ₸':''}</h3><div class="tbl" style="max-height:none"><table>${head('Препарат')}<tbody>${prows}</tbody></table></div>`:'';
 return `<h3>По ${all?'областям':'менеджерам'}, л/кг${hasS?' и ₸':''}</h3>${t1}${bar}${t2}
 <p class="muted" style="font-size:13px;margin-top:12px">Литры раскладываются по кварталам по сезонности группы препарата (вкладка «Цели и сезонность»).${hasS?'':' Суммы в тенге появятся, когда в справочник будут внесены цены.'} Факт и перенос недобора на следующий квартал подключатся из сделок.</p>`;
}

 let log='';

/* ---------- события ---------- */
const num=s=>{const n=parseFloat(String(s).replace(/\s/g,'').replace(',','.'));return isNaN(n)||n<0?0:n};
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;ls('pp_tab',tab);render();return}
 const f=e.target.closest('[data-flow]');if(f){flow(f.dataset.flow);return}
 if(e.target.closest('#xls')){exportXlsx();return}
 const dx=e.target.closest('[data-delx]');if(dx){EXT.extra=(EXT.extra||[]).filter(x=>x.id!==dx.dataset.delx);if(EXT.prices)delete EXT.prices[dx.dataset.delx];buildCat();saveCat();render();return}
 if(e.target.closest('#pdf')){exportPdf();return}
});
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.matches('input.q')){const{p,m,r}=el.dataset;const pl=planOf(r);const v=num(el.value);pl.qty[p]=pl.qty[p]||{};if(v)pl.qty[p][m]=v;else delete pl.qty[p][m];if(!Object.keys(pl.qty[p]).length)delete pl.qty[p];el.classList.toggle('z',!v);refreshNums(p,m,r);savePlan(r);return}
 if(el.id==='fq'){filt.q=el.value;const pos=el.selectionStart;render();const n=$('#fq');n.focus();n.setSelectionRange(pos,pos);return}
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.id==='region'){region=el.value;ls('pp_region',region);render();return}
 if(el.id==='fg'){filt.g=el.value;render();return}
 if(el.id==='fo'){filt.only=el.checked;ls('pp_only',filt.only?'1':'0');render();return}
 if(el.dataset.goal){const pl=planOf(region);const v=num(el.value);if(v)pl.goals[el.dataset.goal]=v;else delete pl.goals[el.dataset.goal];savePlan(region);render();return}
 if(el.dataset.sg){const g=el.dataset.sg,k=+el.dataset.sk;SET.season=SET.season||{};const s=[...season4(g)];s[k]=Math.min(100,Math.round(num(el.value)));SET.season[g]=s;save('settings/main',SET);render();return}
 if(el.dataset.price){const id=el.dataset.price,v=num(el.value);EXT.prices=EXT.prices||{};if(v)EXT.prices[id]=v;else delete EXT.prices[id];buildCat();saveCat();render();return}
});
document.addEventListener('submit',e=>{
 if(e.target.id!=='addp')return;e.preventDefault();
 const fd=new FormData(e.target),name=String(fd.get('name')).trim();if(!name)return;
 const origin=fd.get('origin')||'';let id='x-'+(name+(origin?'-'+origin:'')).toLowerCase().replace(/[^a-zа-яё0-9]+/gi,'-');
 if(CAT.some(p=>p.id===id)){toast('Такая позиция уже есть');return}
 EXT.extra=(EXT.extra||[]).concat({id,name:name+(origin?' ('+origin+')':''),group:fd.get('group'),unit:fd.get('unit'),origin,ai:String(fd.get('ai')||'')});buildCat();saveCat();toast('Позиция добавлена');render();
});

async function flow(to){
 const pl=planOf(region);
 if(to==='approved'&&!isOwner)return;
 if(to==='review'){const miss=CAT.filter(p=>!price(p)&&prodTot(p.id)).length;if(miss&&!flow.warned){flow.warned=true;toast(`У ${miss} препаратов нет цены. Нажмите ещё раз, чтобы всё равно отправить.`);return}}
 flow.warned=false;
 pl.status=to;pl.log=(pl.log||[]).concat({at:Date.now(),by:myId,act:to});
 savePlan(region);render();
 toast(to==='review'?'План отправлен на согласование':to==='approved'?'План утверждён':'План возвращён в черновик');
}

async function loadNames(){if(!user)return;try{const ids=[...new Set(Object.values(PLANS).flatMap(p=>(p.log||[]).map(x=>x.by)).filter(Boolean))];if(!ids.length)return;const ps=await user.profiles(ids);ids.forEach(i=>names[i]=(ps[i]&&ps[i].name)||'');}catch(e){}}
function busyInput(){const a=document.activeElement;return a&&a.closest&&a.closest('#view')&&/INPUT|SELECT/.test(a.tagName)}
let rt;function schedule(){clearTimeout(rt);rt=setTimeout(()=>{if(busyInput()){schedule();return}render()},200)}
async function init(){
 render();
 const tm=setTimeout(()=>{if(!ready){ready=true;render()}},10000);
 try{db=await window.claude?.use?.('db')}catch(e){db=null}
 try{user=await window.claude?.use?.('user')}catch(e){user=null}
 if(user){try{isOwner=!!(await user.isOwner());myId=(await user.id())||''}catch(e){}}
 if(!db){clearTimeout(tm);ready=true;render();return}
 let got=0;const done=()=>{if(++got>=3){clearTimeout(tm);ready=true;loadNames();schedule()}};
 db.doc('catalog/'+season).onSnapshot(s=>{const d=s.exists?s.data():null;if(!pend['catalog/'+season]){EXT=d?JSON.parse(JSON.stringify(d)):{prices:{},extra:[]};buildCat()}done.c||(done.c=1,done());schedule()},()=>{done.c||(done.c=1,done())});
 db.doc('settings/main').onSnapshot(s=>{if(!pend['settings/main'])SET=s.exists?JSON.parse(JSON.stringify(s.data())):{};done.s||(done.s=1,done());schedule()},()=>{done.s||(done.s=1,done())});
 db.collection('plans').onSnapshot(s=>{s.docs.forEach(d=>{const r=d.id.replace(season+'-','');if(!pend[planPath(r)])PLANS[r]={...emptyPlan(),...JSON.parse(JSON.stringify(d.data()))}});done.p||(done.p=1,done());loadNames();schedule()},()=>{done.p||(done.p=1,done())});
}
init();

function loadLib(src,test){return new Promise((ok,no)=>{if(test())return ok();const s=document.createElement('script');s.src=src;s.onload=()=>test()?ok():no(new Error('lib'));s.onerror=()=>no(new Error('lib'));document.head.appendChild(s)})}
async function deliver(blob,filename){
 let dl=null;try{dl=await window.claude?.use?.('downloads')}catch(e){}
 if(!dl){toast('Скачивание недоступно');return}
 try{await dl.save({filename,data:blob});toast('Файл готов')}catch(e){if(e&&e.code!=='declined')toast('Не удалось сохранить файл: '+(e.code||''))}
}

async function exportXlsx(){

 try{await loadLib('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js',()=>window.ExcelJS);await deliver(await buildXlsx(),fileBase()+'.xlsx')}
 catch(e){toast('Не удалось собрать Excel')}
 b.disabled=false;b.textContent='Excel';
}
function colL(n){let s='';while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s}
async function buildXlsx(){
 const E=window.ExcelJS,wb=new E.Workbook();wb.creator='CRM ФМРус';wb.calcProperties.fullCalcOnLoad=true;
 const BR='FF7C2529',INP='FFFFF7E0',GR='FFF5F4F4',LN={style:'thin',color:{argb:'FFDEDDDD'}};
 const head=c=>{c.font={bold:true,color:{argb:'FFFFFFFF'},name:'Arial',size:10};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:BR}};c.alignment={vertical:'middle',horizontal:'center',wrapText:true};c.border={top:LN,bottom:LN,left:LN,right:LN}};
 const box=c=>{c.border={top:LN,bottom:LN,left:LN,right:LN};c.font=c.font&&c.font.bold?c.font:{name:'Arial',size:10}};
 const inp=c=>{c.fill={type:'pattern',pattern:'solid',fgColor:{argb:INP}}};
 const tot=c=>{c.font={bold:true,name:'Arial',size:10};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF3EDED'}};c.border={top:{style:'medium',color:{argb:BR}},bottom:LN,left:LN,right:LN}};
 const title=(ws,t,sub)=>{ws.getCell('A1').value=t;ws.getCell('A1').font={bold:true,size:14,color:{argb:BR},name:'Arial'};ws.getCell('A2').value=sub;ws.getCell('A2').font={size:10,color:{argb:'FF63666A'},name:'Arial'}};
 const M=curMgrs(),items=sortedCat(),sub=`ТОО ФМРус · ${regTitle()} · статус: ${stText()} · выгружено ${new Date().toLocaleDateString('ru-RU')}`;
 const MONEY='#,##0',PCT='0%';
 const wsv=wb.addWorksheet('Сводка',{properties:{tabColor:{argb:'FF2A7D46'}}});

 title(ws,`План продаж на сезон ${season} по препаратам`,sub);
 const C0=7;/* A № B Препарат C Происх D Группа E ДВ F Ед G Цена */
 const fix=['№','Препарат','Происх.','Группа','Действующее вещество','Ед.','Цена, ₸ с НДС'];
 fix.forEach((t,i)=>{ws.mergeCells(4,i+1,5,i+1);const c=ws.getCell(4,i+1);c.value=t;head(c)});
 M.forEach(({m,r},k)=>{const c1=C0+1+k*2;ws.mergeCells(4,c1,4,c1+1);const c=ws.getCell(4,c1);c.value=m+(region==='all'?' ('+regOf(r).name+')':'');head(c);head(ws.getCell(4,c1+1));const a=ws.getCell(5,c1),s=ws.getCell(5,c1+1);a.value='л/кг';s.value='₸';head(a);head(s)});
 const cTL=C0+1+M.length*2,cTS=cTL+1,cQ=cTS+1;
 ws.mergeCells(4,cTL,4,cTS);ws.getCell(4,cTL).value='Итого';head(ws.getCell(4,cTL));head(ws.getCell(4,cTS));ws.getCell(5,cTL).value='л/кг';ws.getCell(5,cTS).value='₸';head(ws.getCell(5,cTL));head(ws.getCell(5,cTS));
 if(!NOQ){ws.mergeCells(4,cQ,4,cQ+3);ws.getCell(4,cQ).value='Доля по кварталам (из листа «Сезонность»)';[0,1,2,3].forEach(k=>{head(ws.getCell(4,cQ+k));const c=ws.getCell(5,cQ+k);c.value=(k+1)+' кв';head(c)})}
 const r0=6;
 items.forEach((p,i)=>{const R=r0+i,row=ws.getRow(R);
  row.getCell(1).value=i+1;row.getCell(2).value=p.name;row.getCell(3).value=p.origin||'';row.getCell(4).value=p.group;row.getCell(5).value=p.ai||'';row.getCell(6).value=p.unit;
  const pc=row.getCell(7);pc.value=price(p)||null;pc.numFmt=MONEY;inp(pc);
  M.forEach(({m,r},k)=>{const c1=C0+1+k*2;const q=row.getCell(c1);q.value=lit(r,p.id,m)||null;q.numFmt=MONEY;inp(q);const s=row.getCell(c1+1);s.value={formula:`${colL(c1)}${R}*$G${R}`};s.numFmt=MONEY});
  row.getCell(cTL).value={formula:M.map((_,k)=>colL(C0+1+k*2)+R).join('+')||'0'};row.getCell(cTL).numFmt=MONEY;
  row.getCell(cTS).value={formula:`${colL(cTL)}${R}*$G${R}`};row.getCell(cTS).numFmt=MONEY;
  if(!NOQ)[0,1,2,3].forEach(k=>{const c=row.getCell(cQ+k);c.value={formula:`IFERROR(VLOOKUP($D${R},'Сезонность'!$A$5:$E$${4+GROUPS.length},${k+2},FALSE)/100,0)`};c.numFmt=PCT;c.font={color:{argb:'FF63666A'},name:'Arial',size:9}});
  for(let c=1;c<=cQ+NQ-1;c++)box(row.getCell(c));
  row.getCell(5).font={name:'Arial',size:9,color:{argb:'FF63666A'}};
 });
 const RT=r0+items.length,rl=r0,rh=RT-1;
 const tr=ws.getRow(RT);tr.getCell(2).value='Итого';
 for(let c=C0+1;c<=cTS;c++){tr.getCell(c).value={formula:`SUM(${colL(c)}${rl}:${colL(c)}${rh})`};tr.getCell(c).numFmt=MONEY}
 for(let c=1;c<=cQ+NQ-1;c++)tot(tr.getCell(c));
 ws.getColumn(1).width=5;ws.getColumn(2).width=24;ws.getColumn(3).width=8;ws.getColumn(4).width=20;ws.getColumn(5).width=34;ws.getColumn(6).width=5;ws.getColumn(7).width=12;
 for(let c=C0+1;c<=cTS;c++)ws.getColumn(c).width=(c-C0)%2?10:14;for(let k=0;k<NQ;k++)ws.getColumn(cQ+k).width=7;
 ws.getRow(4).height=32;
 ws.pageSetup={orientation:'landscape',paperSize:9,fitToPage:true,fitToWidth:1,fitToHeight:0,printTitlesRow:'4:5',margins:{left:.3,right:.3,top:.4,bottom:.4,header:.2,footer:.2}};
 ws.headerFooter.oddFooter='&LТОО ФМРус · план продаж '+season+'&RЛист &P из &N';
 if(!NOQ){
 /* Сезонность — содержимое */
 title(wsS,'Сезонность продаж по группам препаратов','Доля годового плана группы, приходящаяся на квартал, %. Сумма по строке — 100%.');
 ['Группа','1 кв, %','2 кв, %','3 кв, %','4 кв, %','Сумма'].forEach((t,i)=>{const c=wsS.getCell(4,i+1);c.value=t;head(c)});
 GROUPS.forEach((g,i)=>{const R=5+i,row=wsS.getRow(R);row.getCell(1).value=g;season4(g).forEach((x,k)=>{const c=row.getCell(k+2);c.value=x;inp(c)});row.getCell(6).value={formula:`SUM(B${R}:E${R})`};for(let c=1;c<=6;c++)box(row.getCell(c))});
 wsS.getColumn(1).width=30;[2,3,4,5,6].forEach(c=>wsS.getColumn(c).width=10);
 /* Кварталы */
 title(wq,'План по кварталам и план/факт с переносом недобора',sub+' · жёлтые ячейки факта заполняются вручную');
 const qh=['Менеджер','Область','План 1 кв','План 2 кв','План 3 кв','План 4 кв','План год','Факт 1 кв','План 2 кв с переносом','Факт 2 кв','План 3 кв с переносом','Факт 3 кв','План 4 кв с переносом','Факт 4 кв','Факт год','Выполнение'];
 qh.forEach((t,i)=>{const c=wq.getCell(4,i+1);c.value=t;head(c)});wq.getRow(4).height=44;
 M.forEach(({m,r},k)=>{const R=5+k,row=wq.getRow(R),sc=colL(C0+2+k*2);
  row.getCell(1).value=m;row.getCell(2).value=regOf(r).name;
  [0,1,2,3].forEach(q=>{row.getCell(3+q).value={formula:`SUMPRODUCT('Матрица'!${sc}${rl}:${sc}${rh},'Матрица'!${colL(cQ+q)}${rl}:${colL(cQ+q)}${rh})`}});
  row.getCell(7).value={formula:`SUM(C${R}:F${R})`};
  [8,10,12,14].forEach(c=>inp(row.getCell(c)));
  row.getCell(9).value={formula:`IF(H${R}="",D${R},D${R}+C${R}-H${R})`};
  row.getCell(11).value={formula:`IF(J${R}="",E${R},E${R}+I${R}-J${R})`};
  row.getCell(13).value={formula:`IF(L${R}="",F${R},F${R}+K${R}-L${R})`};
  row.getCell(15).value={formula:`SUM(H${R},J${R},L${R},N${R})`};
  row.getCell(16).value={formula:`IF(O${R}=0,"",O${R}/G${R})`};
  for(let c=1;c<=16;c++){box(row.getCell(c));if(c>2)row.getCell(c).numFmt=c===16?PCT:MONEY}
 });
 const QT=5+M.length,qt=wq.getRow(QT);qt.getCell(1).value='Итого';
 for(let c=3;c<=15;c++){qt.getCell(c).value={formula:`SUM(${colL(c)}5:${colL(c)}${QT-1})`};qt.getCell(c).numFmt=MONEY}
 qt.getCell(16).value={formula:`IF(O${QT}=0,"",O${QT}/G${QT})`};qt.getCell(16).numFmt=PCT;
 for(let c=1;c<=16;c++)tot(qt.getCell(c));
 wq.getColumn(1).width=24;wq.getColumn(2).width=14;for(let c=3;c<=16;c++)wq.getColumn(c).width=14;
 wq.getCell(`A${QT+2}`).value='Недобор квартала переносится в план следующего: план с переносом = план квартала + (план с переносом предыдущего − факт предыдущего). Пока факт не вписан, берётся план квартала.';
 wq.getCell(`A${QT+2}`).font={size:9,color:{argb:'FF63666A'},name:'Arial'};
 wq.pageSetup={orientation:'landscape',paperSize:9,fitToPage:true,fitToWidth:1,fitToHeight:0};
 }
 /* Сводка — первым листом */
 title(wsv,`План продаж на сезон ${season} — ${regTitle()}`,sub);
 ['Менеджер','Область','Цель, ₸','План, ₸','% цели','Объём, л/кг'].concat(NOQ?[]:['1 кв, ₸','2 кв, ₸','3 кв, ₸','4 кв, ₸']).forEach((t,i)=>{const c=wsv.getCell(4,i+1);c.value=t;head(c)});wsv.getRow(4).height=30;
 M.forEach(({m,r},k)=>{const R=5+k,row=wsv.getRow(R);row.getCell(1).value=m;row.getCell(2).value=regOf(r).name;
  const g=row.getCell(3);g.value=+(planOf(r).goals[m])||null;inp(g);
  row.getCell(4).value={formula:`'Матрица'!${colL(C0+2+k*2)}${RT}`};row.getCell(5).value={formula:`IF(C${R}>0,D${R}/C${R},"")`};
  row.getCell(6).value={formula:`'Матрица'!${colL(C0+1+k*2)}${RT}`};
  if(!NOQ)[0,1,2,3].forEach(q=>row.getCell(7+q).value={formula:`'Кварталы'!${colL(3+q)}${5+k}`});
  for(let c=1;c<=6+NQ;c++){box(row.getCell(c));if(c>2)row.getCell(c).numFmt=c===5?PCT:MONEY}});
 const ST=5+M.length,st=wsv.getRow(ST);st.getCell(1).value='Итого';
 (NOQ?[3,4,6]:[3,4,6,7,8,9,10]).forEach(c=>{st.getCell(c).value={formula:`SUM(${colL(c)}5:${colL(c)}${ST-1})`};st.getCell(c).numFmt=MONEY});
 st.getCell(5).value={formula:`IF(C${ST}>0,SUMIF(C5:C${ST-1},">0",D5:D${ST-1})/C${ST},"")`};st.getCell(5).numFmt=PCT;for(let c=1;c<=6+NQ;c++)tot(st.getCell(c));
 wsv.getColumn(1).width=26;wsv.getColumn(2).width=14;for(let c=3;c<=6+NQ;c++)wsv.getColumn(c).width=c===5?9:15;
 const sg=ST+3;[['Составил:','____________________'],['Согласовано:','____________________'],['Утверждаю, директор:','____________________']].forEach(([a,b],i)=>{wsv.getCell(sg+i*2,1).value=a;wsv.getCell(sg+i*2,3).value=b;wsv.getCell(sg+i*2,1).font={name:'Arial',size:10}});
 wsv.getCell(sg+7,1).value='Цены, литры, цели и факт в жёлтых ячейках можно менять: остальное пересчитается по формулам.';wsv.getCell(sg+7,1).font={size:9,italic:true,color:{argb:'FF63666A'},name:'Arial'};
 wsv.pageSetup={orientation:'landscape',paperSize:9,fitToPage:true,fitToWidth:1,fitToHeight:1};
 const buf=await wb.xlsx.writeBuffer();
 return new Blob([buf]);
}

async function exportPdf(){
 const b=$('#pdf');b.disabled=true;b.textContent='Готовлю…';
 try{
  await loadLib('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',()=>window.html2canvas);
  await loadLib('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',()=>window.jspdf&&window.jspdf.jsPDF);
  const root=$('#pdfroot');root.innerHTML=pdfPages();
  try{await document.fonts.ready}catch(e){}
  const pdf=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  const pages=[...root.querySelectorAll('.pg')];
  for(let i=0;i<pages.length;i++){const cv=await window.html2canvas(pages[i],{scale:2,backgroundColor:'#ffffff',logging:false});if(i)pdf.addPage();pdf.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',0,0,297,210)}
  root.innerHTML='';
  await deliver(pdf.output('blob'),fileBase()+'.pdf');
 }catch(e){toast('Не удалось собрать PDF')}
 b.disabled=false;b.textContent='PDF';
}
function pdfPages(){
 const M=curMgrs(),t=totals(),logo=document.querySelector('.plate img').src,date=new Date().toLocaleDateString('ru-RU');
 const ph=(sub)=>`<div class="ph"><div style="display:flex;align-items:center;gap:14px"><img src="${logo}" style="height:34px"><div><div style="font-size:18px;color:#7C2529"><b style="font-weight:800">План продаж ${season}</b> <span style="font-weight:300">· ${esc(regTitle())}</span></div><div style="font-size:11px;color:#63666A">${sub}</div></div></div><div style="text-align:right;font-size:11px;color:#63666A">ТОО ФМРус<br>${esc(stText())}<br>${date}</div></div>`;
 let n=0;const pages=[];const ft=()=>`<div class="ft"><span>CRM ФМРус · план продаж ${season} · цены с НДС 16%</span><span>стр. ${++n}</span></div>`;
 /* стр. 1: сводка */
 const tot4=[0,0,0,0];
 const rows=M.map(({m,r})=>{const x=mgrTot(r,m),g=+(planOf(r).goals[m])||0,q=mgrQ(r,m);q.forEach((v,k)=>tot4[k]+=v);const pc=g?Math.round(x.s/g*100)+'%':'—';
  return `<tr><td>${esc(m)}${region==='all'?` <span style="color:#63666A">· ${regOf(r).name}</span>`:''}</td><td>${g?fmt(g):'—'}</td><td><b>${fmt(x.s)}</b></td><td>${pc}</td><td>${fmt(x.l)}</td>${NOQ?'':q.map(v=>`<td>${v?fmt(v):'—'}</td>`).join('')}</tr>`}).join('');
 const T=tot4.reduce((a,b)=>a+b,0);
 const kp=(l,v,s)=>`<div style="flex:1;background:#f5f4f4;border-radius:8px;padding:10px 14px"><div style="font-size:11px;color:#63666A">${l}</div><div style="font-size:22px;font-weight:600">${v}</div><div style="font-size:10px;color:#63666A">${s}</div></div>`;
 pages.push(`<div class="pg">${ph('Сводка по менеджерам')}
 <div style="display:flex;gap:12px;margin-bottom:16px">${kp('План, ₸ с НДС',mln(t.s),fmt(t.s)+' ₸')}${kp('Объём, л/кг',fmt(t.l),t.n+' препаратов')}${kp('Цель',t.g?mln(t.g):'—','сумма целей менеджеров')}${kp('Собрано от цели',t.g?Math.round(t.sg/t.g*100)+'%':'—',t.g?'по менеджерам с целью':'')}</div>
 <table><thead><tr><th>Менеджер</th><th>Цель, ₸</th><th>План, ₸</th><th>% цели</th><th>Объём, л/кг</th>${NOQ?'':'<th>1 кв, ₸</th><th>2 кв, ₸</th><th>3 кв, ₸</th><th>4 кв, ₸</th>'}</tr></thead><tbody>${rows}
 <tr class="tot"><td>Итого</td><td>${t.g?fmt(t.g):'—'}</td><td>${fmt(t.s)}</td><td>${t.g?Math.round(t.sg/t.g*100)+'%':'—'}</td><td>${fmt(t.l)}</td>${NOQ?'':tot4.map(v=>`<td>${fmt(v)}</td>`).join('')}</tr></tbody></table>
 ${T&&!NOQ?`<div style="display:flex;height:24px;border-radius:5px;overflow:hidden;margin-top:16px;font-size:11px;font-weight:600">${tot4.map((x,k)=>x?`<div style="width:${x/T*100}%;background:${QCOL[k]};color:${k?'#fff':'#4a1518'};display:flex;align-items:center;padding-left:8px;white-space:nowrap;overflow:hidden">${k+1} кв · ${Math.round(x/T*100)}%</div>`:'').join('')}</div>`:''}
 <div style="display:flex;gap:40px;margin-top:34px;font-size:12px"><div>Составил: ______________________</div><div>Согласовано: ______________________</div><div>Утверждаю, директор: ______________________</div></div>${ft()}</div>`);
 /* матрица: только препараты с планом */
 const items=sortedCat().filter(p=>prodTot(p.id));
 const per=19;let g0='';const chunks=[];let cur=[];
 for(const p of items){if(p.group!==g0){g0=p.group;cur.push({grp:g0})}cur.push(p);if(cur.length>=per){chunks.push(cur);cur=[]}}
 if(cur.length)chunks.push(cur);
 chunks.forEach((ch,ci)=>{
  const body=ch.map(p=>p.grp?`<tr class="grp"><td colspan="${M.length+4}" style="color:${gCol(p.grp)}">${esc(p.grp)}</td></tr>`:`<tr><td><b>${esc(p.name)}</b>${p.origin?` <span style="color:#63666A">${p.origin}</span>`:''}</td><td>${price(p)?fmt(price(p)):'—'}</td>${M.map(({m,r})=>`<td>${lit(r,p.id,m)?fmt(lit(r,p.id,m)):''}</td>`).join('')}<td><b>${fmt(prodTot(p.id))}</b></td><td><b>${fmt(prodTot(p.id)*price(p))}</b></td></tr>`).join('');
  const last=ci===chunks.length-1;
  const foot=last?`<tr class="tot"><td>Итого, ₸</td><td></td>${M.map(({m,r})=>`<td>${fmt(mgrTot(r,m).s)}</td>`).join('')}<td>${fmt(t.l)}</td><td>${fmt(t.s)}</td></tr>`:'';
  pages.push(`<div class="pg">${ph('План по препаратам, л/кг'+(chunks.length>1?` · часть ${ci+1} из ${chunks.length}`:''))}<table><thead><tr><th>Препарат</th><th>Цена, ₸</th>${M.map(({m})=>`<th>${esc(short(m))}</th>`).join('')}<th>Итого, л/кг</th><th>Итого, ₸</th></tr></thead><tbody>${body}${foot}</tbody></table>${ft()}</div>`);
 });
 return pages.join('');
}
